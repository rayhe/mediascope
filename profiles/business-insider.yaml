          note: "Target scores from Meta product framing neutral to slightly positive. Peer scores from OpenAI financial skepticism negative. Delta target minus peer equals 0.08 minus -0.42 equals 0.50. Meta more positive than OpenAI in this publication window, inverse of WIRED pattern where Meta more negative. Important nuance for cross-publication analysis."
        asymmetry_result_MANUAL_ILLUSTRATIVE:
