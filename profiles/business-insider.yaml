        - level: MODERATE
          factor: "genuine_newsworthiness"
          description: "OpenAI $100B fundraising largest in history and $143B projected losses largest startup losses in history are objectively more financially newsworthy than Meta 30 percent Reality Labs budget cuts. OpenAI cash burn $115B by 2029 more than three times previous estimate is legitimate business story. Meta supply shortage is legitimate product story. Different genuine newsworthiness may explain framing difference without entity bias."
          adjustment: "not_calculated"
        - level: WEAK
