        - level: MODERATE
          factor: "financial_relationship_does_not_prove_direction"
          description: "Axel Springer licensing deal is parent-level not Business Insider newsroom level. Deal announced Dec 2023 predates both article sets. No evidence of editorial directive linking deal to coverage. OpenAI receives both skeptical and confident framing within same article. Meta receives neutral to positive but also delay coverage. Correlation does not imply causation. Structural incentive noted as correlate not proof of editorial control. Financial relationship may be coincidental not causal."
