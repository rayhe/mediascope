      type: Type A - Competitor Coverage Deep Dive
      publication: business-insider
      competitor: openai
      status: documented
      finding: "Business Insider covers OpenAI through rigorous financial viability lens while covering Meta wearables through product timeline and supply chain lens. OpenAI Feb 10 2026 article foregrounds $143B projected losses 2024-2029 largest startup losses in history, $207B shortfall by 2030, cash incinerator quote, margin for error is thin, a lot of things need to go right, markets change no guarantee edge will endure. Includes balanced case for confidence with compute certainty framing and Khosla investor counterpoint. Meta coverage Dec 2025 to Jan 2026 foregrounds Phoenix mixed reality delay to 2027 to get details right and breathing room, Ray-Ban Display high demand waitlists into 2026 and pause wider expansion due to supply shortages, and retail expansion hiring. Meta Reality Labs cumulative losses more than $60B since 2020 noted only in Reuters background paragraph not BI lede. Framing inversion: both companies have large cumulative losses, but only OpenAI receives investor skepticism framing as lede. Language: OpenAI receives investor alarm vocabulary, Meta receives product execution vocabulary."
      business_insider_openai_articles:
        - title: "What Analysts, Investors Think About OpenAI's Path to Profitability - Can OpenAI make the numbers meet? It is a trillion-dollar question."
          date: "2026-02-10"
          authors: "Dakin Campbell, Ben Bergman"
          url: "https://www.dejavu.org/cgi-bin/get.cgi?ver=95&url=https://www.businessinsider.com/%2Fopenai-profitability-analyst-investor-opinions-funding-ipo-2026-2"
          original_path: "https://www.businessinsider.com/openai-profitability-analyst-investor-opinions-funding-ipo-2026-2"
          framing: "financial_viability_skepticism_with_balanced_confidence_counterpoint"
          key_phrases:
            - "cash incinerator"
            - "A lot of things need to go right"
            - "The margin for error is thin"
            - "The company is not yet profitable and does not have a plausible pathway to near-term profitability"
            - "largest startup losses in history"
            - "Markets change, and there is no guarantee that a technological edge, especially in this AI-driven end of the market, will endure"
          tone_notes: "Skeptical investor lens but includes CFO Friar compute certainty and Khosla investor $140B potential revenue counterpoint. Balanced within article but lede is skepticism."
          source_verification: "Archived via dejavu.org due to paywall. Original Business Insider path verified via search result title match."
        - title: "VCs are flooding Anthropic with offers to invest at up to an $800 billion valuation"
          date: "2026-04-14"
          author: "Ben Bergman"
          url: "https://www.businessinsider.com/vcs-flooding-anthropic-offers-up-to-800-billion-valuation"
          note: "Same BI author covering competitor Anthropic with valuation exuberance framing, contrasting with OpenAI skepticism same author - useful intra-author control."
          source_url: "https://www.reuters.com/legal/transactional/anthropic-draws-offers-vcs-invest-up-800-billion-valuation-business-insider-2026-04-14/"
          framing: "valuation_exuberance"
          tone_notes: "Positive momentum framing for Anthropic $800B offers versus skeptical framing for OpenAI $750-830B valuation in profitability article. Same author different competitor tone."
