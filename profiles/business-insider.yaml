      confounders:
        - level: STRONG
          factor: "beat_assignment"
          description: "OpenAI profitability article by enterprise correspondents Dakin Campbell and Ben Bergman covering venture capital and startups beat. Meta wearables articles by tech and retail beats via internal memo reporting. Different journalists with different framing norms. Enterprise beat naturally applies financial viability lens. Tech beat naturally applies product lens. Tone difference may reflect beat assignment not entity bias."
          adjustment: "not_calculated but material - beat is primary predictor of financial versus product framing"
        - level: STRONG
          factor: "market_share_and_product_stage"
          description: "Meta Ray-Ban Display $799 with neural wristband announced Sep 2025 shipping Sep 30 2025 high demand and supply shortage is concrete shipping product with 2M+ units sold since Oct 2023. OpenAI profitability is pre-IPO financial projection for private company valued $750-830B. Product stage difference legitimately predicts product versus financial framing. Market share: Meta more than 80 percent of smart glasses per BBC May 2026, first major tech player. Newsworthiness of supply shortage versus fundraising is distinct."
          adjustment: "not_calculated but material - product stage predicts framing"
        - level: STRONG
          factor: "timing_and_news_peg"
          description: "OpenAI article Feb 10 2026 pegged to $100B fundraising round aiming largest in history and IPO weighing later 2026. Meta articles Dec 2025 to Jan 2026 pegged to Phoenix delay memo and Display supply shortage announcement. Different news pegs naturally produce different framing. Financial peg produces financial framing. Supply peg produces product framing. Three month gap between OpenAI Feb and Meta Dec-Jan reduces direct comparability."
          adjustment: "not_calculated but material - news peg drives framing"
        - level: MODERATE
          factor: "sourcing_differences"
          description: "OpenAI article sources investors Charles Jaskel New Vintage Partners, George Noble ex-Fidelity, Deutsche Bank analysts $143B losses, HSBC $207B shortfall, The Information $115B burn, Ethan Choi Khosla Ventures, Rob Enderle. Meta articles source internal memo Gabriel Aul and Ryan Cairns via Business Insider. Different source pools produce different vocabulary. Investor sources use alarm vocabulary. Internal exec sources use polishing framing."
          adjustment: "not_calculated but material"
        - level: MODERATE
          factor: "financial_relationship_does_not_prove_direction"
          description: "Axel Springer licensing deal is parent-level not Business Insider newsroom level. Deal announced Dec 2023 predates both article sets. No evidence of editorial directive linking deal to coverage. OpenAI receives both skeptical and confident framing within same article. Meta receives neutral to positive but also delay coverage. Correlation does not imply causation. Structural incentive noted as correlate not proof of editorial control. Financial relationship may be coincidental not causal."
          adjustment: "not_calculated - correlation not causation"
        - level: MODERATE
          factor: "genuine_newsworthiness"
          description: "OpenAI $100B fundraising largest in history and $143B projected losses largest startup losses in history are objectively more financially newsworthy than Meta 30 percent Reality Labs budget cuts. OpenAI cash burn $115B by 2029 more than three times previous estimate is legitimate business story. Meta supply shortage is legitimate product story. Different genuine newsworthiness may explain framing difference without entity bias."
          adjustment: "not_calculated"
        - level: WEAK
          factor: "paywall_and_archiving"
          description: "Business Insider paywall limits full text verification. Dejavu archive used for OpenAI profitability article. Archive fidelity may affect tone reading. Reuters and Road to VR are secondary citations of Business Insider not direct Business Insider URLs for two Meta articles. Direct Business Insider URL for Phoenix delay not retrieved, only Reuters citation. Could introduce framing distortion via secondary outlet paraphrase."
          adjustment: "not_calculated but noted"
