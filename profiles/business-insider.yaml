          description: "Business Insider paywall limits full text verification. Dejavu archive used for OpenAI profitability article. Archive fidelity may affect tone reading. Reuters and Road to VR are secondary citations of Business Insider not direct Business Insider URLs for two Meta articles. Direct Business Insider URL for Phoenix delay not retrieved, only Reuters citation. Could introduce framing distortion via secondary outlet paraphrase."
