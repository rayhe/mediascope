      OpenAI ($50M/yr content deal) = favorable adventure framing.
      Meta (up to $50M/yr licensing) = adversarial framing.
      Anthropic (HarperCollins settlement share) = respectful framing.

      However, the EU regulation balanced coverage suggests the mechanism
