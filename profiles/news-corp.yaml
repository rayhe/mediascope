    beat_assignment_comparison:
      title: "Balanced-Control Beat Assignment Model"
      description: |
        THE KEY INSIGHT: Beat assignment itself is NEUTRAL — both NYT and
        WSJ assign dedicated Meta reporters. The asymmetry comes from the
        FINANCIAL ENVIRONMENT in which the beat operates:

        | Publication | Meta Reporter | Net Financial Incentive | Meta Tone | Disclosure |
        |---|---|---|---|---|
        | NYT | Kashmir Hill | Anti-Meta ($22.8M comp, $0 Meta) | -0.80 | Never |
        | WIRED | Lauren Goode | Anti-Meta ($19M+ comp, $0 Meta) | -0.85 | Never |
        | WSJ | Bobrowsky | Balanced ($50M Meta, $50M OpenAI) | -0.15 | Always |
        | Gizmodo | Kyle Barr | Zero (no deals) | -0.50 | N/A |
        | Guardian | Dan Milmo | Anti-Meta ($7M comp, $0 Meta) | -0.45 | Never |
        | FT | Heikkilä | Anti-Meta ($11.5M comp, $0 Meta) | -0.45 | Never |

        At one-sided publications (NYT, WIRED, Guardian, FT), beat assignment
        CONCENTRATES adversarial energy on Meta — the company with NO financial
        tie. At the balanced publication (WSJ), the same beat assignment
        structure produces mixed-tone reporting that tracks event valence
        rather than systematic bias.

        This is the strongest evidence in the dataset that financial
        relationships AMPLIFY editorial direction rather than beat
        assignment itself being the mechanism of bias.

    wsj_beat_structure:
      description: |
        WSJ's tech desk assigns beat reporters by company, same as NYT.
        The structural difference is financial environment, not editorial
        organization.
      beats:
        - reporter: "Meghan Bobrowsky"
          beat: "Meta"
          news_corp_financial_tie: "$50M/yr (Meta AI licensing)"
          net_incentive: "balanced"
        - reporter: "Berber Jin"
          beat: "OpenAI / AI startups"
          news_corp_financial_tie: "$50M/yr (OpenAI content licensing)"
          net_incentive: "balanced"
          disclosure_observed: true
          notes: |
            Jin's Jul 31 "How OpenAI Lost Its AI Crown" article did NOT
            include the News Corp-OpenAI disclosure. However, other WSJ
            articles about OpenAI (by Keach Hagey, Georgia Wells, etc.)
            DO include disclosure. The omission may be article-specific
            rather than systemic.
        - reporter: "Robert McMillan"
          beat: "Cybersecurity"
          notes: "Covers AI rogue incidents across all companies equally"
        - reporter: "Christopher Mims"
          beat: "Tech columnist (cross-entity)"
          notes: "See separate Mims profile above"

    asymmetry_verdict: |
      Bobrowsky represents what dedicated Meta beat reporting looks like
      when the publication has ZERO net financial incentive to favor
      competitors. Her average tone (-0.15) is 0.65 points warmer than
      Kashmir Hill (-0.80) and 0.70 points warmer than Lauren Goode (-0.85)
      on the same company.

      The gap cannot be explained by access (Hill has Zuckerberg access too),
      personal bias (Bobrowsky was explicitly assigned to Meta, just like
      Hill), or editorial standards (WSJ is if anything more rigorous).
      The explanatory variable is the FINANCIAL ENVIRONMENT: News Corp's
      balanced deals ($50M each side) eliminate the financial amplification
      effect that concentrates adversarial energy at one-sided publications.

      Combined with WSJ's disclosure practice, Bobrowsky's coverage is the
      cleanest baseline for what Meta reporting looks like when financial
      conflicts are both balanced and transparent.


