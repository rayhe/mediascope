# ===================================================================
# MEDIASCOPE CONTROL DESIGNATION
# ===================================================================
control_designation:
  type: "balanced_control"
  rationale: "News Corp receives comparable payments from both OpenAI ($50M/yr) and Meta (up to $50M/yr). If financial incentives drive coverage tone, News Corp should show balanced coverage of both. Deviation from balance in either direction would suggest editorial bias beyond financial incentive."
  comparison_baseline: true

# ===================================================================
# DISCLOSURE PRACTICE — WSJ is the ONLY publication that discloses
# Added: 2026-08-06 for cross-entity analysis
# ===================================================================
disclosure_practice:
  policy_type: "editorial_policy"
  description: |
    WSJ is the ONLY publication in the MediaScope dataset that
    systematically discloses its parent company's financial relationships
    with the subjects of its articles. This is an editorial policy, not
    individual journalist choice — the same disclosure language appears
    across articles by different reporters on different beats.
    
    The disclosure appears as a standalone sentence, typically near the end
    of articles, in the format: "News Corp, owner of The Wall Street Journal,
    has a content-licensing partnership with [Entity]."
    
    KEY CONTRAST: WIRED (OpenAI deal), The Verge (OpenAI deal via Vox Media),
    The Atlantic (OpenAI deal), FT (OpenAI deal), NYT (Amazon/Bezos ownership),
    and Guardian (OpenAI deal via ProRata) NEVER disclose their financial
    relationships in their coverage. WSJ — the only publication with deals
    on BOTH sides — is also the only one that discloses. The publications
    with one-sided financial incentives (and thus the most bias potential)
    never reveal those incentives to readers.
  unique_in_dataset: true
  meta_disclosure_text: "News Corp, owner of The Wall Street Journal, has a content-licensing partnership with Meta."
  openai_disclosure_text: "News Corp, owner of The Wall Street Journal, has a content-licensing partnership with OpenAI."
  observed_reporters:
    - "Meghan Bobrowsky"
    - "Georgia Wells"
    - "Katie Deighton"
    - "Keach Hagey"
    - "Ben Eisen"
    - "Amanda Coletta"
    - "Tina Li"
  example_articles:
    - title: "Meta Releases Coding Agent to Compete With OpenAI and Anthropic"
      date: "2026-08-05"
      disclosure_entity: "Meta"
      reporters: "Meghan Bobrowsky, Tina Li"
      source_url: "https://www.wsj.com/tech/ai/meta-releases-coding-agent-to-compete-with-openai-and-anthropic-af87b517"
    - title: "The Teachers Getting $50,000 Bonuses Thanks to a Massive Meta Data Center"
      date: "2026-06-12"
      disclosure_entity: "Meta"
      reporters: "Meghan Bobrowsky, Ben Eisen"
      source_url: "https://www.wsj.com/us-news/education/the-teachers-getting-50-000-bonuses-thanks-to-a-massive-meta-data-center-b4631d05"
    - title: "AI Chatbots Know How to Make Deadly Biological Weapons"
      date: "2026-07-26"
      disclosure_entity: "OpenAI"
      source_url: "https://www.wsj.com/tech/ai/openai-chatbot-biological-weapons-poison-3d808e6c"
    - title: "OpenAI Investigated by Coalition of State Attorneys General"
      date: "2026-06-13"
      disclosure_entity: "OpenAI"
      reporters: "Keach Hagey, Georgia Wells"
      source_url: "https://www.wsj.com/tech/openai-investigated-by-coalition-of-state-attorneys-general-088a3928"
    - title: "OpenAI's Top Executive Fidji Simo to Take Medical Leave"
      date: "2026-06-03"
      disclosure_entity: "OpenAI"
      source_url: "https://www.wsj.com/tech/openais-top-executive-fidji-simo-to-take-medical-leave-from-company-d6fab97c"
