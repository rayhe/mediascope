    (3) EU regulation balanced baseline proving topic-dependency,
    (4) 6+ Anthropic articles providing statistical depth.
    Lower than Joanna Stern (0.85) because Schechner EU regulation
    baseline shows he CAN be balanced — the asymmetry is topic-dependent
    rather than systematic. Lower than Paresh Dave (0.82) because
    Schechner has fewer meta-critical articles in total.
    '
