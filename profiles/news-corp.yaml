# ===================================================================
# MEDIASCOPE CONTROL DESIGNATION
# ===================================================================
control_designation:
  type: "balanced_control"
  rationale: "News Corp receives comparable payments from both OpenAI ($50M/yr) and Meta (up to $50M/yr). If financial incentives drive coverage tone, News Corp should show balanced coverage of both. Deviation from balance in either direction would suggest editorial bias beyond financial incentive."
