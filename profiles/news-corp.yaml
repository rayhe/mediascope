    reverse_heikkila_pattern: |
      Stern's trajectory is the MIRROR IMAGE of Melissa Heikkilä's:
      - Heikkilä: independent (MIT TR, zero deals) → entangled (FT, 3 deals)
        → Meta coverage MORE adversarial / absent at FT
      - Stern: balanced employer (News Corp, equal deals) → independent (zero deals)
        → Meta coverage shifts from positive to adversarial

      Both migrations confirm: the direction of financial-structure change
      predicts the direction of Meta coverage tone change. Whether entering
      or leaving financial entanglement, the journalist's Meta coverage
      moves toward adversarial.

      The KEY DIFFERENCE: Heikkilä's shift was toward ABSENCE (Meta just
      doesn't get covered at FT); Stern's shift was toward ACTIVE
      INVESTIGATION (Meta becomes the primary target). The mechanism differs
      but the direction is the same.

    audience_economics_mechanism: |
      As an independent creator, Stern's revenue now depends on:
      1. YouTube algorithm: anti-Meta investigative content generates engagement
      2. Newsletter subscriptions: provocative investigations drive sign-ups
      3. NBC News licensing: investigative pieces earn more broadcast airtime
      4. Sponsored content: tech sponsors cannot be companies you're investigating

      None of these revenue streams penalize anti-Meta coverage. All reward it.
      Samsung, Google, and Amazon are all POTENTIAL sponsors or partners for
      an independent tech media venture — investigating them carries real
      financial risk. Meta (which has zero advertising or content deals with
      independent creators) carries zero financial risk to investigate.

    counter_arguments:
      legitimate_journalism: |
        The stealth mode story IS genuine, legitimate journalism that drove
        real-world change (Meta firmware update). The question is not whether
        the story is valid — it is — but why IDENTICAL privacy concerns at
        Samsung (identical 12MP camera, identical LED design), Amazon Ring
        (DEPLOYED facial recognition, FTC settlement), and Google/Android XR
        receive zero investigative effort.
      target_selection_not_quality: |
        Stern is a veteran journalist (12 years WSJ, Emmy, Pulitzer finalist).
        The career migration didn't change her journalism QUALITY — it changed
        her target SELECTION. At WSJ she covered all companies equally; as
        an independent she concentrates investigative energy on Meta.
      timing: |
        The LED modding market grew during Stern's WSJ tenure but was first
        investigated only after she left. At WSJ, such an investigation would
        have been complicated by News Corp's $50M Meta deal. As an independent,
        no such complication exists.

