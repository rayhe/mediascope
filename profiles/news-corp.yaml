# ===================================================================
# NEWS CORP PUBLICATION PROFILE — balanced control for MediaScope
# Created: 2026-08-04
# Purpose: News Corp is the only major publisher with both OpenAI
#   AND Meta AI licensing deals, making it the balanced control for
#   cross-entity coverage asymmetry analysis.
# ===================================================================

name: "News Corp"
slug: "news-corp"
url: "https://www.newscorp.com"
type: "diversified_news_media"
publications:
  - "The Wall Street Journal"
  - "New York Post"
  - "Barron's"
  - "MarketWatch"
  - "The Times (London)"
  - "The Sun"
  - "The Australian"
  - "HarperCollins"

rss_feeds:
  - name: wsj_us
    url: "https://feeds.a.dj.com/rss/RSSWorldNews.xml"
  - name: nypost
    url: "https://nypost.com/feed/"

# ===================================================================
# OWNERSHIP CHAIN
# ===================================================================
ownership_chain:
  - entity: "The Wall Street Journal / New York Post / Barron's"
    type: "publication"
    parent: "Dow Jones & Company"
  - entity: "Dow Jones & Company"
    type: "subsidiary"
    parent: "News Corp"
  - entity: "News Corp"
    type: "parent_company"
    ticker: "NWSA / NWS"
    ceo: "Robert Thomson"
    chairman: "Lachlan Murdoch"
    structure: "Dual-class share structure. Murdoch family controls ~40% of voting power via Class B shares."
    market_cap: "~$17B (2026)"

# ===================================================================
# REVENUE RELATIONSHIPS — AI licensing deals
# News Corp is UNIQUE: it has significant deals with BOTH Meta and OpenAI
# ===================================================================
revenue_relationships:
  - partner: "OpenAI"
    type: "ai_licensing"
    value: "$250M over 5 years ($50M/yr)"
    signed: "May 2024"
    scope: "Content from WSJ, NY Post, Barron's, MarketWatch, The Times, The Sun used for ChatGPT training and retrieval"
    source_url: "https://venturebeat.com/ai/openai-partners-with-the-atlantic-and-the-verge-publisher-vox-media"
    verified: true
  - partner: "Meta"
    type: "ai_licensing"
    value: "Up to $50M/yr, 3-year deal"
    signed: "March 2026"
    scope: "US and UK content for Meta AI training and retrieval. Archives included."
    source_url: "https://www.wsj.com/business/media/news-corp-meta-in-ai-content-licensing-deal-worth-up-to-50-million-a-year-d4fbf244"
    verified: true
  - partner: "Apple"
    type: "news_distribution"
    value: "undisclosed"
    scope: "WSJ available on Apple News+. Revenue sharing arrangement."
    verified: true

# ===================================================================
# EDITORIAL LEADERSHIP
# ===================================================================
