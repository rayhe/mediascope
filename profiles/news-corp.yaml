litigation_connections:
- case: News Corp vs Perplexity AI
  type: copyright
  status: active
  description: Two News Corp subsidiaries sued Perplexity for copyright infringement.
- case: News Corp vs Brave Software (countersuit)
  type: copyright_countersuit
  status: active
  filed: '2026-07-22'
  court: N.D. Cal. (Oakland)
  description: 'News Corp filed countersuit against Brave Software, accusing it of

    "flagrant theft" in distributing and selling versions of WSJ and

    NY Post articles to AI companies via covert scraping. Thomson on

    Q4 call: "Brave, a company brave in name only, which has shamelessly

    stolen our content at scale." Allegations: masked web crawlers

    scanning pages, repackaging stolen files, delivering near-verbatim

    copies to enterprise customers. Seeking injunction + up to $150,000

    per infringement. News Corp''s key argument: "The more content Brave

    copies and sells, the more revenue it generates, and the less

    incentive AI companies have to negotiate licenses with the publishers

    who produced the content."

    '
  source_urls:
  - https://www.reuters.com/business/media-telecom/news-corp-countersues-brave-allegedly-scraping-articles-ai-2026-07-22/
  - https://www.editorandpublisher.com/stories/news-corp-accuses-search-engine-brave-of-ai-copyright-infringement,262712
  background: 'Brave preemptively sued News Corp in Mar 2025, seeking declaration

    that indexing/scraping was fair use. Brave argued all search engines

    must index to exist. Revised complaint May 2026 after failed

    negotiations. Thomson called it "piratical, parasitical practices."

    '
  mediascope_relevance: 'Demonstrates News Corp''s "woo and sue" strategy in action: partners

    with companies that pay (OpenAI, Meta) while suing companies that

    scrape without paying (Perplexity, Brave). This is the clearest

    evidence that News Corp views content licensing as a revenue strategy,

    not just an editorial arrangement. The Brave suit specifically argues

    that unlicensed scraping UNDERMINES the licensing market News Corp has

    built with OpenAI and Meta — making the licensing deals and the

    litigation part of a unified commercial strategy.

    '
bias_ratings:
- source: AllSides
  rating: Center (WSJ news), Right (WSJ editorial)
- source: Ad Fontes Media
  rating: 'WSJ: Reliable, center-right editorial'
control_designation:
  type: balanced_control
  rationale: 'News Corp receives comparable payments from both OpenAI ($50M/yr) and

    Meta (up to $50M/yr), plus expected Anthropic settlement revenue via

    HarperCollins. If financial incentives drive coverage tone, News Corp

    should show balanced coverage of both OpenAI and Meta. As of Q4 FY2026,

    AI licensing is confirmed as a material revenue driver by CFO

    Chandrashekar, with the Meta deal now contributing to results.

    Deviation from balance in either direction would suggest editorial

    bias beyond financial incentive.

    '
  comparison_baseline: true
  triple_revenue_note: 'News Corp is the ONLY publisher in the MediaScope dataset receiving

    AI-related revenue from THREE major AI companies simultaneously:

    (1) OpenAI: $50M/yr content licensing (voluntary, signed May 2024)

    (2) Meta: Up to $50M/yr content licensing (voluntary, signed Mar 2026)

    (3) Anthropic: Share of $1.5B settlement (litigation-driven, expected 2026)


    PLUS significant deals in pipeline with "several other honorable

    companies" per Thomson''s Q4 FY2026 call (Aug 5, 2026).


    This triple-revenue architecture creates the MOST diversified AI

    revenue stream of any publisher in the dataset. Compare:

    - Condé Nast: OpenAI + Amazon Rufus + Microsoft PCM + Perplexity (4 sources, NO Meta)

    - NYT: Amazon (1 source, suing OpenAI/Microsoft, NO Meta)

    - News Corp: OpenAI + Meta + Anthropic settlement (3 sources, BALANCED)


    The key analytical distinction: News Corp is the ONLY publisher with

    revenue from both Meta AND its competitors. All other multi-deal

    publishers have deals ONLY with Meta''s competitors, creating one-sided

    financial incentives to favor those competitors and produce adversarial

    Meta coverage.

    '
factiva_marketplace_role:
  mechanism_id: 100
  overview: 'News Corp operates a DUAL financial role in the AI content licensing
    ecosystem: (1) as a publisher selling content directly to AI companies
    (OpenAI $50M/yr, Meta up to $50M/yr), and (2) as a MARKETPLACE OPERATOR
    through Factiva (Dow Jones subsidiary) selling AI licensing rights to
    8,100+ news sources — more than 25% of all Factiva news sources.

    This dual role is unique among MediaScope-profiled publishers and creates
    a financial incentive structure beyond simple bilateral content deals.
    '
  factiva_ai_licensing:
    news_sources_with_ai_rights: 8100
    pct_of_total_factiva_sources: 25
    description: 'Factiva now sells access to rights-cleared content for AI use.
      Financial institutions feed the licensed content into AI tools for
      real-time trading decisions. Factiva CEO (and Dow Jones CEO) Almar
      Latour: "The industry is working toward a new business model to
      value information in the era of gen AI."
      '
    use_cases:
    - enterprise_ai_tools
    - real_time_trading
    - financial_analysis
    - knowledge_retrieval
    parent_unit: Dow Jones
  dual_role_implications:
    description: 'News Corp is simultaneously:
      (1) A SELLER of its own content to OpenAI and Meta (bilateral deals)
      (2) An INTERMEDIARY facilitating other publishers'' AI content deals via Factiva
      (3) A LITIGANT suing companies that scrape without paying (Perplexity, Brave)

      This triple role creates:
      - Commission/margin revenue from other publishers'' AI licensing
      - Strategic intelligence about deal terms across the industry
      - Competitive moat as gatekeeper between smaller publishers and AI companies
      - Editorial conflict: WSJ coverage of AI content deals directly affects
        the market that its sibling (Factiva) operates in
      '
    marketplace_competitors:
    - Microsoft PCM (8 publishers including Condé Nast, Hearst, Vox Media, AP)
    - Amazon AWS Marketplace (building, Feb 2026)
    - Snowflake Cortex (17 publishers including WashPost, AP, USA Today)
    - Tollbit (bot-gating service, Newsweek customer)
    microsoft_pcm_investment: '>$10M including payments to publishers (Tim Frank, MS CVP)'
    wsj_self_disclosure: 'The WSJ article (Jul 2, 2026) that reported on Factiva''s
      marketplace included the disclosure: "Factiva and The Wall Street
      Journal are both part of News Corp''s Dow Jones unit. News Corp has
      a content deal with OpenAI. Two of News Corp''s subsidiaries have
      sued Perplexity." This is consistent with WSJ''s unique disclosure
      practice — they are the ONLY profiled publication that consistently
      discloses parent company conflicts.
      '
  mediascope_significance: 'The Factiva marketplace role adds a 4th dimension to News Corp''s
    financial incentive analysis. Beyond bilateral deals (OpenAI, Meta,
    Anthropic settlement), News Corp profits from the GROWTH of the
    AI content licensing market itself. This means:
    (1) News Corp has an incentive for ALL AI companies to license content
        (not just its direct partners), because more licensing = more
        Factiva marketplace revenue
    (2) News Corp has an incentive AGAINST unlicensed scraping (which
        undermines both its bilateral deals AND its marketplace business)
    (3) This aligns Thomson''s "woo and sue" strategy with Factiva''s
        commercial interests — litigation against scrapers protects both
        News Corp''s own content AND the broader licensing market Factiva operates in
    (4) As marketplace operator, News Corp''s editorial coverage of AI
        content deals is inherently conflicted — WSJ reporting on the
        growth/contraction of AI licensing directly affects Factiva revenue
    '
  source_urls:
