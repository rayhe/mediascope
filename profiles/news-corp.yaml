# ===================================================================
# LITIGATION
# ===================================================================
litigation_connections:
  - case: "News Corp vs Perplexity AI"
    type: "copyright"
    status: "active"
    description: "Two News Corp subsidiaries sued Perplexity for copyright infringement."
  - case: "News Corp vs Brave Software (countersuit)"
    type: "copyright_countersuit"
    status: "active"
    filed: "2026-07-22"
    court: "N.D. Cal. (Oakland)"
    description: |
      News Corp filed countersuit against Brave Software, accusing it of
      "flagrant theft" in distributing and selling versions of WSJ and
      NY Post articles to AI companies via covert scraping. Thomson on
      Q4 call: "Brave, a company brave in name only, which has shamelessly
      stolen our content at scale." Allegations: masked web crawlers
      scanning pages, repackaging stolen files, delivering near-verbatim
      copies to enterprise customers. Seeking injunction + up to $150,000
      per infringement. News Corp's key argument: "The more content Brave
      copies and sells, the more revenue it generates, and the less
      incentive AI companies have to negotiate licenses with the publishers
      who produced the content."
    source_urls:
      - "https://www.reuters.com/business/media-telecom/news-corp-countersues-brave-allegedly-scraping-articles-ai-2026-07-22/"
      - "https://www.editorandpublisher.com/stories/news-corp-accuses-search-engine-brave-of-ai-copyright-infringement,262712"
    background: |
      Brave preemptively sued News Corp in Mar 2025, seeking declaration
      that indexing/scraping was fair use. Brave argued all search engines
      must index to exist. Revised complaint May 2026 after failed
      negotiations. Thomson called it "piratical, parasitical practices."
    mediascope_relevance: |
      Demonstrates News Corp's "woo and sue" strategy in action: partners
      with companies that pay (OpenAI, Meta) while suing companies that
      scrape without paying (Perplexity, Brave). This is the clearest
      evidence that News Corp views content licensing as a revenue strategy,
      not just an editorial arrangement. The Brave suit specifically argues
      that unlicensed scraping UNDERMINES the licensing market News Corp has
      built with OpenAI and Meta — making the licensing deals and the
      litigation part of a unified commercial strategy.

