      CONTROLS for the reporter variable. The same person, covering the same
      class of event, at the same publication, in the same month, applies
      three distinct registers. The asymmetry cannot be attributed to reporter
      personal bias because: (a) Schechner co-authors with McMillan on BOTH
      the OpenAI (adventure) AND Meta (adversarial) stories, (b) his EU
      regulation coverage across ALL companies is balanced.

