    title: "Editor-in-Chief, The Wall Street Journal"
  - name: "Keith Poole"
    title: "Editor-in-Chief, New York Post"

# ===================================================================
# KNOWN CONFLICTS OF INTEREST
# ===================================================================
known_conflicts:
  - type: "balanced_commercial"
    description: "News Corp is the only major publisher with significant AI licensing deals with BOTH OpenAI ($50M/yr) AND Meta (up to $50M/yr). This balanced financial relationship makes it a valuable control for measuring coverage asymmetry."
