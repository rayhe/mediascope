# ===================================================================
# MEDIASCOPE CONTROL DESIGNATION
# ===================================================================
control_designation:
  type: "balanced_control"
  rationale: |
    News Corp receives comparable payments from both OpenAI ($50M/yr) and
    Meta (up to $50M/yr), plus expected Anthropic settlement revenue via
    HarperCollins. If financial incentives drive coverage tone, News Corp
    should show balanced coverage of both OpenAI and Meta. As of Q4 FY2026,
    AI licensing is confirmed as a material revenue driver by CFO
    Chandrashekar, with the Meta deal now contributing to results.
    Deviation from balance in either direction would suggest editorial
    bias beyond financial incentive.
  comparison_baseline: true
  triple_revenue_note: |
    News Corp is the ONLY publisher in the MediaScope dataset receiving
    AI-related revenue from THREE major AI companies simultaneously:
    (1) OpenAI: $50M/yr content licensing (voluntary, signed May 2024)
    (2) Meta: Up to $50M/yr content licensing (voluntary, signed Mar 2026)
    (3) Anthropic: Share of $1.5B settlement (litigation-driven, expected 2026)
    
    PLUS significant deals in pipeline with "several other honorable
    companies" per Thomson's Q4 FY2026 call (Aug 5, 2026).
    
    This triple-revenue architecture creates the MOST diversified AI
    revenue stream of any publisher in the dataset. Compare:
    - Condé Nast: OpenAI + Amazon Rufus + Microsoft PCM + Perplexity (4 sources, NO Meta)
    - NYT: Amazon (1 source, suing OpenAI/Microsoft, NO Meta)
    - News Corp: OpenAI + Meta + Anthropic settlement (3 sources, BALANCED)
    
    The key analytical distinction: News Corp is the ONLY publisher with
    revenue from both Meta AND its competitors. All other multi-deal
    publishers have deals ONLY with Meta's competitors, creating one-sided
    financial incentives to favor those competitors and produce adversarial
    Meta coverage.

# ===================================================================
# DISCLOSURE PRACTICE — WSJ is the ONLY publication that discloses
# Added: 2026-08-06 for cross-entity analysis
# ===================================================================
disclosure_practice:
  policy_type: "editorial_policy"
  description: |
    WSJ is the ONLY publication in the MediaScope dataset that
    systematically discloses its parent company's financial relationships
    with the subjects of its articles. This is an editorial policy, not
    individual journalist choice — the same disclosure language appears
    across articles by different reporters on different beats.
    
    The disclosure appears as a standalone sentence, typically near the end
    of articles, in the format: "News Corp, owner of The Wall Street Journal,
    has a content-licensing partnership with [Entity]."
    
    KEY CONTRAST: WIRED (OpenAI deal), The Verge (OpenAI deal via Vox Media),
    The Atlantic (OpenAI deal), FT (OpenAI deal), NYT (Amazon/Bezos ownership),
    and Guardian (OpenAI deal via ProRata) NEVER disclose their financial
    relationships in their coverage. WSJ — the only publication with deals
    on BOTH sides — is also the only one that discloses. The publications
    with one-sided financial incentives (and thus the most bias potential)
    never reveal those incentives to readers.
  unique_in_dataset: true
