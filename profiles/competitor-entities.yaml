        google_implementation:
          date: '2026-06-03'
          action: Begin testing new control on subset of UK-based media sites allowing management of links/content in AI search features (AI Overviews, AI Mode), aim global rollout (Google via Computer Weekly Jun 4 2026)
          blogpost: Jun 3 2026 Google Search Ecosystem blogpost by Mrinalini Loew
          control_framing: Controls will not be used as a ranking signal for search results outside the generative AI search features (Loew via Computer Weekly Jun 4 2026)
        neutralization_via_private_contract: If most UK publishers sign 2-year NDA/no-sue deals granting broad AI training/grounding/AI Mode rights, they contractually waive CMA-granted rights. CMA grants opt-out; private contract grants Google right to use content for training. Private ordering supersedes regulatory default when publishers sign. Press Gazette Aug 2026 notes secret AI deals could make CMA ruling largely irrelevant if most UK publishers sign hard-fought rights away. 2-year term aligns with prediction that Google could completely win consumer AI market within term after which it doesn't have to pay publishers anything - rendering opt-out moot after training data ingested and models trained.
      prisoner_dilemma_collective_action:
        frame: Prisoner's dilemma (Press Gazette explainer Aug 2026) - two accused offered reduced-sentence deals independently
        payoff_both_cooperate: Might serve 1 year (collective bargain for universally applied fair payment model, historical bargain Google scraped entire websites free for substantial traffic) (Press Gazette Aug 2026)
        payoff_both_betray: Each serve 2 years (private deals cash + little referral traffic short-term but help Google strengthen hold on UK market, 36B page views Apr 2026 up 31% YoY more than next 24 biggest publishers combined per Press Gazette) (Press Gazette Aug 2026)
        payoff_one_betrays: Traitor goes free competitor gets cash + small traffic, defector faces 3-year sentence - If your competitor has a deal and you are opting out they get the small amount of traffic and the cash there is no upside to saying no (industry source Press Gazette Aug 2026)
        industry_quotes:
          divide_and_rule: Strategy described by well-placed industry source advising major publishers on AI strategy as divide and rule (Press Gazette Aug 2026)
          no_upside: If your competitor has a deal and you are opting out, they get the small amount of traffic and the cash. There is no upside to saying no. (Press Gazette Aug 2026)
          already_caved: It is the prisoner's dilemma because your competitors have already caved (Press Gazette Aug 2026)
          consumer_ai_win: In two years time Google could have completely won consumer AI market - as soon as that happens it doesn't have to pay publishers anything (Press Gazette Aug 2026)
          renting_peace: These deals don't have product value they are renting peace and that means deals will go away (source with close knowledge of Google Press Gazette Aug 2026)
          no_sue_interpretation: More accurately described as no-sue deals (same source Press Gazette Aug 2026)
          game_dominance: This is Google's game. They are gonna dominate here. There is no fair deal discussions that can happen with Google. It is really a matter of how much money they want to drop on an individual organization. (Jason Kint via NY Post Jun 26 2026)
          layoff_risk: You've got that Showcase deal built into your annual plan, and if it goes away because you're not willing to do this new deal, which might be even a little bit more revenue, then you're probably doing layoffs of your newsroom (Kint Press Gazette Aug 2026)
          legal_cost_barrier: If you go the other route and you say I'm going to instead sue Google for trying to exert force on me to do this, then you're dealing with hundreds of millions of legal costs - Very few are going to want to do anything except sign the deal with Google. (Kint Press Gazette Aug 2026)
        market_concentration:
          google_uk_page_views_apr_2026: 36B up 31% YoY more than next 24 biggest publishers combined (Press Gazette Aug 2026 citing Apr data)
          google_uk_adspend_2025: GBP 21.5B up 7.5% YoY (Press Gazette analysis Aug 2026)
