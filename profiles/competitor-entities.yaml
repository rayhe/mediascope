      settle_and_silence_strategy: 'Google''s legal team systematically settles
        children''s safety cases before they generate sustained media coverage.
        Each settlement removes YouTube from the active litigation narrative,
        concentrating media attention on Meta, and keeps settlement amounts
        low enough to avoid sustained stock price impact ($200M against $2.4T
        market cap = 0.008%). The strategy is structurally rational — NOT
        evidence of coordination — but its effect on media coverage is
        identical to what coordination would produce.
