      - best-of lists
      - buying guides
      - product reviews
      mediascope_implications:
        meta_zero_deals: 'Meta has zero publisher deals → zero citation premium → zero financial incentive for favorable coverage. The asymmetry is now QUANTIFIED: publishers with OpenAI deals get +48% ChatGPT citations; publishers covering Meta get +0%.'
        conde_nast_incentive: Condé Nast is the 4th largest citation beneficiary among licensed publishers. Their OpenAI deal (Aug 2024) generates measurably more ChatGPT citations for WIRED, Vogue, GQ, The New Yorker, etc. Adversarial OpenAI coverage could jeopardize the deal and its citation premium - a quantifiable financial disincentive against critical OpenAI coverage.
        financial_incentive_loop: 'Deal → +48% ChatGPT citations → more traffic → more ad/subscription revenue → incentive to maintain deal → softer coverage → deal renewed. The study proves the first link: deals produce measurably more AI visibility.'
        apple_variable_pay_amplifier: 'Apple Siri AI variable pay-per-use deals (nine-figure budget, Aug 2026) would compound this effect: more AI citations → more per-use payments → stronger financial incentive → deeper editorial capture.'
      confounding_factors:
