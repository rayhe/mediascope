          AI builders — controlling the marketplace infrastructure itself,
          like Amazon's emerging AI content marketplace but further along.
      - name: copilot_daily_content
        detail: |
          Paid content partnerships for AI-voiced news summaries in Copilot
          Daily (launched Oct 2024). Partners: Reuters, Axel Springer,
          Hearst Magazines, USA TODAY Network, Financial Times. Separate
          from PCM — these are direct bilateral deals for Copilot-specific
