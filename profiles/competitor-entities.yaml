            publisher deal-maker (OpenAI). Makes Apple editorially neutral
            to publishers — no financial incentive to be soft or hard.
        (3) SIRI DIVERSIFICATION: Apple testing Claude + Gemini alongside
            ChatGPT means publisher content licensed to OpenAI may flow
            through Apple devices via multiple AI backends.
      source_urls:
      - https://www.reuters.com/business/openai-explores-legal-options-against-apple-bloomberg-news-reports-2026-05-14/
      - https://www.macrumors.com/2026/07/10/apple-sues-openai/
