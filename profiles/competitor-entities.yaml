      overview: 'Adweek reported Aug 2026 (updated story) that Amazon quietly restructured Associates program: slashed commission rates by up to 50% (premium 10% → 4-5%), eliminated milestone-based incentive tiers and year-over-year performance bonuses, degraded reporting (tracking-ID threshold 1→4 sales, removed SKU/ASIN granularity → category-only, revoked premium APIs), concentrated cuts in product development + client services with layoffs, operational directive to cut program costs 20%. Rollout: Asia-Pacific late 2025 → US Mar 9 2026. Publishers learned via individual account managers, not public announcement. One deal-site publisher revised 2026 Amazon revenue forecast down 50%. Recurrent Ventures CEO Andrew Perlman quoted: Google AI Overviews collapsing organic traffic at top funnel + Amazon paying less at bottom = super challenging. Amazon statement: changes affect tiny fraction, highly competitive commissions, continue bonuses. Amazon laid off thousands early 2026, Associates account
        managers among cuts. Strategic reorientation toward creators/influencers deemed more incremental than traditional affiliate publishers. Some publishers exited entirely as not strategic. Publishers routing commerce traffic to Walmart, Target, Best Buy, Wayfair, eBay. Quote: short-term bad, medium-term excellent - Amazon forced diversification overdue. This is 4th financial channel beyond advertising/AWS/dual-lab-equity: affiliate dependency. Publications with heavy Wirecutter-style affiliate operations (NYT/Wirecutter, Condé Nast, Hearst, Vox Media, Ziff Davis) face amplified Amazon dependency - not just ads but direct commerce revenue - creating structural incentive for softer Amazon/Rufus/Alexa coverage while covering Meta (no affiliate relationship) adversarially.'
