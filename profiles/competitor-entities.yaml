      mediascope_relevance: "Apple's content bypass strategy creates a FOURTH implication for\nMediaScope (extending the three from openai_partnership_collapse):\n(4) CONDÉ NAST DOUBLE LOSS: Condé Nast was approached for an Apple\n    deal ($50M) and apparently declined or stalled. Now their content\n    flows through Apple devices anyway via Google Gemini - but they\n    receive nothing from Apple for it. Meanwhile, they DO receive\n    payments from OpenAI (content deal, Aug 2024), Amazon (Rufus\n    deal, Jul 2025), and Microsoft (PCM deal, Feb 2026). The only\n    companies NOT paying Condé Nast are Apple (bypassed via Google)\n    and Meta (no deal). Yet WIRED's coverage targets Meta as the\n    primary adversary, not Apple - despite Apple's bypass being\n    arguably more damaging to publisher revenue than Meta's model\n    of offering voluntary direct licensing.\n"
