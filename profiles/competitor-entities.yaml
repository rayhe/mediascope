        with Apple''s competitive positioning: (1) Apple News+ publishers earn

        revenue from Apple, $0 from Meta - anti-Meta coverage is cost-free;

        (2) every article framing Meta glasses as a "privacy nightmare" damages

        Apple''s #1 smart glasses competitor and strengthens N50 positioning;

        (3) Apple employs 100 editors controlling Top Stories placement - editorial

        curation drives engagement-weighted revenue share. UK data (Enders

        Analysis) shows national newspapers get 55% of engagement time despite

        being 5% of titles. Apple''s growing referral traffic is replacing

        declining Google/Meta traffic - Semafor called Apple News+ a "lifeline"

        - making publisher dependency intensify precisely as Apple enters the

        smart glasses market. Meta has ZERO financial relationships with Apple

        News+ publishers. Meta''s proactive camera-disable innovation (Jul 7 2026)

        received reactive framing ("responded after reports") while Apple''s delay

        received aspirational framing ("privacy focus," "prioritizing privacy").

