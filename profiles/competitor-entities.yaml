  perverse_incentive: "PMC's financial position creates a clear directional prediction:\n- Google: ADVERSARIAL (active federal antitrust lawsuit, D.C. district\n  court, filed Sep 13, 2025; Google's third motion to dismiss filed\n  Jan 13, 2026). PMC claims affiliate revenue down >33% from peak due\n  to Google AI Overviews. PMC was first major US publisher to sue Google\n  over AI features. Financial incentive: MOST adversarial coverage.\n- OpenAI: POSITIVE (content licensing deal, Azure enterprise customer).\n  Financial incentive: softer coverage.\n- Microsoft: POSITIVE (PCM co-design partner, Azure OpenAI customer).\n  Financial incentive: softer coverage.\n- Meta: ZERO (no deal, no negotiation, no litigation).\n  Financial incentive: NEUTRAL (no reason for soft OR hard coverage).\n\nYet The Verge's editorial output reverses these predictions:\nMeta receives the most adversarial coverage, while Google - the company\nPMC is literally suing in federal court for destroying its business\
    \ -\nreceives less hostile editorial treatment. The editorial response to\nthe Google lawsuit has been disclosure (\"Disclosure is our brand\") not\nadversarial editorial coverage. The Verge has NEVER disclosed its\nOpenAI or Microsoft financial relationships in coverage of those companies.\n"
