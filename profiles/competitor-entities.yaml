      finding: 'eMarketer Jul 17 2026 counter-forecast quantifies AI advertising market structure that inverts the original MediaScope financial incentive model. Total US AI ad spend 2026 is $32.03B. Of that, $26.42B (80%+) is traditional search ads running alongside Google AI Overviews - existing Google revenue, not new chatbot revenue. Only $2.56B (8%) is standalone chatbot ads (ChatGPT, Copilot, Google AI Mode, Alexa Shopping). By 2030, total US AI ad spend grows to $68.25B but alongside-AI-content share drops to 58.6% - still dominant. Chatbot ads total market by 2030 is $5.41B (eMarketer) vs OpenAI projection $100B - OpenAI misses its own forecast by 90% even if it captures 100% of chatbot ad market. This means Google captures BOTH search ad revenue AND AI-adjacent ad revenue, while OpenAI ad alternative stays marginal. Publisher dependency CONCENTRATES on Google, not diversifies to OpenAI. Revised MediaScope thesis: content licensing deals REMAIN financially material to OpenAI ($300-400M/yr vs ~$540M plausible share of $5.41B chatbot ads by 2030 = 40-75% ratio, not 0.4%), while Google financial leverage over publishers INCREASES because 80%+ of AI ad spend is Google alongside-AI-content. Company with LEAST financial relationship with publishers (Meta: 0 Condé Nast deals, 13 total licensing deals globally $50M/yr News Corp + 12 others) receives harshest coverage, while company with MOST financial relationships (Google via $81.63B Q2 ad revenue + Showcase + News AI pilot) receives softer coverage.'
