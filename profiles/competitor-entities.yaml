relationship_types:
  licensing: Publisher receives payment for content licensing
  investment: Entity or entity-adjacent fund invested in publisher parent
  advertising: Significant advertising revenue relationship
  litigation: Active lawsuit between publisher and entity
  adversarial: Explicitly hostile relationship (no deal, active disputes)
  indirect: Financial tie through parent/institutional relationship
  mixed: Multiple types of relationship (some positive, some negative)
  none: No known financial relationship
  negotiating: Deals under discussion but not yet signed
  settlement: Payment through legal settlement, not voluntary licensing
  coercive: Publisher pressured to accept terms or lose existing benefits
  commercial_partnership: Cash payments for extended content display or AI features, not formal licensing
  adversarial_litigation: Active lawsuit filed by publisher against entity
  advertising_dependency: Publisher critically dependent on entity's advertising platform for majority of digital ad revenue
    — distinct from licensing or investment
coverage_predictions:
  softer: Financial incentive predicts measurably softer coverage tone
  neutral: No financial incentive to bias coverage in either direction
  adversarial: Financial incentive or absence thereof predicts harsher coverage
  unknown: Insufficient data to predict coverage tone
