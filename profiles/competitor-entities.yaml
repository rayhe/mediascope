ipo_underwriter_research_pipeline:
  mechanism_id: 21
  mechanism_name: IPO Underwriter Research Laundering Pipeline
  date_identified: '2026-08-10'
  structural_significance: 'Historically unprecedented: two directly competing AI companies (OpenAI and Anthropic) are using the SAME two lead underwriting banks (Goldman Sachs and Morgan Stanley) for simultaneous IPOs. WSJ confirmed both banks are creating entirely separate deal teams to prevent information leakage. This dual mandate means GS and MS have financial incentives aligned with BOTH major AI labs, while their research divisions produce industry analysis that tech journalists cite as independent "Wall Street analysis."

    '
  conflict_management: 'Goldman Sachs and Morgan Stanley are creating entirely separate deal teams for OpenAI and Anthropic to prevent information leakage between the two rivals. Bankers who worked on the SpaceX IPO have been excluded from both AI deals because SpaceX has an AI business that could be seen as a competitor. Source: WSJ, Jun 18 2026.

    '
  mechanism_description: "The pipeline operates in four steps: (1) GS/MS research divisions publish bullish AI industry reports (capex\n    forecasts, token demand projections, agentic AI sizing, labor impact)\n(2) Tech and financial journalists cite these as independent Wall Street\n    analysis in their coverage\n(3) The bullish narrative creates a positive market environment for AI IPO\n    clients (Anthropic, OpenAI)\n(4) GS/MS earn hundreds of millions in underwriting fees from these IPOs The narrative tailwind from bullish bank research disproportionately benefits GS/MS IPO clients over non-clients like Meta, which went public in 2012 and generates zero current IPO fees.\n"
  claim_type: structural_incentive_alignment
  disclosure_obligation_for_journalists: false
  meta_ipo_fee_incentive: zero
  meta_ipo_status: public_since_2012
  estimated_anthropic_ipo_fee_pool_m: 500
  estimated_openai_ipo_fee_pool_m: 400
  ms_record_q2_2026: true
  gs_ib_backlog_five_year_high: true
  stock_price_sensitivity:
    event: NYT reported OpenAI may delay IPO to 2027
    gs_drop_on_openai_delay_pct: 4.8
    ms_drop_on_openai_delay_pct: 4.1
    date: '2026-06-26'
  ted_pick_earnings_call_quote: 'The industry is ''10%-15% of the way through the investment cycle.'' Data center capex running at approximately $850 billion and climbing. Morgan Stanley Research projects ~$3 trillion in AI infrastructure investment by 2028, with 80%+ still to be deployed.

    '
  framing_asymmetry: 'GS research explicitly warns about AI capex_risk (Jun 2026: $920B consensus too conservative, valuation multiples at post-ChatGPT highs). This framing hits Meta ($125-145B capex guidance) harder than Anthropic/OpenAI, whose growth narratives DEPEND on infrastructure investment. The bank warning about AI capex risk is the SAME bank earning IPO fees from the companies whose growth requires that capex.

