      overview: 'Apple signed a multi-year deal with Google to use a custom Gemini

        AI model (1.2 trillion parameters) to power the rebuilt Siri,

        announced Jan 12, 2026. Bloomberg first reported the deal Nov 5,

        2025, estimating ~$1B/yr - confirmed by Reuters, CNN, Motley Fool.

        Apple runs Gemini on its own Private Cloud Compute servers to

        maintain its privacy narrative. Google supplies the model; Apple

        keeps it behind its own infrastructure.

        '
      detail: 'The $1B/yr Gemini payment is only ~5% of the $20B/yr Google pays

        Apple for default search engine placement on iPhone, making Apple

        the clear financial winner in the AI relationship. Apple evaluated

        OpenAI''s ChatGPT and Anthropic''s Claude before choosing Gemini -

        Anthropic''s fees were reportedly "too high."

        Apple''s own AI team is building a 1-trillion-parameter model

        intended to replace Gemini "as early as next year," making this

        an interim solution. Gemini handles Siri''s summarizer and planner

        functions (understanding context, multi-step task execution),

        while Apple''s in-house models handle other capabilities.

        Google views the deal as a major validation ("Apple determined

        Google''s AI technology provides the most capable foundation").

