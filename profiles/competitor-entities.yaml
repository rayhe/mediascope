    - name: "Condé Nast (WIRED, Vogue, New Yorker, GQ, Vanity Fair, Ars Technica)"
      deals_with_competitors: ["OpenAI", "Amazon", "Microsoft PCM", "Perplexity", "Apple (negotiating)"]
      meta_deal: "none"
    - name: "Vox Media / PMC (The Verge, Eater, SB Nation)"
      deals_with_competitors: ["OpenAI", "Microsoft PCM"]
      meta_deal: "none"
    - name: "Emerson Collective (The Atlantic)"
      deals_with_competitors: ["OpenAI"]
      meta_deal: "none"
    - name: "The New York Times Company"
      deals_with_competitors: ["Amazon ($20-25M/yr)"]
      meta_deal: "none"
      notes: "Suing OpenAI for billions."
    - name: "Nikkei (Financial Times)"
      deals_with_competitors: ["OpenAI ($5-10M/yr)", "Google (News AI pilot)", "Microsoft PCM"]
      meta_deal: "none"
    - name: "Guardian Media Group (The Guardian)"
      deals_with_competitors: ["OpenAI", "Google (News AI pilot)"]
      meta_deal: "none"
    - name: "MIT (MIT Technology Review)"
      deals_with_competitors: ["ProRata AI"]
      meta_deal: "none"
      notes: "Indirect ties to Amazon/Google via MIT corporate partnerships."
    - name: "Keleops AG (Gizmodo)"
      deals_with_competitors: []
      meta_deal: "none"
      notes: "No deals with any entity. Clean control."
  critical_finding: |
    Of the 8 publications profiled in MediaScope's adversarial coverage
    analysis (WIRED, The Verge, The Atlantic, NYT, FT, Guardian, MIT TR,
    Gizmodo), ZERO have Meta AI content deals. Seven of eight have at
    least one deal with a Meta competitor (OpenAI, Amazon, Microsoft,
    Google, or Perplexity). Only Gizmodo (the clean control with no
    deals at all) has symmetric financial non-relationships. This creates
    a near-universal financial incentive gradient: receive money from
    Meta's competitors, receive nothing from Meta, cover Meta
    adversarially. The only publication with a Meta deal in the dataset
    (News Corp) shows balanced Meta coverage — the predicted outcome.
  last_verified: "2026-08-05"

