      key_finding: Publishers with OpenAI licensing deals earn 48% more citations per page on ChatGPT than publishers without deals. This is the FIRST quantitative study proving financial relationships predict AI search visibility. It extends MediaScope from coverage tone prediction to AI search amplification prediction.
      chatgpt_premium:
        licensed_citations_per_page: 10.2
        unlicensed_citations_per_page: 6.9
        premium_pct: 48
      all_platforms_premium:
        licensed_citations_per_page: 10.7
        unlicensed_citations_per_page: 7.3
        premium_pct: 46
      openai_only_publishers:
        chatgpt_premium_pct: 112
        note: Publishers with OpenAI-only deals (no other AI deals) earn 112% more ChatGPT citations than unlicensed publishers. Strongest evidence of deal-driven citation amplification.
      chatgpt_citation_concentration:
        openai_licensed_chatgpt_share_pct: 57.9
        note: OpenAI-licensed publishers get 57.9% of their AI citation volume from ChatGPT alone. Unlicensed publishers have a more balanced mix across platforms.
      platform_comparison:
        openai: ONLY licensor with clear home-platform citation advantage (+48% on ChatGPT)
        google: Google-licensed publishers cited at SLIGHTLY LOWER rate on Google AI Overviews than unlicensed. Google deals operate through financial coercion (NDAs, no-sue, Showcase sunset threat), not citation amplification.
        perplexity: Perplexity-licensed publishers at PARITY with unlicensed on Perplexity. No home-platform advantage.
