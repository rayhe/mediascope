        '
      dual_ai_lab_investment_paradox: 'Both Microsoft and Amazon invest in BOTH OpenAI AND Anthropic. Amazon is the LARGEST dual investor ($50B OpenAI + $13B Anthropic = $63B), surpassing Microsoft ($13B OpenAI + $5B Anthropic = $18B) by 3.5x. Google invested in Anthropic ($2B+) but has its own models (Gemini). CORRECTED: Prior text stated "Microsoft is the ONLY company that invests in BOTH" and "Amazon invests in Anthropic only" - factually wrong after Amazon''s $50B OpenAI investment in the Feb 2026 Series F round.

