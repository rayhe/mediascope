    publisher_deals_note: 'ZERO voluntary publisher content licensing deals as of Aug 2026.

      Anthropic is the only major AI lab without publisher deals, despite:

      (a) $1.5B author copyright settlement (Bartz v. Anthropic, approved

      Jun 20 2026 by Judge Martinez-Olguin — largest copyright payout in

      US history, ~$3,000 per work to 500,000 authors)

      (b) $183B valuation (Apr 2026)

      (c) Revenue growing from $9B to $19B projected annual run rate

      This absence means NO MediaScope-profiled publication has an

      Anthropic revenue relationship. Anthropic is financially neutral

      to all profiled publishers — neither paying them (like OpenAI/Amazon/

      Google/Microsoft) nor threatening them (like Google''s traffic cannibalization).

      NOTE: The FinancialContent/TokenRing report of an "Anthropic-NYT

      settlement" (Dec 2025) appears to be fabricated marketing content

      with no corroboration from any reputable source. NYT never sued

      Anthropic. Do not include as verified.

      '
