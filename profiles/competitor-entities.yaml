    significance: |
      First major US publisher to sue Google over AI Overviews.
      PMC claims Google forces publishers to permit AI summaries as a
      condition of remaining in search results. Google calls this
      "reciprocal dealing" claim meritless, citing publishers' ability
      to opt out of indexing. Third motion to dismiss is Google's most
