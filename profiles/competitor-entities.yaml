          google_search_share_uk: 90%+ (CMA via Foxglove quote Computer Weekly Jun 4 2026)
      quintuple_coercion_update:
        channel_a_advertising: advertising dependency about 37% US digital ad spend, GBP 21.5B UK (Press Gazette Aug 2026)
        channel_b_traffic: search traffic dependency AI Overviews reducing referrals, 1% CTR under AI summaries (Pew via Computer Weekly Jun 4 2026), 79% potential traffic loss if below AI overview (Authoritas via Computer Weekly Jun 4 2026)
        channel_c_showcase_leverage: Showcase fee leverage accept AI training or lose annual payments (PYMNTS Jun 25 2026, NY Post Jun 26 2026)
