    tbpn_media_acquisition:
      acquisition_date: '2026-04-02'
      target: TBPN (Technology Business Programming Network)
      deal_value: low hundreds of millions (FT estimate)
      team_size: 11
      daily_viewers: 70000
      pre_acquisition_revenue_m: 30
      pre_acquisition_ad_revenue_note: Shut down as part of deal
      founded: 2024-10
      cofounders:
      - Jordi Hays
      - John Coogan (Soylent co-founder)
      reports_to: Chris Lehane (chief global affairs officer)
      editorial_independence_claim: true
      overview: 'OpenAI acquired TBPN - the first AI company to buy a media property outright. TBPN is positioned as a Silicon Valley-sympathetic alternative to traditional tech press. WSJ described it as "more supportive of their industry than traditional news outlets." Coogan has a relationship with Altman since 2013.

        MediaScope RELEVANCE: This is a QUALITATIVE financial displacement mechanism. OpenAI now OWNS media that reaches the same tech executive audience as WIRED, The Verge, and WSJ. Key implications: (1) NARRATIVE CONTROL: TBPN reports to OpenAI''s chief global affairs officer (same person running OpenAI''s advertising business). The promise of "editorial independence" is structurally undermined by the employer relationship. (2) GOING DIRECT: OpenAI bypasses publishers entirely for its own narrative. This follows Andreessen Horowitz buying Turpentine (2024) and CoinDesk''s ownership by Digital Currency Group - a pattern of AI/tech companies building owned media to circumvent coverage they view as hostile. (3) ADVERTISER DISPLACEMENT: TBPN was generating $30M/yr in advertising revenue - money that would otherwise flow to tech publishers. Even though OpenAI shut down TBPN''s ad business, the owned media platform absorbs audience attention that publishers need for their own ad models. '
      altman_quote: They're fun, they're not sensationalist. They go into real levels of technical depth, and it resonates with people.
      simo_memo_quote: The standard communications playbook just doesn't apply to us. We're not a typical company.
      source_urls:
      - https://www.wsj.com/cmo-today/openai-buys-tech-industry-talk-show-tbpn-484c01c5
