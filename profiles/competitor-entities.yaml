    regex: \b(Apple(?!\s+(?:sauce|pie|butter|cider|juice|crisp|orchard|tree|blossom))|Tim\s+Cook|John\s+Ternus|Apple\s+Intelligence|Vision\s+Pro)\b
    category: big_tech
    market_cap_approx: $3.8T
    ceo: John Ternus (from Sep 2026)
    openai_partnership_collapse:
      overview: 'The Apple-OpenAI partnership has undergone a dramatic reversal from

        strategic alliance to mutual litigation in under two years. This

        represents the fastest partnership-to-litigation arc in AI industry

        history and has significant implications for MediaScope''s financial

        incentive analysis.

        '
      phase_1_partnership:
        date: 2024-06
        event: Apple integrates ChatGPT into Siri and Apple Intelligence
        terms: No money changed hands at signing. Each side believed it gave the other the more valuable asset. OpenAI expected
          subscription growth "on par" with Apple's $20B/yr Google Search deal.
        source_url: https://www.reuters.com/business/openai-explores-legal-options-against-apple-bloomberg-news-reports-2026-05-14/
      phase_2_openai_breach_threat:
        date: 2026-05-14
        event: OpenAI prepares breach-of-contract notice against Apple
        detail: 'OpenAI retained outside counsel to explore legal options. Exec

          called the deal a "failure" — Apple didn''t sufficiently promote

          ChatGPT integration, hid implementation details, and subscription

          growth "hasn''t come close to happening." Renegotiation stalled.

          Apple testing Claude and Gemini as alternatives to ChatGPT in Siri.

          '
        openai_exec_quote: We have done everything from a product perspective. They have not, and worse, they haven't even
          made an honest effort.
        source_urls:
        - https://www.reuters.com/business/openai-explores-legal-options-against-apple-bloomberg-news-reports-2026-05-14/
        - https://www.macrumors.com/2026/05/14/openai-considering-legal-action-against-apple/
        - https://www.pymnts.com/partnerships/2026/openai-weighs-lawsuit-as-apple-ai-partnership-sours/
      phase_3_apple_sues_openai:
        date: 2026-07-10
        event: Apple files trade secret misappropriation lawsuit against OpenAI
        detail: 'Apple sued OpenAI for stealing trade secrets to build AI hardware.

          Lawsuit targets io Products (Jony Ive''s startup OpenAI acquired for

          $6.4B). Over 400 former Apple employees now work at OpenAI. Apple

          seeks injunction + damages. The Siri partnership is specifically

          excluded from the lawsuit claims, but the relationship is now

          adversarial on multiple fronts.

          '
        source_url: https://www.macrumors.com/2026/07/10/apple-sues-openai/
      phase_4_preliminary_injunction:
        date: 2026-08-04
        event: Apple seeks preliminary injunction against OpenAI
        detail: 'Apple seeks preliminary injunction barring OpenAI from using alleged

          trade secrets + expedited discovery. Depositions sought for Tang Tan,

          Chang Liu, io Products corporate representative. Apple reveals

          ADDITIONAL former employees may be involved beyond initial filing.

          '
        source_url: https://www.reuters.com/legal/litigation/apple-seeks-preliminary-injunction-against-openai-trade-secrets-case-2026-08-04/
      phase_5_motion_to_dismiss:
        date: 2026-08-06
        event: OpenAI files motion to dismiss Apple's trade secret suit
        detail: 'OpenAI files motion to dismiss, calling Apple''s lawsuit "careless,

          aggressive and oddly personal." Claims Apple failed to identify

          protectable trade secrets. OpenAI blog post says Apple has "common

          issue" of failing to lock up files when employees depart. WSJ and

          Reuters cover within hours.

          '
        source_urls:
        - https://www.reuters.com/world/openai-asks-us-judge-dismiss-apples-trade-secrets-case-2026-08-06/
        - https://www.wsj.com/tech/openai-calls-apples-trade-secret-suit-careless-and-oddly-personal-a1d290a1
      mediascope_relevance: "The Apple-OpenAI collapse has THREE implications for financial\nincentive analysis:\n(1) CONDÉ\
        \ NAST DOUBLE DEALING: Condé Nast was simultaneously\n    negotiating content deals with Apple (reported 2025) while\
        \ having\n    an active OpenAI licensing deal. Now Apple and OpenAI are in\n    mutual litigation. Does Condé Nast's\
        \ OpenAI deal create friction\n    with Apple? Or does Apple's own fight with OpenAI make Apple MORE\n    sympathetic\
        \ to publishers that were already licensing to OpenAI?\n(2) APPLE AS NEUTRAL ENTITY: Apple has no publisher content\
        \ deals\n    (only negotiations) and is now SUING the company (OpenAI) that\n    has the most publisher deals. This\
        \ makes Apple the only Big Tech\n    company with zero publisher deals AND active litigation against\n    the biggest\
        \ publisher deal-maker.\n(3) SIRI AI PROVIDER DIVERSIFICATION: Apple testing Claude (Anthropic)\n    and Gemini (Google)\
        \ alongside ChatGPT means publishers' content\n    licensed to OpenAI may flow through Apple devices via multiple\n\
        \    AI models — raising questions about content licensing scope.\n"
    apple_google_gemini_deal:
      announcement_date: '2026-01-12'
      bloomberg_report_date: '2025-11-05'
      annual_value_est_b: 1.0
      model_parameters: 1.2 trillion
      overview: 'Apple signed a multi-year deal with Google to use a custom Gemini

        AI model (1.2 trillion parameters) to power the rebuilt Siri,

        announced Jan 12, 2026. Bloomberg first reported the deal Nov 5,

        2025, estimating ~$1B/yr — confirmed by Reuters, CNN, Motley Fool.

        Apple runs Gemini on its own Private Cloud Compute servers to

        maintain its privacy narrative. Google supplies the model; Apple

        keeps it behind its own infrastructure.

        '
      detail: 'The $1B/yr Gemini payment is only ~5% of the $20B/yr Google pays

        Apple for default search engine placement on iPhone, making Apple

        the clear financial winner in the AI relationship. Apple evaluated

        OpenAI''s ChatGPT and Anthropic''s Claude before choosing Gemini —

        Anthropic''s fees were reportedly "too high."

        Apple''s own AI team is building a 1-trillion-parameter model

        intended to replace Gemini "as early as next year," making this

        an interim solution. Gemini handles Siri''s summarizer and planner

        functions (understanding context, multi-step task execution),

        while Apple''s in-house models handle other capabilities.

        Google views the deal as a major validation ("Apple determined

        Google''s AI technology provides the most capable foundation").

        Alphabet stock reached $4T market cap on announcement day.

        '
      source_urls:
      - https://www.macrumors.com/2025/11/05/apple-google-new-siri-payment/
      - https://www.reuters.com/business/google-apple-enter-into-multi-year-ai-deal-gemini-models-2026-01-12/
      - https://www.cnn.com/2026/01/12/tech/apple-google-gemini-siri
      - https://www.fool.com/investing/2026/06/26/apple-paying-google-billion-year-for-ai-winner/
      - https://www.macrumors.com/2025/11/05/apple-siri-google-gemini-partnership/
    publisher_content_bypass:
      overview: 'Apple has ZERO confirmed publisher content licensing deals despite

        2.5 years of negotiations (Dec 2023 - Aug 2026). Apple bypassed

        publisher licensing entirely by paying Google $1B/yr for a Gemini

        model that was trained on publisher content without authorization.

        '
      publisher_negotiation_history: 'Dec 2023: Apple approached Condé Nast (Vogue, WIRED, The New Yorker),

        NBC News, and IAC (People, Daily Beast) with $50M multi-year offers.

        NYT reported some publishers were "lukewarm" on the overture, with

        concerns about overly broad terms and unclear AI applications.

        No confirmed deal has been signed as of Aug 2026.

        As of Jan 2026, Apple instead signed the $1B/yr Gemini deal with

        Google, effectively accessing publisher content through Google''s

        training pipeline rather than licensing it directly.

        '
      content_chain: "The publisher content laundering chain:\n1. Google trains Gemini on publisher content (Hachette/Cengage/\n\
        \   Elsevier lawsuit Jul 2026 confirms unauthorized training on\n   \"millions of books and journal articles\")\n\
        2. Apple pays Google $1B/yr for customized Gemini model\n3. Apple runs Gemini on Private Cloud Compute for Siri\n\
        4. Siri serves AI responses derived from publisher content to\n   2B+ Apple devices worldwide\n5. Publishers receive\
        \ $0 from Apple for this content flow\n\nCONTRAST WITH DIRECT LICENSING:\n- Meta: $50M/yr to News Corp (voluntary,\
        \ bilateral, direct)\n- OpenAI: Direct deals with NYT, People Inc., Condé Nast ($100M+ total)\n- Amazon: Direct deals\
        \ with NYT ($20-25M/yr), Condé Nast, Hearst\n- Apple: $0 to publishers, $1B to Google (indirect access via training)\n\
        \nIRONY: Apple was praised in Dec 2023 for \"asking permission\" and\n\"showing willingness to pay\" vs other AI companies\
        \ that scraped\nwithout asking. But Apple never closed a deal — it found a cheaper\npath through Google's pre-trained\
        \ model. The outcome is the same\nas scraping: publisher content in AI without publisher compensation.\n"
      source_urls:
      - https://www.reuters.com/technology/apple-explores-ai-deals-with-news-publishers-new-york-times-2023-12-22/
      - https://www.hachettebookgroup.com/hachette-book-group-news/publishers-and-authors-file-class-action-lawsuit-against-google-for-willful-copyright-infringement-to-develop-gemini-ai-models/
      mediascope_relevance: "Apple's content bypass strategy creates a FOURTH implication for\nMediaScope (extending the three\
        \ from openai_partnership_collapse):\n(4) CONDÉ NAST DOUBLE LOSS: Condé Nast was approached for an Apple\n    deal\
        \ ($50M) and apparently declined or stalled. Now their content\n    flows through Apple devices anyway via Google\
        \ Gemini — but they\n    receive nothing from Apple for it. Meanwhile, they DO receive\n    payments from OpenAI (content\
        \ deal, Aug 2024), Amazon (Rufus\n    deal, Jul 2025), and Microsoft (PCM deal, Feb 2026). The only\n    companies\
        \ NOT paying Condé Nast are Apple (bypassed via Google)\n    and Meta (no deal). Yet WIRED's coverage targets Meta\
        \ as the\n    primary adversary, not Apple — despite Apple's bypass being\n    arguably more damaging to publisher\
        \ revenue than Meta's model\n    of offering voluntary direct licensing.\n"
    apple_news_platform_leverage:
      overview: 'Apple News+ creates a financial dependency between Apple and 400+

        publishers that is DISTINCT from AI content licensing. Apple takes

        50% of $12.99/mo subscription revenue, allocating the remainder

        to publishers based on reading time engagement. With 125M monthly

        active users across US, Canada, UK, and Australia, and CIRP data

        showing 24% of US Apple customers paying for News+ (up from 15%

        in 2020), Apple News+ represents "tens of millions of users"

        publishers cannot reach alone. The Atlantic''s chief growth officer

        publicly called Apple "by far the most valuable syndication partner."

        Semafor reported Apple News+ as a "lifeline" for publishers losing

        Google/Meta referral traffic. Publishers cannot criticize the

        platform they increasingly depend on for audience and revenue.

        '
