    total_competitor_deal_count: 19
    total_meta_deal_count: 0
    statistical_note: '19 competitor revenue relationships across 7 of 8 publications versus

      0 Meta relationships across ALL 8 publications. The probability of

      this distribution occurring by chance, given Meta''s 13 publisher deals

      and the total addressable publisher market, is vanishingly small.

      It indicates either (a) Meta''s deal team systematically excluded

      adversarial publications, (b) adversarial publications systematically

      declined Meta offers, or (c) both — creating a self-reinforcing loop

      where financial misalignment and editorial hostility compound.

      Condé Nast leads with 5 competitor revenue streams (OpenAI, Amazon,

      Microsoft PCM, Perplexity, Apple negotiating), the highest of any

      profiled publication. The Perplexity deal is particularly notable:

      Condé Nast accused Perplexity of plagiarism, sent a cease-and-desist,

      then signed a deal anyway — demonstrating that financial incentives

      override editorial complaints when money is available but NOT when

      the potential partner is Meta.

      NYT LITIGATION PARADOX (updated Aug 2026): NYT now has 3 distinct

      AI revenue channels (Amazon Rufus $20-25M/yr, Amazon Alexa+,

      Snowflake Cortex six-figure RAG) while suing OpenAI for billions.

      Project Giraffe revelation (Jul 2026) strengthens case but anti-AI

      stance remains selective.

      xAI ABSENCE: xAI has zero publisher deals AND zero publisher

      litigation — "publisher-invisible" despite $50B+ valuation.

      '
    control_comparison: 'News Corp (WSJ, NY Post, Barron''s, MarketWatch): Has BOTH OpenAI

      ($250M/5yr) AND Meta ($50M/yr) deals. Shows balanced Meta coverage —

      the predicted outcome when financial relationships are symmetric.

      Gizmodo: Has NO deals with anyone. Shows adversarial Meta coverage —

      suggesting editorial culture contributes independently of money.

      Together these controls bound the financial incentive effect: money

      alone doesn''t explain everything (Gizmodo), but when money is

      asymmetric across competitors, coverage tone follows (the other 7).

      '
  critical_finding: 'Of the 8 publications profiled in MediaScope''s adversarial coverage

    analysis (WIRED, The Verge, The Atlantic, NYT, FT, Guardian, MIT TR,

    Gizmodo), ZERO have Meta AI content deals. Seven of eight have a

    combined 19 revenue relationships with Meta''s competitors (OpenAI,

    Amazon, Google, Microsoft, Perplexity/ProRata, Snowflake). Only Gizmodo

    (zero deals with anyone) has symmetric financial non-relationships. The

    comprehensive cross-platform mapping reveals that financial incentives

    are not limited to a single OpenAI deal — multiple publications

    receive revenue from 3-5 distinct Meta competitors simultaneously.

    Condé Nast (WIRED) leads with 5 competitor revenue streams; NYT, FT,

    and Vox Media (The Verge) each have 3. This creates a multi-layered

    financial incentive gradient far stronger than any single deal.

    News Corp (WSJ, NY Post) — which has BOTH OpenAI ($250M/5yr) AND

    Meta ($50M/yr) deals — shows balanced coverage, the predicted outcome

    when financial relationships are symmetric.

    PERPLEXITY PATTERN (new Aug 2026): Condé Nast accused Perplexity of

    plagiarism (WIRED investigation, Jun 2024), sent cease-and-desist

    (Jul 2024), then signed Perplexity Comet Plus deal (Oct 2025). This

    demonstrates that editorial complaints about AI companies using

    content without permission are resolved by financial deals — but ONLY

    for non-Meta companies. Meta receives no such resolution pathway.

    ANTHROPIC ABSENCE: Anthropic has zero publisher content licensing deals

    despite its $1.5B author copyright settlement (approved Jul 2026).

    This makes Anthropic the only major AI lab without publisher deals,

    though it is not yet profiled as an adversarial coverage target.

    xAI ABSENCE: xAI ($50B+ valuation) has zero publisher deals AND zero

    publisher lawsuits — "publisher-invisible." Relies on X/Twitter data,

    Grokipedia (Wikipedia-derived), and Telegram user interactions instead.

    NYT PROJECT GIRAFFE (Jul 2026): OpenAI deposition revealed internal

    tools (78M conversations + Bloom filter) measuring its own infringement

    BEFORE and shortly after the Dec 2023 lawsuit, while claiming search

    was infeasible. NYT seeking sanctions. Meanwhile NYT quietly builds

    AI licensing revenue through Amazon ($20-25M/yr), Snowflake Cortex

    (six-figure RAG), and Alexa+ — the "Litigation Paradox."

    MARKETPLACE LAYER (new Aug 2026): Snowflake Cortex (17 publishers),

    Microsoft PCM (7 publishers), Amazon (building new marketplace),

    and Factiva (8,100+ news sources) create an emerging AI content

    marketplace layer. NYT, WashPost, AP, USA Today on Snowflake. This

    adds a 4th-5th revenue channel beyond bilateral deals.

    '
