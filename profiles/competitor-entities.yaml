        detail: 'Record COPPA settlement for collecting children''s personal
          information (persistent identifiers/cookies) from viewers of
          child-directed YouTube channels without parental consent. Used
          identifiers to deliver targeted ads to children. $136M to FTC,
          $34M to NY.
          '
