      meta_contrast: 'CRITICAL ASYMMETRY: In July 2026, the SAME French competition authority ordered META to submit a payment proposal and restart talks with French media groups, saying Meta "likely abused its dominant position." Now APIG wants the same treatment for Google. But Google''s AI Overviews are ALREADY generating AI summaries from publisher content at scale (billions of queries/day), while Meta''s content usage is for AI training (not direct content substitution). Google''s AI Overviews are structurally MORE substitutional - they replace the click-through to publishers entirely - yet Meta received the first enforcement action.'
