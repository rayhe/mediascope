    publisher_litigation_jul2026:
      event: Hachette/Cengage/Elsevier/Turow class-action copyright suit
      date: 2026-07-10
      court: SDNY, Case No. 1:26-cv-05870
      plaintiffs:
      - Hachette Book Group
      - Cengage Learning
      - Elsevier
      - Scott Turow (via S.C.R.I.B.E. Inc.)
      detail: 'Class-action alleging Google committed "one of the most prolific

        infringements of copyrighted materials in history" by copying

        millions of books and journal articles to train Gemini. Google

        obtained works through Google Books, Google Play Books, Google

        Scholar, and web scraping (including "known pirate sources" and

        "behind paywalls"). Google internally flagged "$10Bs-$100Bs in

        potential fines" for using publisher-provided content.

        Gemini can generate "a 100-page murder mystery" in 20 minutes

        for 39 cents — "No publisher or author can compete with that."

        '
      source_urls:
      - https://www.hachettebookgroup.com/hachette-book-group-news/publishers-and-authors-file-class-action-lawsuit-against-google-for-willful-copyright-infringement-to-develop-gemini-ai-models/
      - https://publishers.org/news/publishers-and-authors-file-class-action-lawsuit-against-google-for-willful-copyright-infringement-to-develop-gemini-ai-models/
      - https://www.medianama.com/2026/07/223-google-accused-copying-millions-books-train-gemini/
      mediascope_relevance: 'Google now faces the SAME type of copyright litigation as OpenAI

        (NYT lawsuit Dec 2023) — both accused of large-scale unauthorized

        training. But Google''s litigation targets book publishers (Hachette,

        Elsevier, Cengage), not news publishers. Google''s news publisher

        relationships (News AI pilot, Showcase) remain intact despite the

        book publisher lawsuit. This creates a bifurcated legal landscape

        where Google simultaneously licenses FROM news publishers AND gets

        sued BY book publishers for the same underlying AI training.

        '
