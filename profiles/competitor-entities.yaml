    mechanisms over publishers (Meta) receives the MOST adversarial coverage,

    while entities with the MOST mechanisms (Microsoft, Amazon, Apple, Google,

    Advance/Reddit) receive substantially softer treatment. Financial

    relationships predict coverage tone with high accuracy.

