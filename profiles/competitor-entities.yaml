        identified advertising as one of four categories showing "strong double-digit

        growth." Yet Apple discloses NO separate advertising revenue figure - the ONLY

        major tech company to maintain this opacity. This creates a structural

        accountability asymmetry: media critics can question whether Meta/Google coverage

        is influenced by advertising spending because those figures are PUBLIC ($39.7B

        Meta Q2 2026, $88.3B Google Q2 2026). They CANNOT make the equivalent case for

        Apple coverage because Apple''s ad revenue is structurally hidden. Publications

        that profit from Apple''s ad business (70% in-article ad share on Apple News,

        50/50 subscription split on Apple News+) are shielded from the exact accountability

        framework routinely applied to their Meta and Google coverage.

