ipo_underwriter_research_pipeline:
  mechanism_id: 21
  mechanism_name: "IPO Underwriter Research Laundering Pipeline"
  date_identified: "2026-08-10"
  structural_significance: >
    Historically unprecedented: two directly competing AI companies (OpenAI and
    Anthropic) are using the SAME two lead underwriting banks (Goldman Sachs and
    Morgan Stanley) for simultaneous IPOs. WSJ confirmed both banks are creating
    entirely separate deal teams to prevent information leakage. This dual mandate
    means GS and MS have financial incentives aligned with BOTH major AI labs,
    while their research divisions produce industry analysis that tech journalists
    cite as independent "Wall Street analysis."
  conflict_management: >
    Goldman Sachs and Morgan Stanley are creating entirely separate deal teams
    for OpenAI and Anthropic to prevent information leakage between the two rivals.
    Bankers who worked on the SpaceX IPO have been excluded from both AI deals
    because SpaceX has an AI business that could be seen as a competitor.
    Source: WSJ, Jun 18 2026.
  mechanism_description: >
    The pipeline operates in four steps:
    (1) GS/MS research divisions publish bullish AI industry reports (capex
        forecasts, token demand projections, agentic AI sizing, labor impact)
    (2) Tech and financial journalists cite these as independent Wall Street
        analysis in their coverage
    (3) The bullish narrative creates a positive market environment for AI IPO
        clients (Anthropic, OpenAI)
    (4) GS/MS earn hundreds of millions in underwriting fees from these IPOs
    The narrative tailwind from bullish bank research disproportionately benefits
    GS/MS IPO clients over non-clients like Meta, which went public in 2012 and
    generates zero current IPO fees.
