  legitimate_factors:
  - Banks maintain Chinese walls / information barriers between research and investment banking divisions. The mechanism is structural incentive alignment, not information leakage.
  - Bank research analysts are subject to SEC independence requirements (Regulation AC, Global Research Analyst Settlement of 2003). The structural incentive operates DESPITE these safeguards.
  - GS and MS research divisions DO cover Meta - they produce Meta earnings analysis, price targets, and sector reports. The asymmetry is in IPO fee incentives, not coverage absence.
  - Bank research frequently includes balanced or even cautionary analysis (GS capex risk warnings). The mechanism is probabilistic bias, not uniform bullishness.
  - Meta benefits from secondary market activities at GS/MS (equity trading, derivatives, corporate advisory). The IPO fee asymmetry is one financial channel among several.
