        - https://digiday.com/marketing/openais-chatgpt-reaches-the-coupon-stage-of-building-an-ad-business/
      overview: 'OpenAI is building a $2.5B advertising business in 2026 that projects
        to $100B by 2030, creating a NEW financial dependency channel with
        publishers. ChatGPT ads pilot crossed $100M ARR within 6 weeks of
        January 2026 launch. Self-serve Ads Manager launched April 2026.
        Hired David Dugan (former Meta ads executive) in March 2026.

        EMARKETER COUNTER-FORECAST (Jul 17, 2026): eMarketer projects the
        ENTIRE US standalone chatbot ad market (ChatGPT + Copilot + AI Mode +
        Alexa for Shopping) at <$1B in 2026 and $5.41B by 2030. OpenAI''s
        individual target of $100B by 2030 exceeds the projected total market
        by 18x. Analyst Nate Elliot: "Even if you assume that they will make
        100% of all revenue from chatbot advertising five years from now,
        OpenAI will still miss their number by 90%."

        REVISED MediaScope FINANCIAL INCENTIVE IMPLICATIONS:
        If eMarketer is correct, the original thesis needs significant revision:

        ORIGINAL THESIS (based on OpenAI projections):
        (1) Publisher content licensing ($300-400M/yr) becomes a rounding error
            vs. $100B ad revenue by 2030 (0.4% ratio)
        (2) OpenAI replicates Google''s ad dependency shield
        (3) Publishers become financially dependent on OpenAI for ad revenue

        REVISED THESIS (based on eMarketer counter-forecast):
        (1) Content licensing deals REMAIN financially material to OpenAI
            ($300-400M/yr vs. ~$540M at OpenAI''s plausible share of $5.41B
            chatbot ads by 2030) — deals are 40-75% the size of ad revenue,
            NOT 0.4%
        (2) OpenAI does NOT replicate Google''s ad dependency shield — the
            chatbot ad market is too small to create publisher dependency
        (3) Content licensing remains OpenAI''s PRIMARY financial relationship
            with publishers for the foreseeable future, meaning publishers
            who HAVE deals (Condé Nast, FT, etc.) remain financially
            incentivized to produce softer coverage through the DEAL mechanism
            rather than the ad dependency mechanism
        (4) The 80%+ of AI ad spend that goes "alongside AI content" (i.e.,
            traditional search ads next to Google AI Overviews) further
            concentrates publisher ad dependency on GOOGLE, not OpenAI
        (5) This makes Google''s financial leverage over publishers STRONGER
            than previously modeled — Google captures both the search ad
            revenue AND the AI-adjacent ad revenue, while OpenAI''s ad
            alternative stays marginal

        NET EFFECT: The financial incentive model shifts from "future ad
        dependency" to "present deal dependency" for OpenAI, and from
        "declining relevance" to "increasing dominance" for Google.
        The company with the LEAST financial relationship with publishers
        (Meta: 13 deals, none with adversarial publications) continues to
        receive the most adversarial coverage, while the companies with the
        MOST financial relationships (Google via ads + Showcase, OpenAI via
        deals) receive materially softer treatment.
        '
