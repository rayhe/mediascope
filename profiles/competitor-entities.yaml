          description: Nine product changes bring ChatGPT Ads to functional Meta feature parity. Week of Aug 3 2026 email to beta advertisers, reported PPC Land Aug 7.
          automatic_advanced_matching:
            description: Automatic advanced matching enabled as DEFAULT for all existing web pixels. Advertisers had 10 days (until Aug 17) to opt out. This mirrors Meta Advanced Matching, which has been subject to extensive privacy scrutiny and regulatory action. OpenAI received zero adversarial coverage from the same publications.
