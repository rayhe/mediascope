          invite-only Monaco summit (Sep 2025). Microsoft is BOTH the
          platform operator AND the first demand-side buyer (via Copilot).
          Co-designed with 7 publishers: Business Insider, Condé Nast,
          Hearst, People Inc, AP, USA TODAY, Vox Media. Yahoo is first
