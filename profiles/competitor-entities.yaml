          called the deal a "failure" - Apple didn''t sufficiently promote

          ChatGPT integration, hid implementation details, and subscription

          growth "hasn''t come close to happening." Renegotiation stalled.

          Apple testing Claude and Gemini as alternatives to ChatGPT in Siri.

          '
