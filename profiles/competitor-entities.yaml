        channel_e_contract_waiver_persistence: contract waiver via signed deal NDA/no-sue 2-year deal grants rights CMA says you can withhold, 90-day exit does not claw back training data already used, training data persistence beyond term (Press Gazette Aug 2026, Computer Weekly Jun 4 2026)
        meta_contrast: Meta zero coercive mechanisms, zero publisher deals for adversarial publications, voluntary bilateral no NDA/no-sue, no ad dependency, no traffic control, no fee leverage, no contract waiver persistence (mechanism 412 documentation)
