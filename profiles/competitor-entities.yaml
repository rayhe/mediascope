    display_ads_deprecation:
      announcement_date: '2026-05-26'
      migration_tool_start: '2026-06-01'
      full_migration_deadline: '2027'
      structural_change: 'Google retired standalone Display Ads campaigns, folding the Google

        Display Network (GDN) into Demand Gen. In standalone Display, GDN

        publisher inventory was the DEFAULT and entire purpose of the campaign.

        In Demand Gen, GDN is an OPT-IN channel accessed via channel controls

        at the ad group level. Default campaign configuration routes spend to

        Google-owned surfaces (YouTube, Discover, Gmail, Maps) where NO publisher

        revenue share applies.

        '
      publisher_revenue_impact: 'Every advertiser who migrates without explicitly enabling GDN via channel

        controls will, by default, direct visual advertising spend toward Google-

        owned surfaces. Budget that previously flowed to external websites through

        AdSense now flows to YouTube, Discover, Gmail, and Maps instead. This

        shifts GDN from default-inclusion to opt-in, structurally reducing publisher

        ad revenue independent of traffic volume changes.

        '
