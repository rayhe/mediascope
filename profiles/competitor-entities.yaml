        - TechCrunch Dec 10 2025 (Google testing AI-powered article overviews on select publications Google News pages)
        - AndroidHeadlines Jul 2026 via PYMNTS citation (death of classic license framing)
        secondary_corroboration:
        - CMA SMS designation Oct 2025 strategic market status (Computer Weekly and Press Gazette and Register)
        - Google Search Ecosystem blogpost Jun 3 2026 via Computer Weekly (Mrinalini Loew GM, testing subset UK media, global rollout aim, controls not ranking signal)
        - Information reporting Jun 2026 via PYMNTS/NY Post on broad rights
        - Press Gazette Platforms page on news publisher AI deals lawsuits OpenAI Google (existing source in google_news_ai_pilot)
        speculative_elements_labeled:
        - Future Google consumer AI market dominance within 2 years is industry source prediction (Press Gazette) not observed fact
        - Deal values single-figure millions are Press Gazette understanding due NDA not official disclosure, total GBP 2-18M range is MANUAL ILLUSTRATIVE calculation (1-9M x 2 years) not official
        - Renting peace / deals will go away is close-knowledge source interpretation not Google official
        - Collective action failure assumes individual rationality not collective - SPUR/API alternative could succeed
        - Prisoner dilemma payoff matrix is explanatory analogy (Press Gazette) not formal game-theoretic model with quantified utilities
        - Training data persistence beyond term assumes no unlearning clause - no clause reported but absence of reporting does not prove absence of clause, requires contract verification
        - Model weights retaining training benefits is standard ML practice but Google could theoretically offer deletion, no evidence reported either way
      mediascope_relevance: Directly addresses MediaScope gap - existing google_news_ai_pilot (mechanism 355) documented coercion and regulatory response separately but did not quantify temporary vs permanent value asymmetry. Mechanism 412 isolates financial quantification that GBP 2-18M over 2 years (MANUAL ILLUSTRATIVE) purchases perpetual model improvement vs Showcase GBP 1M+ annual for ephemeral placement. Training data persistence beyond 90-day exit is new contribution distinguishing temporary display rights (revocable) from permanent training rights (irrevocable weights). Explains why Guardian and FT (2 of 8 MediaScope publications) signed despite industry consensus at events that publishers must unite for universally applied fair payment model - individual rationality (cash + little traffic, avoid layoffs, avoid hundreds of millions legal costs) vs collective rationality (fair payment, API access model, pluralistic ecosystem). Both Guardian and FT depend largely on reader revenue rather than advertising (Press Gazette Aug 2026) making them less ad-dependent but more susceptible to Showcase replacement threat because Showcase fees built into annual plan. Mechanism predicts publications with existing Showcase fees face layoff risk if refusing (Kint), those without fees face exclusion from new AI revenue - either way financial coercion. Meta contrast - zero publisher deals, zero ad dependency, zero coercion, zero NDA/no-sue constraints - making Meta safe target for accountability coverage while Google coverage softens due financial dependency and contractual non-disparagement risk (no-sue clause). For wearables - Samsung glasses coverage silence persists because driven by Channel 2 (ad dependency) not Channel 1 (deal payments) - distinct from Google News AI pilot which is Channel 1 deal payments with Channel 2 ad dependency as enforcement. Training persistence intensifies asymmetry because even after exit, Google retains capability while publisher loses future payments and CMA opt-out becomes moot for already-ingested content.
