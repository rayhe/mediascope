        - description: Jurisdiction - CMA UK-only world-first remedy may not apply globally; 2,800 pubs in 33 countries mostly outside CMA scope; global rollout of controls is Google voluntary not CMA-mandated outside UK.
          strength: MODERATE
        - description: Traffic evidence quality - Google spokesperson disputes Authoritas 79% loss (inaccurate flawed assumptions outdated estimations not representative) and Pew 1% CTR (flawed methodology skewed queryset not representative) - both studies contested (Computer Weekly Jun 4 2026).
