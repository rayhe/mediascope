    tier_summary: 'News Corp is the ONLY publisher in MediaScope''s coverage set that explicitly names AI deal partners and describes the financial relationship in earnings calls. It also shows the LOWEST adversarial Meta coverage among all profiled publishers. CEO Thomson''s self-positioning as "an AI inputs company" suggests News Corp sees AI licensing as a feature, not a conflict - the opposite of Tier 1 publishers who hide deals while running adversarial coverage of non-paying companies.

      '
  cross_tier_correlation:
    finding: 'Inverse Transparency-Adversariality Pattern: Publishers that disclose MORE about their AI financial relationships produce LESS adversarial coverage of companies they do business with. Publishers that disclose NOTHING produce the MOST adversarial coverage of companies that are NOT paying them.

      '
