        financial gradient is contradicted. Register-strand successor of
        mechanism 415 (FT OpenAI Jun-Jul 2026 growth register) and sibling of
        mechanism 435 (FT Sep 1 framing asymmetry); distinct from the Hugging
        Face FT mechanism (July incident coverage, neutral-technical vs
        Meta-adversarial) and mechanism 18 (device dual-standard).
