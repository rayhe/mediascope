  always_on_device_dual_standard:
    mechanism_id: 18
    name: Hardware Privacy Framing Inversion
    date_analyzed: '2026-08-09'
    extends: 'Dual-Lens Paradox (Mechanism #7) - hardware-specific privacy framing
      inversion'
    finding: 'FT applies a dual editorial standard when covering functionally identical
      "always-on sensing" technology from OpenAI vs Meta. OpenAI''s Jony Ive device
      (continuous audio/visual sensing, contextual memory) is framed aspirationally
      as "iPhone of artificial intelligence" with constructive technical challenges.
      Meta''s super-sensing glasses (continuous audio capture, photos every few seconds,
      contextual recall) receive surveillance/privacy-threat framing with emphasis
      on deception (LED deactivation), data extraction, and regulatory risk. The variable
      controlling the editorial frame is manufacturer identity and financial relationship,
      not the technology itself.

      '
    openai_device_coverage:
      reporter: George Hammond, Madhumita Murgia
      articles:
      - title: OpenAI and Jony Ive have yet to solve key technical and software issues
        date: '2025-10-05'
        url: https://www.techmeme.com/251005/p1
        framing: constructive_neutral
        language:
        - iPhone of artificial intelligence
        - palm-sized device without a screen
        - audio and visual cues from the physical environment
        - a friend who's a computer
        - 'trade-offs (re: privacy)'
        - normal parts of the product development process
        privacy_treatment: mentioned as design challenge, not threat
        source_quote: '"The concept is that you should have a friend who''s a computer
          who isn''t your weird AI girlfriend... like Siri but better"

          '
        openai_deal_disclosed: false
        corroboration_sources:
        - https://techcrunch.com/2025/10/05/openai-and-jony-ive-may-be-struggling-to-figure-out-their-ai-device/
        - https://www.livemint.com/technology/tech-news/sam-altman-and-jony-ive-s-chatgpt-powered-hardware-ai-device-hits-technical-roadblocks-report-11759741057243.html
        - https://www.pymnts.com/artificial-intelligence-2/2025/openai-and-jony-ive-hit-roadblocks-in-developing-ai-device/
        - https://www.androidauthority.com/openai-jony-ive-ai-device-issues-3604088/
        - https://www.windowscentral.com/artificial-intelligence/openais-jony-ive-ai-device-delayed-beyond-2026-over-privacy-compute-and-personality-issues
      - title: OpenAI and Jony Ive's secretive AI device
        date: '2026-06-01'
        url: https://www.outlookbusiness.com/artificial-intelligence/openai-jony-ive-face-design-and-engineering-roadblocks-on-secretive-ai-device-project
        framing: constructive_neutral
        language:
        - continuously aware assistant
        - running contextual memory
        - practical obstacles (not privacy violations)
        - technical and product trade-offs (not surveillance implications)
        privacy_treatment: mentioned as engineering challenge alongside compute capacity
        openai_deal_disclosed: false
      framing_pattern: 'Always-on sensing is described as innovation and aspiration.
        Privacy is a design challenge to solve, not a societal threat to prevent.
        The device is anthropomorphized positively ("friend," "assistant"). Technical
        difficulties are normalized ("normal parts of product development"). No surveillance
        language. No mention of wiretapping laws. No civil liberties framing.

        '
    meta_glasses_coverage:
      reporter: Hannah Murphy
      articles:
      - title: Meta testing AI glasses that continuously record audio and take photos
          every few seconds
        date: '2026-07-08'
        url: https://www.techmeme.com/260708/p2
        framing: adversarial_surveillance
        language:
        - continuously collect audio
        - taking photos every few seconds
        - Meta executives don't want to activate the LED
        - data collected through the glasses could be used to train its own AI models
        - civil liberty and privacy risks
        - wiretapping laws
        - biometric data laws
        privacy_treatment: central narrative frame, leading the story
        source_quote: '"Privacy experts argue that always-on devices could violate
          data privacy or biometric data laws. It is also unclear whether the company
          or the wearer would be liable for potential violations of wiretapping laws."

          '
        openai_deal_disclosed: false
      framing_pattern: 'Always-on sensing is described as surveillance. Privacy is
        a legal threat and societal risk, not a design challenge. The LED deactivation
        is framed as deliberate concealment. Data training use is highlighted as extraction.
        Legal risk language (wiretapping, biometric laws) deployed prominently. Story
        catalyzed "creepy," "privacy-invasive" secondary coverage cascade.

        '
    comparison:
      identical_capability: Both devices employ continuous audio/visual sensing with
        AI-powered contextual memory
      openai_frame: aspirational innovation, technical challenge, 'iPhone of AI'
      meta_frame: surveillance threat, privacy invasion, regulatory risk, deception
      variable: manufacturer identity and financial relationship, not technology
      undisclosed_conflict: 'FT did not disclose its OpenAI licensing deal ($5-10M/yr)
        in any of these articles. When describing OpenAI''s always-on device as a
        "friend" while describing Meta''s always-on glasses as surveillance, FT''s
        readers are unaware that FT receives revenue from one company and $0 from
        the other.

        '
