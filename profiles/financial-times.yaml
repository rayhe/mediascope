      finding that financial relationships predict coverage tone.

  privacy_coverage_absence:
    finding: >
      FT has NOT produced original investigative coverage of Google's
      privacy practices in 2025-2026 comparable to its Meta investigations.
      Google Gemini data tracking lawsuit (dismissed Jul 2026), Google
      voice recording leaks (2019), and Android telemetry studies (Google
      collects 20x more data than Apple from iOS) have received NO FT
      investigative follow-up, despite being directly analogous to the
      privacy concerns FT highlights in its Meta coverage. Google's
      existing data practices are objectively more extensive than Meta's
      wearables sensing — Google Assistant, Android telemetry, Gemini
      data processing, YouTube tracking — yet FT's privacy investigations
      target Meta exclusively.
