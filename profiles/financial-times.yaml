# Litigation Connections
litigation_connections: []

# AI Crawl Policy
ai_crawl_policy:
  blocks_gptbot: true
  blocks_ccbot: true
  blocks_google_extended: false
  notes: "FT has been aggressive about protecting content from unauthorized AI scraping. Signed OpenAI licensing deal Apr 2024; also has Prorata.ai deal."

# Target Entity Clusters
target_entities:
  "Meta":
    aliases: ["Meta Platforms", "Facebook", "Instagram", "WhatsApp", "Threads", "Reality Labs"]
    regex: "\\b(Meta(?:\\s+Platforms)?|Facebook|Instagram|WhatsApp|Threads|Reality Labs)\\b"
  "Nikkei":
    aliases: ["Nikkei Inc", "Nikkei Asia", "Nikkei Asian Review"]
    regex: "\\b(Nikkei(?:\\s+(?:Inc|Asia|Asian Review))?)\\b"

# Media Bias Ratings
bias_ratings:
  ad_fontes:
    reliability: null  # FT not prominently rated by Ad Fontes
    bias: null
  allsides: "Center"
  mbfc: "Least Biased"
  notes: >
    FT is generally regarded as centrist/business-oriented with high factual reporting
    standards. MBFC rates it "Least Biased" with "Very High" factual reporting.
    Paywall limits public access and therefore limits bias-rating coverage.
