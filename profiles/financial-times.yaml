        episodes:
          - {company: "Anthropic", title: "Are Anthropic really the good guys?", tone: "virtue_presumed"}
          - {company: "Google", title: "Google DeepMind plans its comeback", tone: "recovery"}
          - {company: "OpenAI", title: "Sam Altman may make or break OpenAI", tone: "balanced_risk"}
          - {company: "xAI", title: "Elon Musk wants AI in space", tone: "ambition"}
          - {company: "Meta", title: "Zuckerberg's $100bn gamble", tone: "risk_excess_doubt"}
        title_framing_analysis:
          finding: >
            Meta is the ONLY company framed through risk/doubt/excess language.
            Anthropic gets virtue framing. Google gets recovery framing. OpenAI gets
            balanced personality framing. xAI gets ambition framing. Meta gets
            "gamble" + "can they buy their way in?" — uniquely adversarial.
          meta_title_tone: -0.6
          anthropic_title_tone: 0.1
          openai_title_tone: -0.1
          google_title_tone: 0.0
          xai_title_tone: 0.1

      wired_uk_background:
        finding: >
          Murgia was previously associate editor/senior editor at Wired UK, part of
          the Condé Nast media family. She carries editorial culture from the same
