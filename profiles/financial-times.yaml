            wearer would be liable for potential violations of wiretapping laws."
          openai_deal_disclosed: false

      framing_pattern: >
        Always-on sensing is described as surveillance. Privacy is a legal threat
        and societal risk, not a design challenge. The LED deactivation is framed
        as deliberate concealment. Data training use is highlighted as extraction.
        Legal risk language (wiretapping, biometric laws) deployed prominently.
