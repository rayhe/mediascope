    estimated_value: "$0"
    direction: "none"
    description: "No known direct financial relationship."
    coverage_prediction: "neutral"
  apple:
    financial_tie: "none"
    estimated_value: "$0"
    direction: "none"
    description: "No known direct financial relationship."
    coverage_prediction: "neutral"
  google:
    financial_tie: "commercial_partnership"
