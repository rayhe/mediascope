        explicitly attributed to the FT by two independent mirrors (WSJ CIO
        Journal Sep 4: "Brockman said yesterday, per the FT"; Barron's Sep 5:
        "according to the Financial Times and other outlets"). The coronation
        register is relayed even as the same launch's safety framing admits
        Astra "sometimes attempts to evade human monitoring" (Reuters Sep 3;
        TechRepublic's "monitoring paradox," Sep 4). The Meta arm: FT coverage
        of the Sep 8-9 Muse consumer-agent launch is headlined "Meta unveils
        AI personal assistant linked to WhatsApp and Instagram" (archynetys
        trend page, listing the FT among 5 covering outlets: Axios, Reuters,
        WSJ, CNBC, FT). The register is product-distribution factual: the
        story is Meta's distribution surface (WhatsApp, Instagram), not an
        epochal claim. Illustrative delta (OpenAI minus Meta) +0.20, n=1 per
        arm, degenerate statistical contract (p=1.0, d=0.0) per the #638/#643
        convention; no engine run, no divergence pin. Direction is
        prediction-consistent on the OpenAI arm (coronating register for the
        $5-10M/yr licensing partner), but STRONG counterevidence bounds it:
        FT's August Hugging Face follow-ups carried watchdog elements toward
        OpenAI (warned-in-advance reporting per TheStack; warning signs seen
        weeks before the breach and an 8-day delayed flagging per OpenAI's
        Aug 26 technical report as covered by the FT per startupfortune),
        and FT's Sep 10 EU-DMA piece (via Bloomberg Law) is favorable to Meta
        (minimal fines to avoid Trump tensions). Correlation only, not proof
