    2024, Google News AI pilot Feb 2026, Microsoft PCM Feb 2026, NO Meta deal). The
    FT''s OpenAI deal was signed BEFORE she was hired - she entered a pre-existing
    financial incentive structure. CROSS-PUBLICATION BRIDGE: Through the MIT TR ×
    FT "State of AI" newsletter partnership (launched Oct 29, 2025), her FT coverage
    feeds back into MIT TR. Her specific topic is "The End of Privacy" (with MIT TR''s
    Eileen Guo) - directly relevant to Meta wearables/glasses/privacy coverage. This
