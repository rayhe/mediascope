            - "practical obstacles (not privacy violations)"
            - "technical and product trade-offs (not surveillance implications)"
          privacy_treatment: "mentioned as engineering challenge alongside compute capacity"
          openai_deal_disclosed: false

      framing_pattern: >
        Always-on sensing is described as innovation and aspiration. Privacy is a
        design challenge to solve, not a societal threat to prevent. The device is
        anthropomorphized positively ("friend," "assistant"). Technical difficulties
