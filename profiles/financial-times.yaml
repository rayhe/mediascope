    covered Meta-as-AI-company in the current AI era. This is despite Meta being:
    (a) the largest open-source AI developer (Llama, 700M+ downloads), (b) a $100B+
    annual AI infrastructure investor, (c) the category leader in AI wearables (Ray-Ban
    Meta, 10M+ units). Meta''s AI work is covered exclusively through the platform/surveillance
    lens (Murphy), never through the AI/innovation lens (Murgia). This editorial lens
    assignment is the most structurally impactful asymmetry mechanism at FT, because
    it determines which conceptual framework - and which set of loaded metaphors -
    a reader encounters when reading about Meta''s AI products.

    '
