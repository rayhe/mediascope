    diagnostic_comparison_ar_glasses:
      finding: 'The most important diagnostic comparison. When Murphy covers Meta''s
        always-on sensing glasses, she uses surveillance/legal-threat language (wiretapping
        laws, biometric data laws, civil liberties, LED deactivation as deception).
        When she covers Snap''s AR glasses - which also have cameras and record the
        user''s environment - she uses exclusively business strategy language (divisive
        bet, efforts to revive, staff turnover). There is ZERO privacy or surveillance
        language in her Snap wearables coverage.

        This is significant because: 1. Same reporter covering both companies eliminates
        between-reporter variation 2. Same product category (AR glasses with cameras)
        eliminates technology variation 3. Both companies have similar scale of user
        data concerns 4. The ONLY variable is the company name

        Unlike the WIRED pattern (different desks for different entities) or the NYT
        pattern (different reporters for different entities), the FT pattern shows
        that a SINGLE reporter applies different editorial standards to the same product
        category depending on the manufacturer. This is the strongest evidence of
        company-specific editorial framing in the MediaScope dataset.

        '
