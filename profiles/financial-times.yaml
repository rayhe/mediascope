ownership_chain:
- name: Financial Times
  entity_type: publisher
  description: 'Founded 1884, first printed on pink paper 1893. Premier global business
    newspaper. Acquired by Nikkei from Pearson for £844M ($1.3B) in 2015, beating
    Axel Springer. FT Group includes FT.com, How to Spend It (now HTSI), FT Labs,
    FTChinese, FT Specialist (The Banker, Investors Chronicle, etc.). Pearson retained
    50% stake in The Economist Group and FT''s One Southwark Bridge London HQ. Circulation
    ~737K at time of sale, 70% digital. First major newspaper to successfully charge
    for online access. Strong subscription model - digital-first. FT had £334M revenue
    in 2014. FT Video, podcast network (Tech Tonic, etc.), and live events arm.

    '
- name: Nikkei Inc.
  entity_type: parent_company
  description: 'Japan''s largest media company, employee-owned (unusual structure
    - not publicly traded). Publishes The Nikkei, Japan''s most-read business newspaper
    with 3M+ print circulation. Lends name to the Nikkei 225 stock index. Founded
    1876. Headquarters Tokyo. 26 global news bureaus. Operations: newspapers, magazines,
    digital media, database services, broadcasting, economic/cultural events. Acquired
    FT as strategic hedge against Japan''s shrinking domestic market (population projected
    -30% by 2065). Also owns Nikkei Asian Review (now Nikkei Asia). Chairman/CEO at
    time of acquisition: Tsuneo Kita. Current CEO: Naotoshi Okada (since 2018). Revenue
    est. $3B+ (consolidated, Nikkei group, private - limited financial disclosure).
    No US-listed equity. Nikkei''s deep ties to corporate Japan raise editorial independence
    questions re: Japanese companies covered by FT.

    '
revenue_relationships:
- partner: Apple
  relationship_type: distribution
  description: 'FT was notably one of the first major publishers to bypass Apple''s
    App Store in 2011, building a web app instead to avoid Apple''s 30% revenue cut
    on subscriptions. Later returned to App Store. Relationship is distribution, not
    licensing.

    '
  date_established: '2011'
editorial_leadership:
- name: Roula Khalaf
  title: Editor-in-Chief
  notes: 'First woman to lead the FT, appointed January 2020. Succeeded Lionel Barber
    (2005-2020). Lebanese-British journalist. Previously deputy editor, Middle East
    editor, Lex Column. Known for investigative push and digital strategy expansion.
    Under her tenure FT expanded video, podcasts, newsletters.

    '
key_journalists:
- name: Hannah Murphy
  beat: Meta, social media, AI, AR/VR, disinformation, cyber security
  location: San Francisco
  known_patterns: 'Primary Meta/Facebook beat reporter since ~2019. Based in SF/Silicon
    Valley. Previously covered financial services, fintech, crypto from FT London
    office. Source-heavy reporting - frequently first to break internal Meta reorgs,
    product strategy shifts, and AI development milestones. Contributed to Channel
    4 documentary ''Billionaires'' on Zuckerberg. Co-hosts FT Tech Tonic podcast episodes
    on Meta/AI. Recent 2026 scoops: Meta equity award cuts (Feb), Vishal Shah metaverse
    → AI PM move, Meta AI glasses continuous recording feature, Alexandr Wang/Muse
    Spark AI model, Meta agentic tools/OpenClaw-like assistant, Oversight Board tensions
    over Zuckerberg "free speech" overhaul. High-volume, high-impact Meta coverage.

    '
  cross_entity_coverage_analysis:
    finding: 'Hannah Murphy covers multiple social media companies - Meta, Snap, TikTok,
      X/Twitter, Pinterest - not just Meta. Within her own beat, she applies DIFFERENT
      editorial standards to Meta versus comparable companies. The most striking diagnostic
      case is AR glasses: when covering Meta''s always-on sensing glasses, Murphy
      deploys surveillance language ("wiretapping laws," "biometric data laws," "civil
      liberties," "LED deactivation" as deception). When covering Snap''s AR glasses
      (Spectacles) with similar camera capabilities, she uses business strategy language
      ("divisive bet," "efforts to revive"). No privacy or surveillance framing appears
      in her Snap wearables coverage.

      '
