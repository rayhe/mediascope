  regulatory_posture:
    stance: "adversarial"
    description: >
      FT filed a formal CMA response (Mar 2026) demanding Google provide
      granular, page-level opt-in/out controls for AI content use across
      training, grounding, and fine-tuning. FT described bundled controls
      as 'significantly weakening our autonomy.' This is genuinely
      adversarial toward Google — but it stays in REGULATORY FILINGS,
      not in FT's Google coverage.
    split_finding: >
      FT's adversarial Google posture is confined to regulatory filings
      (CMA responses, advocacy). FT's adversarial Meta posture appears in
      the coverage itself (surveillance language, privacy alarm, legal threat
      framing in published articles). This creates a two-channel system:
      Google gets adversarial regulatory treatment but neutral-to-positive
      coverage; Meta gets adversarial coverage as the primary channel.
      The regulatory-coverage split may reflect editorial restraint toward
      a deal partner (Google News AI pilot) — keep the business relationship
      professional in public while pursuing institutional interests through
      regulatory channels.
