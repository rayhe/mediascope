      treatment but neutral-to-positive coverage; Meta gets adversarial coverage as
      the primary channel. The regulatory-coverage split may reflect editorial restraint
      toward a deal partner (Google News AI pilot) - keep the business relationship
      professional in public while pursuing institutional interests through regulatory
