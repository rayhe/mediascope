    entities_not_covered_by_murphy:
      description: 'Murphy does NOT cover OpenAI, Anthropic, Apple, or Google. Those
        are handled by different FT reporters: Madhumita Murgia (AI Editor) covers
        AI industry broadly (OpenAI, Anthropic, DeepSeek); George Hammond covers deals
        and M&A (OpenAI Jony Ive device); other tech reporters cover Apple and Google.
        This means the full cross-entity comparison at FT requires combining within-reporter
        analysis (Murphy: Meta vs Snap) with between-reporter analysis (Murphy: Meta
        vs Hammond/Murgia: OpenAI).

        '
    overall_classification: 'Murphy''s coverage is Meta-adversarial, not social-media-adversarial.
      She covers the full social media landscape but reserves surveillance/legal-threat
      framing disproportionately for Meta. This cannot be explained by beat assignment
      alone (she covers multiple companies) or by product category (she covers AR
      glasses from multiple companies). The variable controlling the editorial frame
      is company identity.

      '
- name: Madhumita Murgia
  beat: AI, emerging technology, science
  location: London
  role: AI Editor (first at FT, since Feb 2023)
  known_patterns: 'FT''s first AI Editor. Author of ''Code Dependent: Living in the
    Shadow of AI'' (shortlisted for 2024 Women''s Prize for Non-Fiction). Covers the
    AI industry broadly - OpenAI, Anthropic, DeepSeek, Google AI, Meta AI. Previously
    European technology correspondent, tech editor at Daily Telegraph, associate editor
    at Wired UK. Hosts FT Tech Tonic podcast. Former Stern Fellow at Washington Post.

    '
  cross_entity_coverage_analysis:
    finding: 'THE DUAL-LENS PARADOX (Mechanism #6): Murgia is the FT''s AI Editor
      - the most senior AI journalism position - mandated to "head up the FT''s coverage
      of artificial intelligence stories." She covers OpenAI, Anthropic, Google DeepMind,
      and the broader AI industry with innovation/aspirational framing. Yet she has
      NEAR-ZERO Meta coverage, despite Meta being the world''s largest open-source
      AI developer (Llama), a $100B+ AI infrastructure investor, and the leading AI
      wearables manufacturer.

      Instead, Meta''s AI work is covered exclusively by Hannah Murphy (social media
      beat reporter) using surveillance/privacy framing. This creates a structural
      dual-lens: the SAME technology (AI-powered wearable) gets framed as "innovation"
      or "surveillance" based solely on which editorial lens covers the manufacturer.
      OpenAI''s Jony Ive AI wearable → AI lens (Murgia/Hammond) → "iPhone of AI."
      Meta''s AI glasses → Platform lens (Murphy) → "surveillance infrastructure."
      The technology is identical; the framing diverges completely.

      Unlike the WIRED mechanism (#1, desk assignment) or NYT mechanism (#2, between-reporter
      assignment), the FT mechanism operates at the EDITORIAL LENS level: not just
      which reporter, but which conceptual framework covers which company. The AI
      lens sees innovation; the platform lens sees surveillance. The company determines
      the lens, not the technology.

      '
    dual_lens_paradox:
      mechanism: '7'
      name: Dual-Lens Paradox
      description: 'Editorial lens assignment creates framing asymmetry independent
        of technology. FT''s AI desk (Murgia) covers every major AI company EXCEPT
        Meta. FT''s platform desk (Murphy) covers Meta using surveillance framing.
        Same product category, different editorial framework, opposite framing.

        '
      ai_lens_entities:
      - OpenAI
      - Anthropic
      - Google DeepMind
      - xAI
      platform_lens_entities:
      - Meta
      - Snap
      - TikTok
      - Pinterest
      ai_lens_framing: innovation, safety, responsibility, frontier
      platform_lens_framing: surveillance, privacy, labor exploitation, gamble
    openai_deal_announcement:
      finding: 'Murgia herself wrote the FT article announcing the FT-OpenAI content
        licensing deal on April 29, 2024. She then continued covering OpenAI extensively
        - rogue AI agents, China model sales, AI Labs podcast series - without disclosing
        the financial relationship she personally announced. This is the strongest
        evidence of PERSONAL non-disclosure in the dataset: the journalist who announced
        the deal knows about it and covers the company without mentioning it.

        '
      date: '2024-04-29'
      techmeme_url: https://www.techmeme.com/240429/p7
      subsequent_disclosure: false
      subsequent_disclosure_note: 'Never disclosed in subsequent OpenAI coverage including
        rogue AI agent article, China sales article, or AI Labs podcast series.

        '
      significance: 'Personal non-disclosure. The announcement-to-subsequent-coverage
        pipeline eliminates any defense of ignorance - Murgia knows about the deal
        because she reported it, yet her subsequent coverage treats OpenAI as if FT
        has no financial interest.

        '
