    wired_uk_background:
      finding: 'Murgia was previously associate editor/senior editor at Wired UK,
        part of the Condé Nast media family. She carries editorial culture from the
        same publication group that produces the most adversarial Meta coverage in
        the MediaScope dataset (WIRED US under Katie Drummond). While this does not
        prove bias transfer, it provides a cultural context for how the FT''s AI desk
        may absorb framings from Condé Nast editorial norms.

