# ----- WIRED <-> ADVOCACY RELATIONSHIP -----

wired_advocacy_nexus:
  pattern: "Investigative amplification loop"
  description: >
    WIRED produces original investigative reporting (NameTag code discovery,
    LED removal reporting), which advocacy groups then cite in coalition letters
    and FTC complaints. Advocacy groups produce demands and legal pressure,
    which WIRED then covers as news. This creates a mutual amplification loop
    where each party's output feeds the other's.

  wired_investigations_cited_by_advocacy:
    - "NameTag code in Meta AI app (Jun 2026) — cited by EPIC, academic researchers"
    - "LED removal services investigation — cited in PA HB 2603 framing"

  advocacy_actions_covered_by_wired:
    - "75-org ACLU coalition letter (Apr 2026)"
    - "EPIC FTC complaint (Feb 2026)"
    - "Senate letters (Markey, Wyden, Merkley)"

  key_question: >
    Is this loop evidence of coordination, or normal journalism-advocacy symbiosis?
    Both parties benefit: WIRED gets scoops that drive subscriptions, advocacy
    groups get amplification. The critical test is whether WIRED's editorial
    decisions (story selection, framing, source emphasis) are influenced by
    Advance Publications' financial interests (Reddit position, competitive
    dynamics with Meta) or by genuine editorial judgment about newsworthy privacy issues.

  assessment: >
    CURRENT EVIDENCE LEANS TOWARD ORGANIC SYMBIOSIS with structural incentive
    alignment, not directed coordination. Key reasons:
    1. Gizmodo (Keleops AG, zero Condé Nast connection) produces similar coverage
    2. WSJ (News Corp) covers same issues with different framing (market, not privacy)
    3. Advocacy groups pre-date WIRED's specific investigations
    4. WIRED's NameTag code investigation is genuine technical journalism
    5. Multiple independent outlets amplify advocacy campaigns identically
    HOWEVER: The structural conflict (Advance owns both WIRED's parent and
    Reddit, which competes with Meta for ad dollars) means WIRED has extra
    incentive to pursue Meta-negative stories even when other equally newsworthy
    stories exist.

