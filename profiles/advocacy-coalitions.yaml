# ----- COORDINATION ASSESSMENT -----

coordination_assessment:
  hypothesis: "Is the anti-Meta-glasses press narrative coordinated?"
  evidence_for_coordination:
    - "Two coalition letters within weeks with overlapping signatories suggest organized campaign infrastructure"
    - "EPIC had FTC complaint ready the same day NYT broke the NameTag story — pre-positioned"
    - "Multi-jurisdiction pressure (US federal + US state + Kenya) suggests sophisticated campaign planning"
    - "UltraViolet funded by Open Society for 'platform accountability' — professional opposition"
    - "WIRED-advocacy amplification loop creates self-reinforcing narrative cycle"
    - "Advance Publications has ~$5.9B Reddit stake creating structural competitive incentive"
  evidence_against_coordination:
    - "Gizmodo (Keleops AG, Swiss-owned) produces similar coverage independently"
    - "WSJ covers same issues with different framing — proving the story is genuinely newsworthy"
    - "State-level legislation is bipartisan (R in LA, D in PA) — not partisan coordination"
    - "Advocacy groups have been anti-facial-recognition for years, pre-dating Meta glasses"
    - "WIRED's NameTag investigation is genuine technical journalism (code review, security researchers)"
    - "Meta's own internal memo about timing feature launches during political distraction INVITES this opposition"
    - "Meta removed NameTag code after WIRED report — suggests the reporting had genuine impact on real plans"
  verdict: >
    MIXED. The advocacy campaign against Meta glasses is professionally organized and
    well-funded, but this is standard advocacy infrastructure — not evidence of
    coordination with Condé Nast/WIRED. The WIRED-advocacy feedback loop is real
    but normal in investigative journalism. The structural conflict (Advance/Reddit
    competitive position) creates incentive alignment but not proven direction.
    The strongest counter-evidence is Gizmodo's independent convergent coverage:
    if the narrative were WIRED-specific coordination, Gizmodo (different ownership,
    different financial orbit) wouldn't produce the same framing independently.
    ASSESSMENT: Organic advocacy + structural incentive alignment + editorial
    judgment, not directed corporate coordination.
  updated: "2026-08-01"
