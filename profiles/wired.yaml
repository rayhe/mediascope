    \ database (as of Jun 2025). Used in 153 countries. Cashflow positive since 2004. PRODUCTS: Turnitin Originality (plagiarism\
    \ + AI detection), GradeMark (grading), PeerMark (peer review), Gradescope (AI-assisted grading, acquired 2018 from Berkeley),\
    \ iThenticate (publisher plagiarism detection). Also runs plagiarism.org informational site. ACQUISITIONS UNDER ADVANCE:\
    \ VeriCite (2018, pre-acquisition), Unicheck (2020), Ouriginal (2021, merger of Urkund + PlagScan). Each consolidated\
    \ Turnitin's global monopoly position in academic integrity software. ADDITIONAL SUBSIDIARIES: - ExamSoft (exam security):\
    \ AI-powered remote proctoring via ExamMonitor (facial recognition +\n  AI-driven behavior analysis to flag suspicious\
    \ activity during exams) and ExamID (identity\n  verification via biometric facial comparison). Raises civil liberties\
    \ concerns about AI\n  surveillance in education. ExamSoft is widely used by bar exam boards, medical licensing, and\n\
    \  universities for high-stakes assessments.\n- ProctorExam (Amsterdam): European online proctoring subsidiary, expanding\
    \ Turnitin's AI\n  surveillance footprint internationally.\nThese subsidiaries deepen the DUAL-SIDED AI CONFLICT: Advance\
    \ profits from AI content generation (Condé Nast licensing), AI content detection (Turnitin Originality), AND AI-powered\
    \ human surveillance (ExamSoft/ProctorExam) - three sides of the AI arms race, all under one owner. AI WRITING DETECTION\
    \ (launched Apr 2023): Claims <1% false positive rate for documents >20% AI-written. Processes 200M+ papers through AI\
    \ detector. Data shows ~11% of submissions have ≥20% AI writing, ~3% have ≥80% AI writing. Higher false positive rates\
    \ for documents <20% AI-written (asterisk added to those scores). CONTROVERSIES: Stanford researchers found AI detectors\
    \ biased against non-native English speakers (May 2023). OpenAI withdrew its own AI detector due to \"low rate of accuracy\"\
    \ (26% detection rate). A July 2023 study of 14 AI detection tools found none scored above 80% accuracy. LA Times (Jun\
    \ 21, 2026): \"Inside College AI Cheating Wars: Extreme Surveillance, False Accusations, Jarring Confusion\" - documenting\
    \ false accusation cases, students deliberately inserting errors to avoid AI detection, and policy chaos. Turnitin's own\
    \ disclaimer: model \"may not always be accurate\" and \"should not be used as the sole basis for adverse actions against\
