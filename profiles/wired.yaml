  camera_count_paradox: 'The most damning data point in the lane assignment analysis: Apple Vision Pro has 12 outward- facing
    cameras, 5 sensors, and 6 microphones - by FAR the most surveillance-capable consumer wearable ever manufactured. Meta
    Ray-Ban has a single 12MP camera. WIRED runs multi-part investigative campaigns against the device with ONE camera while
    its senior consumer tech correspondent writes emotionally about "crying inside" the device with TWELVE cameras. The 12-camera
    device gets ZERO surveillance framing. The 1-camera device gets sustained surveillance framing. The variable is NOT the
    hardware capability - it''s the manufacturer identity. This eliminates "Meta glasses are inherently more privacy-risky"
    as an explanation for the framing differential, because the Apple device is objectively more capable of surveillance.

    '
  editorial_lane_assignment_mechanism: 'The lane assignment doesn''t require conscious editorial bias. It works through three
    structural steps: (1) Product review assignments go to the senior consumer tech correspondent (Goode), who naturally produces
    empathetic first-person narrative. (2) Meta coverage is assigned to the investigative/accountability team (Cameron, Mehrotra),
    who naturally produce surveillance-alarm framing. (3) Editorial leadership (Katie Drummond) makes these assignments, determining
    the narrative before a single word is written. The same journalist who writes "I cried" about Apple''s 12-camera headset
    never gets assigned to write about Meta''s 1-camera glasses. This structural effect is more analytically important than
    any individual article''s word choices because it operates at the editorial assignment level.

    '
  financial_alignment: 'The lane assignment correlates with financial incentives: Apple is in licensing negotiations with
    Condé Nast (WIRED''s parent) → softer coverage predicted and delivered. Meta has no financial relationship with Condé
    Nast → adversarial coverage predicted and delivered. The lane assignment mechanism PRODUCES the coverage differential
    that the financial relationship PREDICTS.

    '
  analytical_significance: 'The lane assignment pattern - Goode gets Apple/Snap wearables, investigative reporters get Meta
    wearables - produces a systematic framing asymmetry at the publication level that is STRUCTURALLY UNDETECTABLE in any
    single article. Each article, read alone, appears editorially legitimate: Goode writes a great product review of Apple
    Vision Pro; Cameron and Mehrotra write a legitimate investigation of Meta''s NameTag code. The asymmetry only becomes
    visible when you ask: why does the journalist who would naturally write "I cried inside the Meta Ray-Ban Display" never
    get assigned that story? And why does the journalist who would naturally investigate Apple''s 12-camera bystander consent
    implications never get assigned THAT story?

    '
