  cross_entity_coverage_analysis:
    mechanism_name: emotional_register_asymmetry
    mechanism_number: 8
    date_analyzed: '2026-08-08'
    summary: 'Paresh Dave is WIRED''s most prolific Big Tech investigative reporter, covering Meta, OpenAI, and Google with
      significant source access at all three companies. His coverage reveals a systematic emotional register asymmetry: Meta
      coverage deploys maximally dramatic language sourced from anonymous disgruntled employees, while OpenAI and Google coverage
      of comparable internal dysfunction uses measured, analytical, document-based framing. The asymmetry is not in WHAT he
      covers (he investigates all three critically) but in HOW he frames it - the emotional temperature and headline escalation
      applied selectively to Meta.

      '
    meta_coverage:
      aggregate_tone: maximally_dramatic_employee_sourced
      emotional_register: extreme
      article_count: 7
      headline_language_samples:
      - '''Tell Him He''s a Piece of Shit'': Meta''s New AI Unit Is a Total Mess'
      - 'Dark Mood Inside Meta (multi-byline: Dave, Goode, Levy, Schiffer)'
      - Meta internally exposed data from employee-tracking program
      articles:
      - title: '''Tell Him He''s a Piece of Shit'': Meta''s New AI Unit Is a Total Mess'
        date: '2026-06-12'
        article_type: internal_sources
        emotional_language:
        - gulag
        - soul-crushing
        - total mess
        - piece of shit
        - being the company's bitch
        - zero purpose in life
        - drudgework
        source_type: 3 anonymous current employees
        framing_notes: 'Profanity-in-headline editorial choice. Employee quotes selected for maximum emotional impact. Applied
          AI unit (6,500 engineers) framed through the lens of its most disgruntled members. Headline uses employee profanity
          - an editorial choice that maximizes outrage clickthrough. The article describes Meta''s AI reorg as employees being
          assigned to "drudgework" testing AI models, with one comparing it to "the gulag." Meta declined to comment.

          '
        tone_score: -0.8
        source_url: https://technologistmag.com/tell-him-hes-a-piece-of-shit-metas-new-ai-unit-is-a-total-mess/
      - title: Dark Mood Inside Meta
        date: '2026-05-14'
        article_type: multi_byline_investigation
        co_authors:
        - Lauren Goode
        - Steven Levy
        - Zoë Schiffer
        emotional_language:
        - horrifically, historically low
        - everyone is unhappy
        - nobody is happy
        - do it now, jesus fucking christ
        - belittled and berated
        - privacy zealots
        source_type: multiple anonymous employees across departments
        framing_notes: 'Four-byline WIRED investigation - maximum editorial firepower. Every department quoted anonymously
