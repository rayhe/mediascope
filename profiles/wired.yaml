    - '[MODERATE] The hire could reflect Condé Nast recruiting the best available luxury executive
      regardless of Meta origin'
    - '[WEAK] WIRED''s tech coverage is primarily US editorial - French CBO appointment may have
      limited influence on US tech journalism'
