    \ Qatar IA\n  backing the bid) - expected unconditional approval. Also cleared by South Africa, China,\n  NZ, Ukraine,\
    \ Serbia, North Macedonia + FDI authorities in Spain, Germany, Slovenia, Belgium,\n  Czechia, Italy, France, Romania.\
    \ Canada: no statutory impediment after Competition Act\n  waiting period expired.\n  STATE AG ESCALATION (Jul 8-11):\
    \ Oregon AG Dan Rayfield initially sought expedited court\n  order to compel Paramount to produce \"Project Warrior\"\
    \ documents - internal code name for\n  regulatory clearance strategy - and records of Trump administration lobbying (Reuters,\
