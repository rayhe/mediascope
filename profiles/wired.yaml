    description: >
      CRITICAL ABSENCE: Condé Nast has NO AI content licensing deal with Google — the only major
      AI platform alongside Meta with zero AI licensing revenue to Condé Nast. This is notable
      because Google has signed AI pilot deals with competitors including The Guardian, The Washington
      Post, Der Spiegel, El País, Folha, Infobae, Kompas, Times of India, and The Washington Examiner
      (News AI pilot program, launched December 2025).

      GOOGLE SHOWCASE PHASE-OUT (Jun 25-29, 2026): Per The Information (reported by NY Post, Inshorts),
      Google is now phasing out its existing Showcase program — the annual-payment licensing arrangement
      through which Google compensated publishers for curated news panels. Google told some publishers
      Showcase is being ENDED and replaced by the News AI pilot program, which requires publishers to
      grant Google broad content-use rights, potentially including rights to train AI models on their
      content. Publishers who decline the new AI pilot risk losing their existing Showcase payments.
      Jason Kint, CEO of Digital Content Next (trade group representing NYT, WashPost, News Corp):
      "This is Google's game. They're gonna dominate here. There's no fair deal discussions that
      can happen with Google. It's really a matter of how much money they want to drop on an
      individual organization."

      GOOGLE AI SEARCH SCALE: AI Overviews now reaches 2.5 billion monthly active users; AI Mode
      surpassed 1 billion monthly users (per Google, Jun 2026). These are the surfaces where
      publisher content is consumed without click-through.

      UK CMA OPT-OUT REQUIREMENTS (Jun 4, 2026): UK Competition and Markets Authority imposed
      "world-first" conduct requirements on Google, mandating effective opt-out tools for AI features
      separate from traditional search (previously bundled). Google has 9 months to implement. Testing
      UK subset first. CMA Chief Executive Sarah Cardell: "With features like AI Overviews rapidly
      reshaping online search, it is crucial that content publishers, including news organisations,
      have appropriate bargaining power." Condé Nast's CEO Lynch had previously called Google's
      bundled opt-out arrangement "pernicious" (FT, Feb 27, 2026).

      ADVERTISING: Google remains a significant programmatic advertising revenue source for Condé Nast
      despite the AI licensing exclusion. This creates a COMPOUND TENSION: Condé Nast depends on Google
      for advertising revenue while publicly attacking Google's AI practices and receiving zero
