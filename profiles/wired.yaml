      correction_note: 'Prior ZERO-coverage claim FALSE - WIRED DID publish 1 direct article Jul 10 2026 (Maxwell Zeff, https://www.wired.com/story/apple-sues-openai-allegedly-stealing-ip-hardware/). Browser verification Aug 28 invalidates original silence claim.'
