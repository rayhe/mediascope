cross_entity_wearables_framing:
  date_analyzed: '2026-08-05'
  summary: 'WIRED''s wearable coverage reveals stark framing asymmetry by manufacturer identity. Camera-equipped wearables
    from Apple and Snap receive empathetic/playful product coverage from WIRED''s most senior consumer tech correspondent
    (Lauren Goode), while Meta''s camera glasses receive institutional surveillance/privacy alarm framing from other staffers
    (Dell Cameron, Dhruv Mehrotra). Same hardware capability (face-mounted cameras), radically different narrative treatment
    determined by manufacturer identity. The asymmetry is most visible in the HARDWARE COMPARISON: Apple Vision Pro has 12
    outward- facing cameras, 5 sensors, and 6 microphones - technically the most surveillance-capable consumer wearable ever
    sold - yet receives ZERO surveillance/privacy framing from WIRED. Meta Ray-Ban has a single 12MP camera - and receives
    sustained investigative surveillance framing.

    '
  evidence:
    apple_vision_pro:
      reviewer: Lauren Goode (Senior Correspondent)
      tone: empathetic wonder
      article_title: I Cried Inside the Apple Vision Pro (review)
      article_date: '2024-02-23'
      framing_language: '"The view is incredible. It really is." / "I cried" / "Tears welled up in my goggles, pooling at
        the soft rim of the face cushion." / "I was starting to love this thing." - deeply personal first-person emotional
        narrative. Apple Vision Pro has 12 outward-facing cameras, 5 sensors, 6 microphones - technically a far more capable
        surveillance device than Meta''s single 12MP camera. ZERO surveillance/privacy framing in Goode''s review. No mention
        of bystander consent despite the device literally having cameras pointed at everyone around the wearer. Criticism
        = personal isolation and missing human connection ("I also missed the people in the darkened space around me and the
        person on the couch next to me"), not data harvesting or bystander consent.

        '
      hardware_specs: 12 cameras, 5 sensors, 6 microphones (more camera hardware than any Meta wearable)
      privacy_concerns_raised: false
      camera_surveillance_framing: false
      source_urls:
      - https://macdailynews.com/2024/02/23/dont-cry-inside-your-apple-vision-pro/
      - https://techiemag.co.uk/crying-in-apple-vision-pro/
      wired_podcast: 'WIRED Gadget Lab podcast episode "Apple''s Uncanny Valley Pro" (Feb 1, 2024): Julian Chokkattu and Lauren
        Goode discuss Apple Vision Pro. Tone: excited, product-curious, no surveillance framing despite 12 outward-facing
        cameras. Pod description focuses on price, battery, apps - NOT privacy or bystander consent.

        '
      podcast_source_url: https://www.everand.com/podcast/702917430/Apple-s-Uncanny-Valley-Pro
    snap_spectacles:
      reviewer: Lauren Goode
      tone: playful positive
      article_title: 'Snap Spectacles: Are They the Face Camera We''ve Been Waiting For?'
