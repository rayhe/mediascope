        CNN post-acquisition. Paramount denies any CNN editorial commitments. Gerry Cardinale (RedBird
        Capital, Skydance partner): "huge believer" in CNN, praises CEO Mark Thompson.
      - Jun 24, 2026 (Reuters): Paramount prepared to divest its 50% stake in United International
        Pictures (UIP) film distribution JV with Universal Pictures to address EU antitrust concerns.
        Formal divestiture offer to be submitted by June 30, which extends EU Phase I deadline from
        July 7 to July 21 (10 working days extension). Earlier concern about children's TV assets is
        now off the table — no issues on that front. European cinema operators had expressed concerns
        about combined film distribution power. David Ellison targeting July 15 close.
      - REGULATORY STATUS (Jul 9): DOJ cleared (Jun 19). EU Phase I deadline July 22 (extended from
        July 7 via UIP divestiture remedy submission; EC confirmed remedies received Jul 2; Paramount
        "confident" remedies "directly and comprehensively" address EC concerns — per WSJ Jul 1).
        EU approval widely expected.
        UK: Culture Secretary Lisa Nandy issued "minded to intervene" notice Jun 30; Jul 6 deadline
        for company responses has passed. Reuters analysis (Jul 2): UK review likely aimed at
        EXTRACTING COMMITMENTS, not blocking the deal. Possible voluntary concessions: preserving
        independent news provision, UK children's programming, maintaining/expanding Warner's British
        production footprint (including Leavesden studios). Legal advisors say public-interest case
        for blocking appears "limited" but delay threat gives UK government leverage to negotiate
        commitments. If Nandy proceeds to formal intervention, deal goes to Ofcom + CMA review
        (40-day initial, up to 24 weeks full investigation). CMA already running parallel antitrust
        investigation with Aug 7 decision deadline. UK intervention could trigger $627M/quarter
        ticking fee (~$7M/day) for WBD shareholders if deal doesn't close by Sept 30.
        Additional clearances since Jul 1: Kuwait, Austria, Australia (added to 15+ prior clearances).
        SEPARATE EU Foreign Subsidies Regulation investigation (Saudi PIF, Abu Dhabi L'imad, Qatar IA
        backing the bid) — expected unconditional approval. Also cleared by South Africa, China,
        NZ, Ukraine, Serbia, North Macedonia + FDI authorities in Spain, Germany, Slovenia, Belgium,
        Czechia, Italy, France, Romania. Canada: no statutory impediment after Competition Act
        waiting period expired.
        STATE AG ESCALATION (Jul 8-11): Oregon AG Dan Rayfield initially sought expedited court
        order to compel Paramount to produce "Project Warrior" documents — internal code name for
        regulatory clearance strategy — and records of Trump administration lobbying (Reuters, Jul 8).
        Oregon also sought either expedited hearing or injunction preventing close until hearing.
        Paramount initially targeted Jul 16 close; committed not to close before Jul 22
        (per Oregon AG office statement, Jul 9 — Reuters).
        OREGON AG WITHDRAWAL (Jul 11): Oregon DOJ withdrew its court motion to delay the deal.
        Statement: "Paramount made it clear they weren't going to comply" — Oregon withdrew "to
        consider next steps." This removes the most immediate legal obstacle to closing, though
        multistate AG antitrust lawsuit still expected. CNN reported (Jul 8-9) multistate suit
        "likely to be filed next week." States investigating DOJ clearance process — reports that
        higher DOJ officials overrode staff attorneys initially inclined to challenge the merger.
        CA AG Rob Bonta (Jun 28): "red flags in the air everywhere." Late September close now
        considered more realistic timeline per NBC/industry analysts. Paramount executives have
        argued an antitrust suit by the states would be meritless.
        POLITICAL PRESSURE ON CA AG (Jul 11): Rep. Darrell Issa (R-CA) publicly warned CA AG
        Bonta against blocking the deal, framing state intervention as overreach (Reuters, Jul 11).
        PARAMOUNT CA EXODUS THREAT: Paramount reportedly weighing relocation of California
        headquarters if AG Bonta files suit — leverage play to dissuade state-level challenge
        (WSJ, Jul 9-10). Combined Paramount-WBD entity would carry ~$80B in debt (WSJ/Times),
        a figure cited by state AGs as a risk to content investment and local employment.
      - 12-STATE AG LAWSUIT FILED (Jul 13, 2026): California AG Rob Bonta led coalition of 12
        Democratic AGs filing antitrust lawsuit in N.D. Cal. to block the $110B Paramount-WBD merger.
        Alleges violation of Section 7 of the Clayton Act. Key claims: combined entity would control
        ~27% of wide-release theatrical films and ~27% of basic cable channels; only 3 distributors
        would control 75% of wide-release films; merger would combine 2 of Hollywood's 5 major film
        distributors AND 2 of 5 major basic cable channel owners. Coalition states asked companies
        not to close before judicial process concludes; will seek TRO if refused.
        CRITICALLY: DOJ had CLEARED the deal (Jun 19) after 8-month review and 2M+ documents,
        concluding deal would INCREASE competition. State AGs acting independently under separate
        authority. All 12 filing AGs are Democrats — creating a political dimension.
        Minnesota AG Keith Ellison joined coalition same day (Fox9, Jul 13). Rep. Darrell Issa
        (R-CA) had already warned Bonta against filing (Jul 11 letter to Newsom+Bonta).
        MARKET REACTION: WBD stock ROSE 1.88% to $27.09 on filing day (Barron's: WBD +3.8% to
        $27.61 intraday). Paramount PSKY also rose 2.5%. Market appears to view state AG challenge
        as unlikely to succeed given DOJ clearance and 24+ international regulatory approvals.
        Source: Fox9, Washington Examiner, Daily Caller, Barron's (all Jul 13, 2026).
      - WGA LAWSUIT FILED (Jul 14, 2026): Writers Guild of America (18,000 members) filed SEPARATE
        antitrust lawsuit in N.D. Cal. (same court as state AGs) to block the merger. WGA alleges
        combined Paramount-WBD would be the LARGEST employer of film and television writers,
        enabling downward pressure on wages and working conditions. WGA East President Tom Fontana:
        "will not stand idly by as Paramount attempts to violate our country's antitrust laws."
        Paramount rebuttal: pledged 30+ theatrical films/year, argued deal "will have the scale and
        resources to reverse current trends and expand opportunities for writers." (WSJ, Jul 14).
        DUAL LAWSUIT DYNAMICS: Two independent lawsuits now active in same court — state AGs
        (Clayton Act §7) + labor union (antitrust + employment impact). Different theories could
        compound regulatory risk even if each alone is insufficient.
      - TRO HEARING FRIDAY JUL 18: U.S. District Judge P. Casey Pitts will hear emergency motion
        from AG Bonta and 12 states to temporarily halt the merger while antitrust lawsuit proceeds.
        Hearing: 10 AM PT / 1 PM ET. Paramount must file opposition by Thursday noon Jul 17.
        States seeking ruling before July 22 (Paramount's earliest possible close date).
        If TRO granted: deal closure delayed pending full litigation. If denied: Paramount could
        attempt to close as early as Jul 22, though still faces ongoing litigation risk.
      - FCC COMMENTARY (Jul 14): FCC Chairman Brendan Carr reportedly questioned the antitrust basis
        for the state AG lawsuit, also flagging Disney under "heightened scrutiny." Federal-state
        tension emerging: DOJ cleared the deal; FCC chair skeptical of state challenge; but 12 state
        AGs + WGA proceeding regardless. Creates political dimension (all 12 filing AGs are Democrats;
        Carr is a Trump appointee).
      - CA AG BONTA ESCALATION (Jul 14): Bonta called Paramount's threat to move HQ out of California
        "blackmail" on Matthew Belloni's "The Town" podcast. Characterized merger as "simply an illegal
        merger." Cited three markets: wide-release theatrical films distribution, blockbuster distribution,
        and cable channel licensing. Paramount still says deal to close by end of September.
        (Fox Business, Bleeding Cool, Reuters Breakingviews — all Jul 14).
      - REUTERS BREAKINGVIEWS ANALYSIS (Jul 14): Jennifer Saba's column characterizes the state lawsuit
        as heading for "tragic ending" — argues case centers on theater and cable industries "that are
        dying no matter what happens." Suggests structural decline of the relevant markets weakens
        the states' competition argument. This framing itself is analytically significant for MediaScope:
        it exemplifies how editorial voice can shape perceptions of legal merit.
        ADVANCE IMPLICATIONS: If the deal closes at $30/share, Advance realizes ~$2.94B from
        remaining ~98M shares. If it fails, WBD trades ~$27 at market. The $7B termination fee
        (paid by Paramount if deal fails due to regulatory matters) provides downside protection
        for WBD shareholders. Either way, Advance's WBD position is moving toward resolution.
      - DEAL PROTECTIONS: If transaction does not close by Sept 30, 2026, WBD shareholders receive
        $0.25/share "ticking fee" per quarter (~$627.5M/quarter per Morningstar estimate based on
        ~192M WBD shares × $30 × 0.25/4 + overhead). If deal fails due to regulatory matters,
        Paramount pays WBD a $7B termination fee. Options market activity (Barchart, Jun 26): bull
        call spreads suggest ~30% probability of close before July 24.
      IF PARAMOUNT CLOSES AT $30/SHARE: Advance realizes ~$2.94B from remaining ~98M shares + $1.1B already
      realized from June 2024 sale = ~$4.04B total from WBD investment. This would be Advance's largest
      single liquidity event since the Reddit IPO and could significantly alter the family office's capital
      allocation and media strategy.
