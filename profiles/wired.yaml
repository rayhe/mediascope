    \ lawsuits now active in same court - state AGs\n  (Clayton Act §7) + labor union (antitrust + employment impact). Different\
    \ theories could\n  compound regulatory risk even if each alone is insufficient.\n- TRO HEARING FRIDAY JUL 18: U.S. District\
    \ Judge P. Casey Pitts will hear emergency motion\n  from AG Bonta and 12 states to temporarily halt the merger while\
    \ antitrust lawsuit proceeds.\n  Hearing: 10 AM PT / 1 PM ET. Paramount must file opposition by Thursday noon Jul 17.\n\
