        - "Meta products ship at scale (10M+ glasses units), attracting more product scrutiny"
        - "Meta has deeper privacy controversy history (Cambridge Analytica, $7B+ fines)"
        - "Knibbs does cover Google and Anthropic critically — not exclusively targeting Meta"
      structural_significance: >
        The Dual Watchdog Paradox is structurally DEEPER than a standard beat reporter's
        bias because: (1) the copyright tracker IS the industry baseline — it cannot be
        counterbalanced by other reporters the way an opinion can; (2) the tracker is cited
        in court filings and legislative analyses without any disclosure of Condé Nast's
        commercial AI relationships; (3) Advance's Reddit investment (~$8B, 65.2% voting)
        adds a second paradox layer where the parent company profits from AI training data
        licensing while its subsidiary's journalist tracks AI training data disputes.
