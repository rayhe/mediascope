      Source: https://www.stocktitan.net/sec-filings/RDDT/def-14a-reddit-inc-definitive-proxy-statement-95d70b92f5ff.html
      Source: https://www.wallstreetzen.com/stocks/us/nyse/rddt/ownership
      Total outstanding shares as of March 31, 2026: 141,867,916 Class A + 50,543,398 Class B
