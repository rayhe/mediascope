  event: 'Approximately 20 Condé Nast Union (NewsGuild/CWA) members confronted Chief People Officer Stan Duncan at Condé Nast
    offices over Teen Vogue fold and layoffs. Heated exchange during contract bargaining session.

    '
  source_url: https://www.thewrap.com/conde-nast-fired-four-union-members-settlement/
- date: '2025-11-06'
  event: 'FIRED FOUR: Condé Nast fires four union members the day after the confrontation with CPO Duncan: Jake Lahut (Wired
    senior politics reporter), Jasper Lo (New Yorker fact-checker), Alma Avalle (Bon Appétit), Ben Dewey (CNE video). Additionally,
    five other union members suspended. NY AG Letitia James publicly threatened legal action, calling the firings "union-busting."
    National attention from labor press and media reporters.

    '
