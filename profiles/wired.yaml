    perplexity_coverage_arc:
      mechanism_id_ref: 58
      overview: >
        NATURAL EXPERIMENT — COVERAGE TONE TRACKS DEAL STATUS (Mechanism #58).
        In Jul 2024, WIRED published adversarial investigations of Perplexity's content
        scraping and Condé Nast sent a cease-and-desist letter. By Oct 2025, Lynch named
        Perplexity alongside OpenAI as an AI licensing partner (Adweek, May 2026). The
        coverage shifted from adversarial to neutral with deal status. Meta, which never
        scraped WIRED content without permission, receives consistently adversarial
        coverage with $0 in CN deals. This is the cleanest available natural experiment:
        same publisher, same company, coverage tone correlating to deal status.
      timeline:
        - date: "2024-06"
          event: "WIRED publishes adversarial Perplexity scraping investigation"
          tone: adversarial
        - date: "2024-07"
          event: "Condé Nast sends cease-and-desist to Perplexity"
          tone: adversarial
        - date: "2025-10"
          event: "Lynch names Perplexity as AI licensing partner (confirmed Adweek May 2026)"
          tone: neutral
