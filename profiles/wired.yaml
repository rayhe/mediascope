    insider_selling_context: >
      Reddit insiders (excluding Advance) sold 223,000 shares ($36.9M) in last 90 days
      (as of Jul 1, 2026). ALL via pre-arranged Rule 10b5-1 trading plans:
      CEO Steve Huffman: sold 18,000 shares Jun 15 at $178.26 ($3.21M). Retained 373,814 shares (-4.59%).
      COO Jennifer Wong: sold 39,166 shares Jun 16 at $176.94 ($6.93M). Retained 1,050,339 shares (-3.59%).
      CTO Christopher Slowe: sold 15,500 shares Apr 8 at $150.67 ($2.34M). Retained 38,413 shares (-28.75%).
      Corporate insiders own 28.48% of stock.
      ANALYTICAL NOTE: Insider selling is systematic (10b5-1 plans), not panic selling.
      But the concentration of C-suite sales in Jun 15-16 (CEO + COO on consecutive days,
      totaling $10.1M) coincides with Advance's margin loan activity (reported Jun 12).
