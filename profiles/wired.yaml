    \ review likely aimed at\n  EXTRACTING COMMITMENTS, not blocking the deal. Possible voluntary concessions: preserving\n\
    \  independent news provision, UK children's programming, maintaining/expanding Warner's British\n  production footprint\
    \ (including Leavesden studios). Legal advisors say public-interest case\n  for blocking appears \"limited\" but delay\
    \ threat gives UK government leverage to negotiate\n  commitments. If Nandy proceeds to formal intervention, deal goes\
