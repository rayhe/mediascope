    marginal_revenue_analysis:
      mechanism_id_ref: 58
      overview: >
        MECHANISM #58: MARGINAL REVENUE SIGNIFICANCE. While AI licensing is estimated at
        only 0.7-2.25% of CN's ~$2B total revenue, its MARGINAL importance is disproportionate.
        Lynch explicitly named AI licensing as a strategic revenue pillar (Oct 2025, Adweek),
        replacing declining advertising. If advertising declines ~$50M/yr on a ~$1B base,
        AI licensing at $14-45M/yr replaces 28-90% of the decline. The Apr 2026 portfolio
        pruning (Self, Glamour intl, Wired Italy) concentrates the remaining portfolio on
        higher-margin businesses including AI licensing. Updated financial data (Adweek May 2026):
        events revenue up 40% (2025), digital subscriptions up 29% (2025), subscription
        total up 10%, commerce up 13%. Advertising "no longer expected to be a growth engine."
