  meta_contrast_update: 'The CRO career migration section (mechanism #208) states "Meta has ZERO
    personnel career-migration links to Condé Nast." This is no longer true. As of June 22, 2026,
    Condé Nast France has a senior executive (CBO) who came directly from Meta. However, the flow
    direction is INVERTED: this is Meta → Publisher (competitive intelligence export) rather than
    Publisher → Meta (editorial defection). The net incentive effect is AMBIGUOUS: Gressier may
    bring personal goodwill toward Meta OR may leverage Meta insider knowledge to compete more
    effectively for luxury ad budgets.'
