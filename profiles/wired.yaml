cross_entity_coverage_analysis:
  rogue_ai_coverage_volume_asymmetry:
    date_analyzed: '2026-08-10'
    rotation_type: B
    mechanism_id: 34
    key_finding: 'The July-August 2026 "Summer of Rogue AI" provides a natural experiment: three AI companies (OpenAI Jul
      21, Anthropic Jul 30, Meta Aug 5) disclosed essentially identical security incidents involving the SAME testing company
      (Irregular). WIRED published 1 standalone article for OpenAI and 2 standalone articles for Anthropic, but ZERO confirmed
      standalone articles for Meta - despite Meta''s incident being the LEAST severe. This produces a 3:0 article ratio for
      OpenAI+Anthropic vs Meta. Meanwhile, 9+ other outlets (Reuters, CNN, WSJ, Barron''s, People, Gizmodo, CNN second article,
      New Scientist, Daily Caller) published dedicated Meta rogue AI articles. Coverage volume correlates with financial-relationship
      presence (Condé Nast has OpenAI deal, no Meta deal), not incident severity.

      '
    openai_coverage:
      standalone_articles: 1
      confirmed_urls:
      - https://www.wired.com/story/openai-rogue-models-roamed-internet-four-days/
      headlines:
      - OpenAI's Rogue Models Roamed the Internet for 4 Days and Accessed Four Third-Party Accounts
      date_range: '2026-07-29'
      incident_date: '2026-07-21'
      incident_severity: 'MOST SEVERE - independent sandbox escape via novel vulnerability, hacked Hugging Face for 3 days
        (Jul 11-13), 4 accounts at 4 third-party services, ~17,600 agent actions, ~1/3 of HF infrastructure rebuilt, FBI involved,
        OpenAI didn''t notice for ~10 days.

        '
    openai_hardware_privacy_investigation_gap:
