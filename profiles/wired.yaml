chokkattu_temporal_framing_oscillation:
  mechanism_id: 30
  finding: Genre-Determined Framing Direction (Temporal Oscillation)
  date_analyzed: '2026-08-10'
  journalist: Julian Chokkattu
  summary: 'Within a single 30-day window (Jun 3 - Jul 2, 2026), Chokkattu published

    content about Meta smart glasses in THREE genres with dramatically different

    framing: adversarial podcast (-0.85/-0.90 tone), balanced product announcement

    (-0.05 tone), adversarial editorial analysis (-0.65 tone). The same journalist

    oscillates between "mass surveillance" and neutral product features based

    entirely on genre. This matches James Pero''s "Editorial Direction Override"

    (Mechanism #31) at Gizmodo - two publications, different ownership,

    same pattern.

    '
  timeline:
  - date: '2026-06-03'
    genre: narrative_podcast
    title: Prize on the Eyes
    platform: Business Wars (Wondery)
    subject: Meta
    tone_score: -0.85
    key_language: a tool for mass surveillance
  - date: '2026-06-10'
    genre: narrative_podcast
    title: I'm a Creep
    platform: Business Wars (Wondery)
    subject: Meta
    tone_score: -0.9
    key_language: mandatory data-sharing, worker exploitation, federal agents using glasses illegally
  - date: '2026-06-11'
    genre: narrative_podcast
    title: Google's Return
    platform: Business Wars (Wondery)
    subject: Google
    tone_score: 0.05
    key_language: whether Google can give Meta a run for its money
  - date: '2026-06-23'
    genre: product_announcement
    title: Meta Starfire/Adventurer/Fury launch
    platform: WIRED
    subject: Meta
    tone_score: -0.05
    key_language: gemstone, nose pad, AI voice, same camera/microphones/chatbot as Ray-Bans
    source_url: https://biztoc.com/x/65c250c5f0d223b2
  - date: '2026-07-02'
    genre: editorial_analysis
    title: Meta Is Charging a Subscription for Smart Glasses Features
    platform: WIRED
    subject: Meta
    tone_score: -0.65
    key_language: extracting value, monetizing customers
  cross_publication_convergence: 'Same pattern confirmed at Gizmodo (Keleops AG, Swiss ownership) via James Pero

    (Mechanism #31): product reviews balanced, editorial/analysis adversarial for Meta.

    Two publications, different ownership structures (Condé Nast / Advance vs Keleops AG),

    same genre-determines-framing pattern - suggests industry-wide editorial culture,

    not publisher-specific directives.

    '
  test_file: tests/test_chokkattu_temporal_framing_oscillation_aug10.py
  test_count: 34
  legitimate_factors:
  - Product announcements are inherently more neutral than analysis pieces
  - Podcast format encourages more opinionated takes
  - The subscription article (Jul 2) addresses a genuinely controversial pricing change
  - Editorial analysis is SUPPOSED to be more critical than product coverage
  - Meta has more legacy privacy controversies than Google or Snap
  counterpoints:
  - The genre excuse explains the DIRECTION but not the ENTITY selectivity - Google/Snap editorial analysis doesn't use surveillance
    framing either
  - The podcast series is TITLED after Meta, centering it as the surveillance threat while Google gets 'Return'
  - If genre determines framing, editorial analysis of Snap's $2,195 glasses should also use 'extraction' language - it doesn't
