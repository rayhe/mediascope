  description: "SUCCESSION EVENT: Donald Edward Newhouse died May 26, 2026 (aged 96, lymphoma) at his estate in Lambertville,\
    \ NJ. Forbes estimated his net worth at $15.4B (May 2026). He was the last surviving second-generation Newhouse - his\
    \ brother Si Newhouse Jr. died in 2017 of frontotemporal dementia. Third generation now fully in control: - Steven O.\
    \ Newhouse (b. ~1957): Chairman & Co-President of Advance Publications. Serves on Reddit board\n  as Advance Designee.\
    \ Resigned from WBD board March 29, 2024.\n- Michael Andrew Newhouse: Advance board member. AP (Associated Press) board\
    \ member since 2017.\n  Syracuse University trustee.\n- Samuel I. Newhouse III: Advance board member. Advance Long-Term\
    \ Trust trustee. - Katherine Irene Newhouse: Donald's daughter. Family office serves 35 adult households and 100+ individual\
    \ family members (per LinkedIn profile of former CIO, Institutional Investor reporting). CIO: Bei Saville (hired from\
    \ Northern Trust Asset Management's OCIO division). Samuel I. Newhouse Foundation: $132M+ in investments (as of Oct 2016).\
    \ Donald's $75M donation to Syracuse University's S.I. Newhouse School of Public Communications (Jan 2020). $20M donation\
    \ to Association for Frontotemporal Degeneration (Mar 2021). Forbes family wealth estimate: $25B+ (historically varied;\
    \ $18.5B in 2016, $26B per Bloomberg in 2024). LEGAL OWNERSHIP STRUCTURE (per Charter Communications DEF 14A, Reddit 2025\
    \ proxy, SEC filings): Newhouse Family Holdings, L.P. (\"NFH\") owns 100% of Advance Publications, Inc. (\"API\"). Advance\
    \ Long-Term Trust Management Trust is the SOLE GENERAL PARTNER of NFH - meaning this trust makes all control decisions\
    \ for the entire Advance empire. Trustees: Samuel I. Newhouse III, Steven O. Newhouse, Michael A. Newhouse, Victor F.\
    \ Ganzi, and Peter C. Gould. These 5 individuals collectively control the trust that controls the LP that controls API\
    \ that controls Condé Nast, Reddit stake, Charter stake, WBD stake, and all other Advance assets. NOTE: The trust structure\
    \ means Donald's death does NOT trigger any change in the legal GP or trustees - succession was already completed at the\
    \ trust level. No probate-driven disruption to corporate control. SUCCESSION ANALYSIS: Donald was president of Advance\
    \ Publications (per Wikipedia, AP obituary) but the Advance Long-Term Trust already had third-gen trustees in place. His\
    \ death removes the final patriarchal oversight but does NOT change the trust's composition. Steven O. Newhouse has been\
    \ the operational leader since at least 2017 (when Si died). The Reddit credit facility (reported 17 days after Donald's\
    \ death) and the accelerated monetization of WBD shares suggest the third generation is more financially active than their\
    \ father's generation.\n"
