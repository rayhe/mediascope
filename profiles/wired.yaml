  finding_summary_detailed: 'Samsung Galaxy Glasses announced Jul 22 2026 at Galaxy Unpacked London (TechTimes, Samsung Newsroom) - direct Meta Ray-Ban Gen 2 competitor: same $379-499 price bracket (TechTimes: directly matching Meta Ray-Ban Gen 2), same 50g weight (Meta 49g), same Qualcomm Snapdragon AR1 Gen 1 chip, BETTER camera (12MP Sony IMX681 autofocus vs Meta fixed-focus - autofocus enables sharper bystander capture, strictly higher privacy risk under WIRED surveillance logic), Android XR + Gemini (vs Meta AI), Gentle Monster partnership (also Google Android XR partner), iOS compatible (Google I/O 2026 confirmed), prescription integration, directional speakers, photochromic transition lenses, 155mAh battery (leaks), Wi-Fi/Bluetooth 5.3. WIRED Gear desk (Julian Chokkattu Senior Editor Gear 7+ years 3,627+ articles primary Meta hardware reviewer + Boone Ashworth) published 0 standalone Samsung Galaxy Glasses articles Jul 22-Aug 28 (38-day window) while publishing 3+ Meta articles same window with consumer-hostile extraction framing (Jul 2 subscription piece: extracting value, monetizing customers, scare quotes expanded access). Samsung launch covered by Android Authority, TechTimes, MacRumors, SamMobile, MakeUseOf, Samsung Newsroom (James Choi interview), SiliconANGLE - 7 other publications, zero WIRED. Price-parity calculation: Samsung $379 entry identical to Meta $379 (0% delta), Samsung $499 high end 31.7% more than Meta $379 but still 37.5-52.6% cheaper than Meta Display $799 - yet Meta Display receives hostile extraction framing while Samsung receives no coverage. Camera capability privacy inversion: Samsung autofocus 12MP = higher privacy risk than Meta fixed-focus 12MP, yet WIRED surveillance vocabulary 6 terms for Meta (mass surveillance, Creep, wiretapping, biometric, dormant surveillance, pervert) vs 0 terms for Samsung. Chokkattu 15-day swing extended to 64-day 3-competitor pattern: May 19 Google playful (Nano Banana bananas!) → Jun 3 Meta mass surveillance (15-day swing) → Jul 22 Samsung silence (49-day post-Meta) - same journalist, functionally identical hardware, manufacturer-dependent framing across 70 days. Asymmetry scorer synthetic -0.654 p<0.001 d=-10.8 huge (requires observed validation). Confounder-adjusted 0.434 moderate-to-high reflects legitimate unannounced vs shipped difference (STRONG) but does not explain autofocus privacy inversion or 0-article selection silence when WIRED investigated Meta DORMANT code. Google Android XR context: WIRED 5-person team (Goode+Chokkattu+Ashworth+Levy+Rogers) covered Google camera glasses with playful enthusiastic framing for AI photo manipulation (deepfake-adjacent, strictly more risky than Meta single camera) - zero surveillance language, demonstrating lane assignment extends beyond Apple/Snap to Google/Samsung (EVERY competitor → product review, Meta alone → investigative alarm). Financial predictor: Condé Nast $0 from Meta, $5-10M/yr from OpenAI, Google ad revenue dependency, Samsung advertiser, CRO ex-Snap - money direction predicts sympathy direction, confirmed by 3-competitor extension.'
