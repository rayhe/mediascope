    Steven Levy is WIRED's institutional voice — longest-tenured journalist (original
    contributing writer from 1993 founding), most CEO access (Gates, Bezos, Jobs, Page,
    Brin, Zuckerberg), author of books on Google (In the Plex, 2011) and Facebook
    (Facebook: The Inside Story, 2020). His editorial posture toward subjects IS
    WIRED's editorial posture. Founded Backchannel on Medium (2014), acquired by
