  significance: >
    This is the cleanest journalist-level natural experiment in the MediaScope dataset.
    The SAME reporter, in the SAME 8-day window (Jun 3-10), applies "mass surveillance"
    framing to Meta's 1-camera glasses (on a podcast) while applying "partnership"
    framing to Apple's fundamental privacy architecture change (in a written article).
    The temporal proximity eliminates confounders like journalist mood, news cycle
    pressure, or editorial direction changes — it was all the same week.

    Combined with Mechanism #44 (publication-level PCC coverage asymmetry), this proves
    the pattern operates at both institutional AND individual levels: it's not just
    "WIRED as an institution" that applies differential standards — it's the individual
    reporter making differential editorial choices about identical privacy-relevant
    topics for different companies.

