      date_analyzed: "2026-08-09"
      summary: >
        Brian Barrett, as WIRED's Executive Editor for News, produces Uncanny Valley podcast
        episode headlines that systematically apply different emotional registers to Meta vs
        competitors covering the SAME underlying dynamics. The most revealing data point is
        the May 21, 2026 headline: "Meta Is in Crisis, Google Search's Makeover, and AI Gets
        Booed by Graduates" — where the SAME headline applies existential crisis language to
        Meta and positive transformation language to Google. Both companies were undergoing
        aggressive AI investment, workforce restructuring, and strategic pivots in May 2026.
        Barrett chose "crisis" for Meta and "makeover" for Google.

      key_finding: >
        THE CRISIS/MAKEOVER HEADLINE PARADOX: Barrett's editorial role means his framing
        choices signal direction to the entire WIRED newsroom. When the Executive Editor for
        News uses "crisis" for Meta and "makeover" for Google in a single headline, it
        establishes the editorial register that staff writers follow. This is not individual
        bias — it is structural editorial direction.

