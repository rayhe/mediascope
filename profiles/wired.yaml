    \ typical SaaS multiples. Revenue likely growing substantially since 2023 as AI detection became a must-have for universities.\
    \ The $1.75B price was the largest edtech acquisition of 2019 and among the largest in the sector's history (EdSurge noted\
    \ it exceeded total VC raised by all edtech startups the prior year).\n"
