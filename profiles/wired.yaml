  - https://techcrunch.com/2026/06/03/publishers-will-be-able-to-opt-out-of-ai-search-thanks-to-new-regulation/
editorial_leadership:
- name: Katie Drummond
  title: Global Editorial Director
  start_date: '2023-08-28'
  editorial_stance: 'Explicitly adversarial toward Big Tech''s political alignment. Self-described philosophy: ''Right and
    wrong is a big one for me. If you do wrong, I want to find out, and then I want the world to know.'' Described tech industry
    as engaging in ''increasingly grotesque displays of submission'' to political power. Career arc (Gizmodo EIC → Vice SVP
    → Wired GED) represents an adversarial-journalism pipeline. Created first-ever Wired politics team Nov 2023. DOGE coverage
    drove 62,500 new US subs in 2 weeks (Feb 2025), won Sidney Hillman Prize. ''Story Zero'' newsroom ethos - break stories
    that set news agendas globally. Launched Uncanny Valley podcast, KQED radio partnership. Freedom of the Press Foundation
    board (2024). Reports to Anna Wintour.'
- name: Leah Feiger
  title: Director of Politics & Science
  start_date: '2023-11-13'
  editorial_stance: First-ever Wired politics editor. Built politics team from scratch under Drummond. Recruited from Vice
    News where she overlapped with Drummond. Hosts WIRED Politics Lab podcast. Drove DOGE coverage strategy. Promoted from
    'senior politics editor' to 'Director of Politics & Science' by 2025.
- name: Brian Barrett
  title: Executive Editor, News
  editorial_stance: 10+ year Wired veteran. Oversees news desk. Covers DOGE, government tech. Co-hosts Uncanny Valley podcast.
- name: Zoë Schiffer
  title: Director of Business & Industry
  editorial_stance: Joined from Platformer/The Verge 2024. Tech labor specialist. Co-hosts Uncanny Valley podcast.
- name: Meg Marco
  title: Executive Editor of News
  editorial_stance: Leah Feiger's politics team reports to her. Oversees news operation.
