      least_severe: Meta
      coverage_volume_ranking: OpenAI (1 article) + Anthropic (2 articles) = 3 total; Meta = 0
      inversion_note: 'Coverage volume is inversely correlated with incident severity at WIRED: the most severe incident (OpenAI)
        and moderate incident (Anthropic) both received standalone articles, while the least severe incident (Meta) received
        zero standalone coverage. If editorial decisions were severity-driven, Meta''s incident would warrant at least brief
        standalone coverage, given that 9+ other outlets found it newsworthy enough for dedicated articles. The 3:0 ratio
        suggests editorial selection criteria beyond severity alone.

        '
    financial_correlation:
      conde_nast_openai_relationship: 'Condé Nast (WIRED parent) has a multiyear AI content licensing deal with OpenAI, announced
        August 2024. OpenAI has 13+ publisher content deals total (AP, News Corp, FT, Condé Nast, Axel Springer, Le Monde,
        etc.).

        '
      meta_deal_status: 'No disclosed content licensing deal between Condé Nast and Meta. Meta has deals with News Corp and
        Reuters but not with Condé Nast''s portfolio.

        '
      correlation_direction: 'Coverage volume aligns with financial-deal presence: entities with Condé Nast licensing deals
        (OpenAI) receive standalone coverage; entities without deals (Meta) do not, despite the incident being covered by
        9+ other outlets. Correlation is not causation, but the direction is consistent with the broader MediaScope financial-coverage
        hypothesis.

        '
    cross_mechanism_references:
      will_knight_cross_entity: 'Will Knight cross-entity test documents ZERO dedicated Meta AI articles from Knight vs 7+
        OpenAI, 5+ DeepMind, 3+ Anthropic. Mechanism #34 confirms this institutional pattern extends to security/safety coverage,
        not just AI research.

        '
      guardian_mechanism_29: 'Guardian Mechanism #29 (Dan Milmo) found the same pattern: Milmo published 4 standalone OpenAI
        rogue AI articles but 0 standalone Meta rogue AI articles. Different publication, same coverage-volume asymmetry on
        the same event category.

        '
      gizmodo_mechanism_31: 'Gizmodo Mechanism #31 found the INVERSE pattern: Gizmodo published a dedicated Meta rogue AI
        framing article but applied softer framing to OpenAI. Gizmodo has zero AI licensing deals with any company - supporting
        the financial-relationship hypothesis by showing opposite editorial behavior from zero-deal publications.

        '
    legitimate_factors:
    - OpenAI's incident was genuinely more severe - independent sandbox escape, multi-day compromise, FBI involvement, infrastructure
      rebuilt
    - Anthropic's was next in severity - 3 companies breached since April, credential theft confirmed
    - Meta's was least severe - Irregular confirmed 'same evaluation-environment issue,' characterized as 'not a sandbox escape'
    - By Aug 5 (Meta disclosure), the 'rogue AI' story category may have reached editorial saturation - third disclosure in
