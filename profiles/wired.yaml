    (ex-Snap). This creates a REVERSE personnel flow: a senior Meta executive joining a publisher
    that covers Meta adversarially. Gressier managed strategic partnerships and growth for luxury
    brands at Meta - the SAME luxury brands that advertise in Vogue France, GQ, Vanity Fair, and AD.

    FINANCIAL INCENTIVE IMPLICATIONS:
    (1) COMPETITIVE INTELLIGENCE: Gressier knows Meta''s luxury advertising pipeline, pricing models,
    client relationships, and growth strategy. She can now deploy this knowledge to compete against
    her former employer for luxury ad budgets.
    (2) REVENUE ARCHITECTURE: As CBO France, Gressier controls revenue for Vogue France, GQ, Vanity
    Fair, and AD. These are some of Condé Nast''s most lucrative luxury advertising properties. Her
    role is to ACCELERATE revenue growth - potentially by redirecting luxury budgets FROM Meta TO
    Condé Nast properties.
    (3) REPORTING CHAIN: Gressier → Herbst-Brady (CRO, ex-Snap) → Roger Lynch (CEO). The revenue
    chain from France luxury to global CRO creates an institutional path where Meta-competitive
    intelligence informs global revenue strategy.
    (4) PERSONNEL PARADOX: This is the FIRST documented case of a senior Meta executive joining Condé
    Nast. Prior personnel flows were all FROM publishers TO tech companies (journalists joining PR).
    The reverse flow could either (a) create personal goodwill toward Meta that softens coverage, OR
    (b) provide insider knowledge that sharpens competitive positioning against Meta.

    GLOBAL FASHION & LUXURY AGENDA: Gressier is explicitly tasked with contributing to Condé Nast''s
    Global Fashion & Luxury agenda - strengthening connectivity between France and broader luxury
    partnerships. This means her Meta-origin knowledge influences not just French operations but
    the entire Condé Nast luxury advertising strategy globally.'
