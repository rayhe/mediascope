# ===================================================================
# Mechanism #45: Ashworth WWDC PCC Privacy Framing Asymmetry
# Type B — Journalist Cross-Entity Tracking (Aug 11 2026)
# ===================================================================
ashworth_wwdc_pcc_privacy_framing_asymmetry:
  mechanism_id: 45
  mechanism_name: "Ashworth WWDC PCC Privacy Framing Asymmetry"
  finding_type: "journalist_cross_entity_privacy_framing"
  analysis_date: "2026-08-11"
  journalist: "Boone Ashworth"
  publication: "WIRED"
  extends_mechanisms:
    - 44  # WIRED Apple PCC-to-Google-Cloud Privacy Pivot Coverage Selection Asymmetry
    - 14  # Barrett Crisis/Makeover Headline Paradox
  finding_summary: >
    Boone Ashworth co-hosted 3 episodes of the Business Wars podcast "Meta and the
    Battle for Smart Glasses" (Jun 3-11, 2026) where Meta's glasses were called "a tool
    for mass surveillance" (Ep 1, Jun 3) and "I'm a Creep" (Ep 2, Jun 10). Between
    those two episodes, on Jun 8, Ashworth wrote WIRED's "Everything Apple Announced
    at WWDC 2026" — Apple's announcement that Private Cloud Compute would expand to
    Google Cloud with Nvidia GPUs, a fundamental shift from Apple-controlled privacy
    hardware to third-party data centers. Ashworth framed this as "some inkling on how
    an AI partnership with Google has come to power Apple's products." Zero privacy
    scrutiny. Zero investigative language. Zero "surveillance" vocabulary.

    This is a journalist-level confirmation of Mechanism #44: the same individual
    reporter who applies "mass surveillance" language to Meta's 1-camera glasses
    applies "partnership" language to Apple's fundamental privacy architecture change
    in the same 8-day window.

  timeline:
    - date: "2026-06-03"
      event: "Business Wars Ep 1: 'Prize on the Eyes'"
      subject: "Meta"
      role: "podcast co-host"
      framing: "Meta has created something else: a tool for mass surveillance"
      tone: -0.85
      privacy_alarm_terms: 1

    - date: "2026-06-08"
      event: "WIRED article: 'Everything Apple Announced at WWDC 2026'"
      subject: "Apple"
      role: "author"
      framing: "some inkling on how an AI partnership with Google has come to power Apple's products"
      tone: 0.10
      privacy_alarm_terms: 0
      pcc_google_cloud_mentioned: true
      pcc_privacy_concerns_raised: false

    - date: "2026-06-10"
      event: "Business Wars Ep 2: 'I'm a Creep'"
      subject: "Meta"
      role: "podcast co-host"
      framing: "mandatory data-sharing, worker exploitation, and federal agents using the glasses illegally"
      tone: -0.90
      privacy_alarm_terms: 3

  pcc_privacy_shift:
    description: >
      Apple announced at WWDC 2026 (Jun 8-9) that Private Cloud Compute would
      expand beyond Apple-owned data centers for the first time. AI workloads
      would run on Google Cloud systems powered by Nvidia Blackwell GPUs,
      Intel CPUs with TDX, and Google Titan chips. This represents a
      fundamental architectural shift from Apple's original PCC promise of
      processing exclusively on Apple Silicon in Apple-controlled facilities.
    privacy_implications:
      - "User data now processed on hardware Apple does not own"
      - "Supply chain now includes Google, Nvidia, and Intel components"
      - "Trust model shifts from hardware-enforced to contractual/cryptographic"
      - "Attack surface expands from Apple-only to multi-vendor"
    ashworth_coverage_of_shift: >
      Ashworth's WWDC roundup subtitle: "Updates include a new souped-up Siri,
      lots of iOS enhancements, and some inkling on how an AI partnership with
      Google has come to power Apple's products." No mention of privacy
      concerns, no investigative framing, no comparison to Apple's prior
      self-controlled architecture. The word "surveillance" appears zero times.
