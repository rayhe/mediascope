    \ targeted Jul 16 close; committed not to close before Jul 22\n  (per Oregon AG office statement, Jul 9 - Reuters).\n\
    \  OREGON AG WITHDRAWAL (Jul 11): Oregon DOJ withdrew its court motion to delay the deal.\n  Statement: \"Paramount made\
    \ it clear they weren't going to comply\" - Oregon withdrew \"to\n  consider next steps.\" This removes the most immediate\
    \ legal obstacle to closing, though\n  multistate AG antitrust lawsuit still expected. CNN reported (Jul 8-9) multistate\
    \ suit\n  \"likely to be filed next week.\" States investigating DOJ clearance process - reports that\n  higher DOJ officials\
    \ overrode staff attorneys initially inclined to challenge the merger.\n  CA AG Rob Bonta (Jun 28): \"red flags in the\
    \ air everywhere.\" Late September close now\n  considered more realistic timeline per NBC/industry analysts. Paramount\
    \ executives have\n  argued an antitrust suit by the states would be meritless.\n  POLITICAL PRESSURE ON CA AG (Jul 11):\
    \ Rep. Darrell Issa (R-CA) publicly warned CA AG\n  Bonta against blocking the deal, framing state intervention as overreach\
    \ (Reuters, Jul 11).\n  PARAMOUNT CA EXODUS THREAT: Paramount reportedly weighing relocation of California\n  headquarters\
    \ if AG Bonta files suit - leverage play to dissuade state-level challenge\n  (WSJ, Jul 9-10). Combined Paramount-WBD\
    \ entity would carry ~$80B in debt (WSJ/Times),\n  a figure cited by state AGs as a risk to content investment and local\
    \ employment.\n- 12-STATE AG LAWSUIT FILED (Jul 13, 2026): California AG Rob Bonta led coalition of 12\n  Democratic AGs\
    \ filing antitrust lawsuit in N.D. Cal. to block the $110B Paramount-WBD merger.\n  Alleges violation of Section 7 of\
    \ the Clayton Act. Key claims: combined entity would control\n  ~27% of wide-release theatrical films and ~27% of basic\
    \ cable channels; only 3 distributors\n  would control 75% of wide-release films; merger would combine 2 of Hollywood's\
    \ 5 major film\n  distributors AND 2 of 5 major basic cable channel owners. Coalition states asked companies\n  not to\
    \ close before judicial process concludes; will seek TRO if refused.\n  CRITICALLY: DOJ had CLEARED the deal (Jun 19)\
    \ after 8-month review and 2M+ documents,\n  concluding deal would INCREASE competition. State AGs acting independently\
    \ under separate\n  authority. All 12 filing AGs are Democrats - creating a political dimension.\n  Minnesota AG Keith\
    \ Ellison joined coalition same day (Fox9, Jul 13). Rep. Darrell Issa\n  (R-CA) had already warned Bonta against filing\
    \ (Jul 11 letter to Newsom+Bonta).\n  MARKET REACTION: WBD stock ROSE 1.88% to $27.09 on filing day (Barron's: WBD +3.8%\
    \ to\n  $27.61 intraday). Paramount PSKY also rose 2.5%. Market appears to view state AG challenge\n  as unlikely to succeed\
    \ given DOJ clearance and 24+ international regulatory approvals.\n  Source: Fox9, Washington Examiner, Daily Caller,\
    \ Barron's (all Jul 13, 2026).\n- WGA LAWSUIT FILED (Jul 14, 2026): Writers Guild of America (18,000 members) filed SEPARATE\n\
    \  antitrust lawsuit in N.D. Cal. (same court as state AGs) to block the merger. WGA alleges\n  combined Paramount-WBD\
    \ would be the LARGEST employer of film and television writers,\n  enabling downward pressure on wages and working conditions.\
    \ WGA East President Tom Fontana:\n  \"will not stand idly by as Paramount attempts to violate our country's antitrust\
