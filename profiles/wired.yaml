          framing: "Neutral/factual on Applebot-Extended crawler blocking"
        - entity: "Anthropic"
          relationship: "No Condé Nast deal"
          framing: "Critical but market-focused — $1T damages potential"
      asymmetry_direction: >
        Coverage framing inversely correlates with deal value: Meta ($0) receives most
        accusatory framing, OpenAI (paid) receives most favorable positioning in shared
        lawsuits. Google ($0) critical but editorially self-interested. Apple (negotiating)
        neutral/factual.
