  estimated_value: undisclosed
  date_established: 2025 (referenced by CEO Lynch Oct 2025)
  description: 'ADVERSARIAL → LICENSING ARC: Condé Nast initially sent a cease-and-desist letter to Perplexity AI in 2024
    (reported by The Information) after Perplexity ignored robots.txt directives on Wired''s website and was accused of plagiarizing
    Wired and Forbes content in AI-generated summaries. Forbes CEO Mike Federle publicly called Perplexity a "bad actor."
    Perplexity subsequently launched its Publishers Program (mid-2024) with revenue-sharing to settle disputes. By October
    2025, Condé Nast CEO Roger Lynch cited Perplexity alongside OpenAI as an AI licensing partner in a statement about the
    company''s strategic pivot: "it plans to lean on events, subscriptions, commerce, and licensing deals with AI players
    including OpenAI and Perplexity" (Adweek, May 2026 article referencing Oct 2025 Lynch comments). Perplexity''s Comet Plus
    program (Oct 1, 2025) included 16 Condé Nast titles - compensating based on human engagement, AI-driven interactions,
    and content usage in training. PERPLEXITY MEDIA REVENUE FUND: Perplexity allocated $42.5M to pay publishers whose content
    is used in its search and AI tools (Bloomberg, ~early 2026). Revenue comes through Comet Plus subscription ($5/mo) - publishers
    receive 80% of revenue, Perplexity retains 20%. Confirmed negotiation partners include Time, LA Times, and Fortune. Previously
    sued by Forbes, Dow Jones, and New York Post for copyright infringement. Cloudflare also accused Perplexity of bypassing
    protective blocks for data scraping. Perplexity raised $100M at $18B valuation in Jul 2025 and announced intent to acquire
    Google Chrome for $34.5B if antitrust divestiture is ordered. Source: https://ain.ua/en/2026/perplexity-will-pay-publishers-for-ai-content/
    Perplexity AI is an AI-powered search engine backed by Jeff Bezos and Nvidia that competes with Google Search, Meta AI
    search, and OpenAI''s SearchGPT. Combined with OpenAI, Amazon, Apple (in negotiations), and Microsoft Copilot, this makes
    SIX Meta competitors in Condé Nast''s AI licensing portfolio, while Meta remains the sole major tech company with no Condé
    Nast revenue relationship.

    '
  competitive_with:
  - Meta
  source_urls:
  - https://www.adweek.com/how-conde-nast-grew-events-revenue/
  - https://www.theinformation.com/articles/conde-nast-sends-cease-and-desist-to-perplexity
  - https://digiday.com/media/media-buying-briefing-an-updated-timeline-of-the-key-events-in-ai-and-media/
- partner: Microsoft (Publisher Content Marketplace)
  relationship_type: licensing (marketplace pilot)
  estimated_value: undisclosed (usage-based payments)
  date_established: 2025-12-03 (announced), formal PCM launch 2026-02-03
  description: 'Condé Nast is a CO-DESIGN PARTNER of Microsoft''s Publisher Content Marketplace (PCM), a centralized AI licensing
    hub formally launched February 3, 2026 via Microsoft Advertising. PCM is designed to replace one-off bilateral licensing
    deals between publishers and AI companies with a scalable marketplace where publishers set licensing and usage terms,
    AI builders discover and license content for specific grounding scenarios, and publishers receive usage-based reporting
    and payments proportional to content value delivered.

    CO-DESIGN PARTNERS (who shaped licensing, pricing, governance, analytics, and onboarding): Condé Nast, The Associated
    Press, Business Insider Inc, Hearst Magazines, People Inc, USA TODAY Co., and Vox Media LLC. Yahoo is the first demand
    partner onboarding on the buyer side.

    SCOPE: Condé Nast''s U.S. text-based editorial content is licensed for grounding AI-generated summary responses across
    Microsoft Copilot experiences. Early pilots validated assumptions before scaling. Microsoft plans to expand to more publishers
    and AI builders.

    STRUCTURAL SIGNIFICANCE: PCM is fundamentally different from the bilateral OpenAI/Amazon/Perplexity deals because it creates
    an open marketplace where ANY AI builder can license Condé Nast content, not just Microsoft. This means Condé Nast''s
    content enters a PLATFORM that could serve multiple AI companies - potentially including Meta competitors - through a
    single integration. The marketplace model also provides Condé Nast with comparative usage data across AI builders, which
    could inform future pricing negotiations.

    CEO Roger Lynch: "Our technology and product ambitions are central to how we serve audiences today." Microsoft competes
    directly with Meta in AI (Copilot vs Meta AI), social/professional networking (LinkedIn vs Facebook/Instagram), enterprise
    (Azure/Teams vs Workplace from Meta), and advertising (Microsoft Advertising vs Meta Ads). This is the SIXTH Meta competitor
    to establish a content licensing deal with Condé Nast (after OpenAI, Amazon Rufus, Perplexity, Apple in negotiations,
    and now Microsoft), further isolating Meta as the only major tech company with no revenue relationship with Condé Nast.

    CONTEXT: Amazon also signaled plans for its own content marketplace (reported by The Information, Feb 10, 2026), suggesting
    the industry is converging on marketplace models over bilateral deals. If Amazon launches a competing marketplace, Condé
    Nast could simultaneously earn from Microsoft PCM, Amazon''s marketplace, and bilateral OpenAI/Perplexity deals - creating
    a multi-platform revenue diversification strategy that further insulates Condé Nast from any single AI company dependency.

    '
  competitive_with:
  - Meta
  source_urls:
  - https://about.ads.microsoft.com/en-us/blog/post/february-2026/building-toward-a-sustainable-content-economy-for-the-agentic-web
  - https://searchengineland.com/microsoft-publisher-content-marketplace-ai-licensing-454329
  - https://www.adweek.com/media/conde-nast-names-chief-product-technology-officer-vasanth-williams/
  - https://www.condenast.com/news/conde-nast-joins-microsoft-pilot-partner-ai-content-marketplace
  - https://www.gadgets360.com/ai/news/microsoft-publisher-content-marketplace-ai-licensing-framework-publishers-8210843
- partner: Google
  relationship_type: adversarial_no_deal
  estimated_value: $0 (AI licensing); significant (programmatic advertising)
  date_established: n/a (no AI deal as of Jul 2026)
  description: 'CRITICAL ABSENCE: Condé Nast has NO AI content licensing deal with Google - the only major AI platform alongside
    Meta with zero AI licensing revenue to Condé Nast. This is notable because Google has signed AI pilot deals with competitors
    including The Guardian, The Washington Post, Der Spiegel, El País, Folha, Infobae, Kompas, Times of India, and The Washington
    Examiner (News AI pilot program, launched December 2025).

    GOOGLE SHOWCASE PHASE-OUT (Jun 25-29, 2026): Per The Information (reported by NY Post, Inshorts), Google is now phasing
    out its existing Showcase program - the annual-payment licensing arrangement through which Google compensated publishers
    for curated news panels. Google told some publishers Showcase is being ENDED and replaced by the News AI pilot program,
    which requires publishers to grant Google broad content-use rights, potentially including rights to train AI models on
    their content. Publishers who decline the new AI pilot risk losing their existing Showcase payments. Jason Kint, CEO of
    Digital Content Next (trade group representing NYT, WashPost, News Corp): "This is Google''s game. They''re gonna dominate
    here. There''s no fair deal discussions that can happen with Google. It''s really a matter of how much money they want
    to drop on an individual organization."

    GOOGLE AI SEARCH SCALE: AI Overviews now reaches 2.5 billion monthly active users; AI Mode surpassed 1 billion monthly
    users (per Google, Jun 2026). These are the surfaces where publisher content is consumed without click-through.

    UK CMA OPT-OUT REQUIREMENTS (Jun 4, 2026): UK Competition and Markets Authority imposed "world-first" conduct requirements
    on Google, mandating effective opt-out tools for AI features separate from traditional search (previously bundled). Google
    has 9 months to implement. Testing UK subset first. CMA Chief Executive Sarah Cardell: "With features like AI Overviews
    rapidly reshaping online search, it is crucial that content publishers, including news organisations, have appropriate
    bargaining power." Condé Nast''s CEO Lynch had previously called Google''s bundled opt-out arrangement "pernicious" (FT,
    Feb 27, 2026).

    ADVERTISING: Google remains a significant programmatic advertising revenue source for Condé Nast despite the AI licensing
    exclusion. This creates a COMPOUND TENSION: Condé Nast depends on Google for advertising revenue while publicly attacking
    Google''s AI practices and receiving zero compensation for AI content use.

    COMPETITIVE CONTEXT: Unlike other publishers who can play Google against OpenAI/Microsoft in licensing negotiations, Condé
    Nast has chosen (or been excluded from) the Google AI pilot, concentrating its AI licensing revenue among Google''s competitors.
    When Wired covers Google''s AI impact on publishing, it covers a company that is actively harming Condé Nast''s traffic
    AND paying competitors (Guardian, WashPost) while excluding Condé Nast - an undisclosed financial motivation.

    '
  competitive_with:
  - Meta
  source_urls:
  - https://ppc.land/conde-nast-ceo-calls-google-ai-a-death-blow-as-search-traffic-collapses/
  - https://nypost.com/2026/06/26/business/google-looks-to-bleed-publishers-with-new-ai-partnerships-that-would-cull-their-content/
