    end of 2025; team rebuilt to focus on audience development and UK/Europe-focused digital reporting. Had been reducing
    frequency: monthly → bimonthly (2017) → quarterly (2024) → ceased entirely. Drummond: "Creating a sustainable and growing
    subscription business is the future of Wired." Digital-only new subscribers doubled in 2025, direct-to-publisher subscribers
    up 20%. This follows Wired Italy shutdown (Apr 2026) - two international print editions eliminated within months, concentrating
    the brand on US print + global digital subscription.

