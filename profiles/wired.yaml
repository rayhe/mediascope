      description: 'WIRED conducted multi-part adversarial investigation of Meta NameTag (dormant FR code, Jun 4+8, 2026)
        but only reported on OpenAI''s planned hardware device (camera + facial recognition + always-on + home placement)
        in neutral business terms (io trademark delay, Feb 2026). Zero privacy investigation of OpenAI''s planned camera+FR
        despite having full knowledge of the features from The Information (Feb 20, 2026). Gizmodo (zero financial ties) published
        more adversarial OpenAI hardware coverage (tone -0.30) than WIRED (tone 0.0).

        '
