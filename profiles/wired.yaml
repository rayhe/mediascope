- name: Advance Publications, Inc.
  entity_type: holding_company
  description: 'Private media holding company, incorporated in New York, founded 1922 by Samuel Irving Newhouse Sr. HQ: One
    World Trade Center, New York, NY 10007. Wholly owned by the Newhouse family. Board of Directors (per Reddit 2025 proxy,
    DEF 14A filed Apr 28, 2025): Michael A. Newhouse, Steven O. Newhouse, Samuel I. Newhouse III, Thomas S. Summer, Jamie
    Miller, and Victor F. Ganzi. NEW (2025): Jamie Miller added to AP board between 2024 and 2025 proxy filings. Likely Jamie
    S. Miller - former GE CFO (Nov 2017-Feb 2020), GE Transportation President & CEO (Oct 2015-Nov 2017), GE CIO (Apr 2013-Oct
    2015). Now CFO of Cargill, Inc. (since Mar 2021). Also serves on Qualcomm board (since May 2020) and International Paper
    board (since 2024). Brings heavy financial/audit/tech industry expertise to the AP board that makes ALL voting and investment
    decisions regarding Advance''s Reddit shares. KEY: Advance is the indirect parent making ALL voting and investment decisions
    for its subsidiaries'' holdings (including Reddit shares), per SEC filings. Portfolio spans media, communications, technology,
    education, and sports.

    '
  source_url: https://www.advance.com
- name: Newhouse Family
