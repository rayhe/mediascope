- name: Paresh Dave
  beat: AI, Big Tech
  known_patterns: Focuses on AI company practices, data use
  career_trajectory:
  - publication: Los Angeles Times
    years: 2013-2017
    beat: Technology, cybersecurity, Silicon Beach
  - publication: Reuters
    years: 2017-2023
