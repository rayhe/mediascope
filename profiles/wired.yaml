      five_patterns:
        - pattern_name: "SOURCE PIPELINE ESCALATION"
          description: >
            Dave's Meta sources are anonymous disgruntled employees who use extreme language
            ("gulag," "piece of shit," "soul-crushing") — and WIRED's editorial choice is to
            amplify this language into headlines. His OpenAI sources are institutional, legal,
            and document-based — producing measured headlines. His Google sources are executives
            and analysts — producing analytical headlines. The SOURCE PIPELINE itself is an
            editorial assignment choice: WIRED assigns Dave to cultivate disgruntled Meta employees
            but does not assign him to cultivate disgruntled OpenAI employees during comparable
            crises (Nov 2023 board firing, safety team departures, Jan Leike resignation).

        - pattern_name: "HEADLINE PROFANITY ASYMMETRY"
          description: >
            Dave's Meta coverage features profanity in headlines ("piece of shit," "jesus
            fucking christ") — an editorial choice that maximizes engagement through outrage.
            His OpenAI coverage uses measured academic language even when documenting arguably
            worse governance failures ("quietly scrapped," "confidentially files"). Running
            employee profanity in a headline is an editorial decision, not journalism — the
            same facts could be reported with professional language. WIRED's editorial desk
            chooses to escalate Meta stories and measure OpenAI stories.

        - pattern_name: "MULTI-BYLINE ESCALATION ASYMMETRY"
          description: >
            Meta's "Dark Mood" gets four-byline treatment (Dave + Goode + Levy + Schiffer) —
            maximum editorial firepower signaling institutional priority. No comparable
            multi-byline investigation during OpenAI's board crisis (Nov 2023), safety team
            exodus (2024), or for-profit conversion (2024-2025). The allocation of editorial
            resources signals institutional prioritization of Meta as a target.

        - pattern_name: "POSITIVE COVERAGE EXCLUSION"
          description: >
            Dave has a positive-headline Google story ("affirmative litigation paid off") but
            zero positive-headline Meta stories. Even Meta's content moderation improvements
            ("cut mistakes by half") get qualified framing, while Google's cybercrime initiative
            gets unqualified praise. Meta's hackathon is framed through layoff trauma context.

        - pattern_name: "CONFESSION FRAMING vs ANALYTICAL FRAMING"
          description: >
            When Bosworth self-criticizes ("atrocious"), Dave frames it as an institutional
            confession — the CTO admitting failure. When Google executives discuss antitrust
            remedies, Dave frames it as policy analysis. Same structural position (executive
            acknowledging a problem), opposite narrative registers. Meta executives who
            self-reflect are confessing; Google executives who self-reflect are analyzing.

      natural_experiment_significance: >
        Dave covered Google at Reuters for 5+ years (2017-2023) before moving to WIRED. His
        Reuters Google coverage was analytical and measured — the same register he now applies
        to Google and OpenAI at WIRED. His Meta coverage at WIRED uses a dramatically different
        emotional register than anything in his Reuters portfolio. This suggests the escalation
        is INSTITUTION-DRIVEN (WIRED editorial direction) rather than REPORTER-DRIVEN (personal
        bias), because the same reporter applies balanced framing to competitors and dramatic
        framing to Meta within the same publication. His single most balanced piece — the FTC
        consent decree investigation covering both Meta AND Google — proves he can cover Meta
        analytically when the story structure includes Google as a co-subject.

      editorial_responsibility_note: >
        Dave is a reporter; headlines and framing are co-owned with editors (Katie Drummond,
        Brian Barrett). The choice to run "piece of shit" in a headline, to assign four reporters
        to a Meta morale story, to NOT assign comparable resources to OpenAI's board crisis —
        these are editorial decisions that flow from WIRED's institutional posture, amplified
        through Dave's byline. This makes Mechanism #8 a complement to Mechanism #5
        (Schiffer's source pipeline asymmetry): WIRED's entire Big Tech desk systematically
        applies different emotional registers to Meta vs competitors.

      test_file: "tests/test_paresh_dave_cross_entity.py"
