steven_levy:
  date_analyzed: '2026-08-09'
  role: Editor at Large
  editorial_authority: 'Steven Levy is WIRED''s institutional voice - longest-tenured journalist (original contributing writer
    from 1993 founding), most CEO access (Gates, Bezos, Jobs, Page, Brin, Zuckerberg), author of books on Google (In the Plex,
    2011) and Facebook (Facebook: The Inside Story, 2020). His editorial posture toward subjects IS WIRED''s editorial posture.
    Founded Backchannel on Medium (2014), acquired by Condé Nast (2016). Wife is Pulitzer Prize winner Teresa Carpenter.

    '
  key_finding: 'Levy applies systematically different headline framing to Meta vs. all competitors. Meta receives institutional-pathology
    language (relentless, self-defeating, dark mood, punish a defector). Google receives neutral enterprise framing. Other
    competitors (Amazon/Bezos, Microsoft, Lyft) receive personality-driven curiosity framing or CEO-platforming headlines.
    The same editorial concepts - organizational struggle, talent departure - receive clinical-adversarial register for Meta
    and affectionate-playful register for competitors.

    '
  meta_coverage:
    dominant_framing: institutional-pathology-adversarial
    articles:
    - title: Meta's Pursuit of the 'Careless People' Author Is Relentless and Self-Defeating
      date: '2026-07-10'
      framing_notes: 'Loaded headline language: ''relentless'' (institutional compulsion), ''self-defeating'' (pathological
        behavior). Techmeme summary: ''feels less about defending its reputation than a need to punish a defector.'' Meta
        framed as institutional bully with retributive psychology. Wynn-Williams receives sympathetic ''defector'' framing
        - a term normally reserved for political dissidents, not corporate ex-employees.

        '
      loaded_terms:
      - relentless
      - self-defeating
      - punish
      - defector
      source_url_proxy: https://www.techmeme.com/260710/p4
    - title: Dark Mood Inside Meta
      date: '2026'
      framing_notes: 'Four-byline treatment (Paresh Dave + Lauren Goode + Steven Levy + Zoë Schiffer) signals maximum editorial
        importance. ''Dark mood'' is clinical/psychological diagnosis of an institution - language normally reserved for medical
        or psychological assessments, applied here as organizational pathology.

        '
      loaded_terms:
      - dark mood
      co_authors:
      - Paresh Dave
      - Lauren Goode
      - Zoë Schiffer
  google_coverage:
    dominant_framing: neutral-enterprise-curiosity
    articles:
    - title: Google's Top AI Brains Are Leaving to Launch Discovery Loop
      date: '2026-08-05'
      framing_notes: 'Same editorial concept as Meta talent stories (people leaving a tech giant) but ZERO loaded language.
        ''Brains'' is neutral-respectful. ''Leaving to Launch'' frames departure as entrepreneurial opportunity, not organizational
        failure. No psychological diagnosis of Google. No ''dark mood'' or ''self-defeating'' equivalents. Compare to Meta:
        if Meta''s top AI researchers left, the headline framing would predictably be ''exodus,'' ''crisis,'' or ''defection.''

        '
      meta_equivalent_framing: 'If this were Meta, predicted headline register: ''Meta''s AI Team Is Hemorrhaging'' or ''Another
        Wave of Defections at Meta.'' Google gets enterprise-neutral; Meta gets institutional-pathology.

        '
    - title: Google I/O 2026 Coverage
      date: '2026-05-19'
      framing_notes: 'Levy was one of 5 WIRED reporters at Google I/O covering camera-equipped smart glasses with AI features.
        Live blog used enthusiastic/playful framing (''actually bananas'') for hardware functionally identical to Meta''s
        Ray-Ban glasses, which generate ''dormant surveillance infrastructure'' framing from the same publication. See google_io_2026_smart_glasses_coverage
        section for full analysis.

        '
  other_competitor_coverage:
    dominant_framing: personality-driven-curiosity-platforming
    articles:
    - title: Jeff Bezos Is Funding a Wild Hunt for the Brain's 'Core Algorithm'
      date: '2026-06-04'
      entity: Amazon/Bezos
      framing_notes: 'Curiosity-driven, almost admiring framing. ''Wild hunt'' evokes adventure and vision. Bezos positioned
        as intellectual patron, not as surveillance-capitalism oligarch. Despite Amazon''s surveillance/labor controversies
        (Ring, warehouse conditions), Levy uses exploratory-visionary language. No institutional diagnosis.

        '
