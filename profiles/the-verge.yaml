  io_device_paradox:
    description: |
      The io device paradox is the strongest evidence of cross-entity
      coverage asymmetry at The Verge. OpenAI acquired Jony Ive's io
      Products for $6.5B to build AI-powered hardware — a wearable device
      with cameras, sensors, and always-on AI capabilities that will
      directly compete with Meta's smart glasses. The Verge (via Hayden
      Field) covered the acquisition with innovation/aspiration framing:
      "coolest piece of technology the world will have ever seen" (Altman
      quote), design legacy narrative, business milestone.

      Meanwhile, Meta's single-camera glasses receive sustained activist-
      backlash framing: "pervert technology," "mass surveillance predator
      glasses," "wiretapping laws."

      Both products:
      - Have cameras (io: confirmed in acquisition announcement; Meta: 12MP)
      - Use always-on AI (io: ChatGPT-powered; Meta: Meta AI)
      - Process visual/audio data continuously
      - Are worn on/near the face as everyday devices

      Only Meta gets surveillance framing.
    openai_io_has_cameras: true
    meta_glasses_has_cameras: true
    openai_io_surveillance_terms: 0
    meta_glasses_surveillance_terms: 4
    financial_correlation: |
      OpenAI pays The Verge's parent (PMC/Vox Media) via content
      licensing deal AND receives payment via Azure enterprise agreement
      (bilateral flow). Meta pays The Verge's parent $0 for AI content.
      Coverage framing tracks financial alignment: deal partner (OpenAI)
      gets aspiration framing for camera device; non-deal entity (Meta)
      gets surveillance framing for camera device.
    source_urls:
      - "https://www.techmeme.com/250709/p35"
      - "https://www.aivanet.com/2026/07/with-smart-glasses-meta-holds-all-the-cards-but-fails-to-play-them-well/"

  disclosure_pattern: |
    Selective disclosure. The Verge discloses its Google lawsuit on the
    Vergecast ("Disclosure is our brand") — an adversarial financial
    relationship. But The Verge does NOT disclose:
    (a) OpenAI content licensing deal (aligned financial relationship)
    (b) Azure OpenAI enterprise agreement (aligned financial relationship)
    (c) PIF/SRMG ownership chain that divested Meta stock
    The pattern is: disclose adversarial relationships, conceal aligned ones.

  # ===================================================================
