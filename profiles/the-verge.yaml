  - name: "Alex Heath"
    title: "Deputy Editor, Platforms & Emerging Tech"
    editorial_stance: >
      Primary Meta/Facebook reporter at The Verge. Known for exclusive sourcing inside Meta. Previously
      at The Information and Business Insider. Covers Meta's Reality Labs, Quest headsets, social platform
      changes, and internal company dynamics. His reporting on Meta is among the most-cited in the
      industry. KEY for MediaScope analysis: his coverage sets The Verge's institutional tone on Meta
      as a company, distinct from Victoria Song's product-focused wearables coverage.

      THE ACCESS PARADOX (documented Aug 6 2026):
      Heath conducts deep-access Decoder interviews with Meta CEO Mark Zuckerberg (multiple episodes)
      AND simultaneously produces adversarial coverage of Meta's internal dynamics, layoffs, and
      organizational turmoil. For OpenAI, Heath performs the SAME access journalism (Nick Turley
      interview, Bret Taylor/OpenAI chairman on Decoder) but WITHOUT the adversarial investigative
      counterpart. As Deputy Editor, his adversarial Meta coverage carries institutional weight that
      a beat reporter's would not. The result: Meta gets "deputy editor investigator" treatment (access
      + adversarial = net adversarial), while OpenAI gets "access interview + neutral beat reporter
      news" (Hayden Field handles the beat). Both companies have had comparable internal dramas. Only
      Meta gets the adversarial investigative lens. Command Line ($7/mo paid newsletter) covers Meta
      and OpenAI comparatively without disclosing PMC's financial relationship with OpenAI.

      Cross-entity examples:
      - Meta: Reality Labs layoffs (Jan 2026, Apr 2025), "Meta CTO catching leakers," "buckle up"
        internal meeting, metaverse strategy doubt, organizational turmoil coverage
      - OpenAI: GPT-5 launch (Aug 2026, neutral), Nick Turley Q&A (constructive access), Bret Taylor
        interview (aspiration framing, Sierra $10B), OpenAI social network scoop (neutral)
      - Snap: Spectacles hands-on (constructive, battery/overheating focus NOT surveillance), WaveOptics
        acquisition ($500M business framing), no surveillance language despite cameras
      - Meta products (Oakley HSTN, Orion hands-on): balanced/constructive, not adversarial

      Source: Wikipedia (https://en.wikipedia.org/wiki/Alex_Heath), Techmeme citation indexes, podcast
      appearances (Decoder, Vergecast, Land of the Giants S6), Command Line newsletter launch
      (https://talkingbiznews.com/media-news/the-verge-debuts-new-tech-newsletter-led-by-heath/)

