      paradox: >
        Snap Specs have MORE camera hardware (visible + infrared + hand tracking), MORE
        AI integration partners (OpenAI + Gemini — both Meta AI competitors), and HIGHER
        surveillance potential (standalone compute, 4hr battery, multiple processors) than
