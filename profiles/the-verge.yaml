    editorial_lane_assignment:
      pattern: >
        The Verge's smart glasses lane assignment mirrors WIRED's but operates through
        different mechanisms:

        WIRED: Product reviewers (Goode, Chokkattu) cover Apple/Snap/Google glasses →
        product-delight framing. Investigators (Cameron, Mehrotra) cover Meta glasses →
        surveillance-alarm framing. Same hardware, different editorial lane by manufacturer.

        THE VERGE: Product coverage (Pierce, Song) covers ALL smart glasses including Meta
        through balanced product lens. BUT institutional coverage (Heath investigations,
        Patel editorial commentary, news reporting) adds an adversarial surveillance layer
        ONLY for Meta. For Snap, coverage stays in product-review lane exclusively —
        no investigative counterpart examining Snap's camera privacy implications.

        Result is functionally equivalent: Snap gets net-positive product coverage,
        Meta gets net-negative (balanced product reviews drowned by volume of adversarial
        institutional coverage). The mechanism differs (WIRED: lane assignment at reporter
        level; The Verge: lane assignment at editorial-layer level) but the outcome is
        identical: same camera hardware, different coverage treatment by manufacturer.
      snap_investigative_articles: 0
      meta_investigative_articles: "multiple (Heath, news desk)"

