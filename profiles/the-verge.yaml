      EIC since July 2014 (succeeded Joshua Topolsky). Former managing editor. JD from Georgetown
      University Law Center. Previously a lawyer at an IP litigation firm before joining Engadget
      (2005), then co-founding The Verge with Topolsky. Host of the Vergecast and Decoder podcasts.
      Known for strong editorial voice on tech antitrust, platform regulation, right to repair, and
      independent journalism. Coined "Google Zero" framing for the impact of AI Overviews on
      publisher traffic. Has been vocal about Vox Media's Google lawsuit on-air. His legal background
      shapes The Verge's emphasis on policy and regulatory coverage.

  - name: "David Pierce"
    title: "Editor-at-Large"
    editorial_stance: >
      Co-host of Vergecast (daily format since ~2025). Previously at Protocol (EIC), Wired, and WSJ.
      Covers consumer tech, gadgets, AI products. Also hosts Version History (deep-dive podcast series).
      KEY MIGRATION: Protocol (failed Politico tech spinoff) → The Verge. His Wired background means
      he brings Condé Nast institutional framing exposure to The Verge's editorial environment.

      CAREER PATH (5 publications, 16 years):
      1. PC Magazine (2010–2011) — Ziff Davis
      2. The Verge (2011–2015) — First stint, Vox Media, deputy editor
      3. WIRED (2015–2017) — Condé Nast/Advance Publications, senior writer
      4. Wall Street Journal (2017–2020) — News Corp/Dow Jones, personal tech columnist
      5. Protocol (2020–2022) — Politico parent, editorial director (Protocol shut down late 2022)
      6. The Verge (2022–present) — Boomerang return as Editor-at-Large, PMC/PMX ownership

      University of Virginia BA in Government and Media Studies. One of the most
      well-traveled tech journalists in the industry — his 5-publication career creates
      a NATURAL EXPERIMENT for testing whether adversarial Meta coverage is reporter-driven
      (individual response to Meta's behavior) or institution-driven (editorial assignment
      and ownership incentives). Evidence strongly supports institution-driven.

    cross_entity_coverage_analysis:
      mechanism_name: "institutional_framing_immunity"
      mechanism_id: 7
      description: >
        David Pierce covers Meta products with balanced, product-evaluation framing
        DESPITE working at two publications with documented adversarial institutional
        postures toward Meta (WIRED 2015–2017, The Verge 2022–present). His Meta
        coverage tone has remained consistent across all institutional contexts,
        proving that adversarial Meta framing is editorially imposed through assignment
        and commentary structures, not organically generated by reporters exposed to
        the same information.
      analytical_significance: >
        Pierce's career is the strongest natural experiment in the MediaScope dataset.
        If adversarial framing were reporter-driven — a natural response to Meta's
        actual behavior — we would expect it to follow Pierce from publication to
        publication. It does not. His coverage is product-focused and balanced across
        all five employers. The adversarial framing at WIRED comes from editorial
        lane assignment (Goode covers Apple/Snap, not Meta glasses). The adversarial
        framing at The Verge comes from Alex Heath (business investigations) and
        Nilay Patel (editorial commentary). Pierce is editorially shielded from
        adversarial Meta coverage by assignment design.

      meta_coverage:
        tone: "balanced_to_positive"
        overall_assessment: >
          Product-focused critique. Identifies strengths and weaknesses without
          surveillance/privacy alarm language. Consistent reviewer lens regardless
          of which company made the device.
        key_examples:
          - title: "Meta Quest 3 review: almost the one we've been waiting for"
            date: "2023-10-09"
            publication: "The Verge"
            tone: +0.2
            framing: >
              Balanced product review. Called it "my favorite one yet" and "an excellent
              VR headset" but noted it "doesn't quite deliver" on mixed reality promise.
              Criticism is functional (not enough MR content, passthrough not sharp enough),
              NOT existential (surveillance, privacy, corporate ethics). Zero surveillance
              language despite Quest 3 having multiple outward-facing cameras. Concludes
              with forward-looking optimism: "maybe this is the headset before THE headset."
            source_url: "https://www.techmeme.com/231009/p13"

          - title: "Meta's new smart glasses look like the future"
            date: "2024-09-27"
            publication: "The Verge (Vergecast)"
            tone: +0.4
            framing: >
              Vergecast episode covering Orion AR glasses at Meta Connect 2024. Pierce
              called Orion "a statement of purpose from Meta: that AR glasses really are
              the future and that we're eventually going to get there." Acknowledged it
              could be "vaporware" or "the unquestionable future" — honest uncertainty
              without dismissal. Brought in Alex Heath for the deep access reporting.
              The episode title itself — "Meta's new smart glasses look like the future" —
              is positive editorial framing, notable given The Verge's institutional
              adversarial posture on Meta corporate stories.
            source_url: "https://vuink.com/post/guriretr-d-dpbz/2024/9/27/24255557/meta-orion-quest-smart-glasses-ar-connect-vergecast"

          - title: "Ray-Ban Meta Smart Glasses: livestreaming, headphone-replacing eyewear"
            date: "2023-09-27"
            publication: "The Verge"
            tone: +0.1
            framing: >
              Product announcement coverage of Ray-Ban Meta Gen 2. Featured 12MP camera,
              speakers, five mics, Snapdragon AR1 Gen 1. Pierce handled as product news,
              no surveillance framing despite camera-equipped eyewear. Techmeme aggregation
              confirms this was lead coverage for The Verge.
            source_url: "https://www.techmeme.com/230927/p33"

      apple_coverage:
        tone: "balanced_to_positive"
        key_examples:
          - title: "Apple Vision Pro hands-on"
            date: "2023-06-05"
            publication: "The Verge"
            tone: +0.3
            framing: >
              Pierce did The Verge's initial Vision Pro hands-on at WWDC 2023. Described
              it as "much better-looking than other AR/VR headsets" with "silver sci-fi
              goggles, cable, and battery pack." Product-focused, no privacy/surveillance
              concerns raised despite Vision Pro having 12 outward-facing cameras, 5 sensors,
              and 6 microphones — significantly more sensors than Meta's glasses. This creates
              a DIRECT COMPARISON: same journalist, same publication, camera-equipped devices
