        tone: +0.15
        framing: "Business milestone, design legacy, innovation narrative. io device will have cameras and sensors for always-on AI — functionally identical to Meta glasses — but ZERO pre-emptive privacy alarm."
        surveillance_terms: 0
        source_url: "https://www.techmeme.com/250709/p35"
        notes: "io device is a camera-equipped AI wearable competing directly with Meta glasses. Framed as aspiration, not threat."
      - title: "OpenAI plans to launch GPT-5 in early August"
