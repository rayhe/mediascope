      The Verge applies systematically different editorial lanes to Snap's camera-equipped
      AR glasses and Meta's camera-equipped smart glasses. Snap Specs — which have visible
      light cameras, infrared cameras, and an LED recording indicator bar — receive pure
      product-review framing. Meta Ray-Ban glasses — which have a single 12MP camera and
      an LED recording indicator — receive surveillance/harassment/privacy-alarm framing.
      The Verge's coverage of Snap Specs contains ZERO privacy or surveillance language
      despite functionally similar camera capabilities. The hardware is the same category;
      the framing diverges by manufacturer identity.

    snap_specs_coverage:
      tone: "+0.4 (product-enthusiastic)"
