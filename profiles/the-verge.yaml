  - name: "Penske Family"
    entity_type: "family_office"
    description: >
      Jay Penske (born ~1979, New York City) is the youngest son of Kathy Penske and Roger Penske.
      Wharton School (UPenn) BS in Management of Information Systems and Finance.
      Net worth estimated at $250M (Celebrity Net Worth, 2026). Previously married to Elaine Irwin
      (supermodel, 2012-2024). One daughter.

      Roger Penske (father): Billionaire founder and chairman of Penske Corporation, a diversified
      transportation and automotive empire. Key holdings:
      - Penske Automotive Group (NYSE: PAG) — publicly traded, Roger is Chair & CEO, 10%+ owner.
        PAG is one of the largest US automotive retail groups. Market cap ~$12.7B (Jul 14, 2026).
        Stock: $193.55 (Jul 14) — trading near NEW 52-WEEK HIGHS (52W high reached $197.69 on
        Jul 10, now slightly retreated). 367 franchised dealerships
        (150 US/Puerto Rico, 217 international).
        27,700 employees. TTM revenue: $31.8B. TTM net income: $935.4M. TTM EPS: $14.13.
        Q1 2026: EPS $3.56 (beat $2.91 consensus by $0.65), revenue $7.86B (+1.2% QoQ). GAAP EPS $3.56.
        Q2 2026 earnings: July 29. Q2 consensus EPS: $3.39 (Barchart: $3.39 avg from 5 est,
        range $3.30–$3.48). FY 2026 consensus EPS: $13.46 (Barchart, 6 est — slightly revised down
        from prior $13.60; range $13.30–$13.68). FY 2027 consensus: $14.51 (6 est).
        NOTE: PAG reached $197.69 on Jul 10 (new 52W high) before pulling back to $193.55. The
        Penske family's wealth rally (PAG +38% from 52W low of $140.12) continues alongside
