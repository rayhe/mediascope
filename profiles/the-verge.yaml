      cross_entity_analytical_significance: >
        David Pierce is the CONTROL CASE for MediaScope's institutional framing hypothesis.
        His coverage demonstrates five key patterns:

        1. INSTITUTIONAL FRAMING IMMUNITY: Pierce covers Meta products with balanced framing
        despite working at two adversarial-to-Meta publications (WIRED, The Verge). If adversarial
        coverage were a natural reporter response to Meta's behavior, Pierce would exhibit it.
        He does not. Conclusion: adversarial Meta framing is editorially imposed, not organically
        generated.

        2. THE PODCAST BUFFER EFFECT: As Vergecast co-host and daily moderator, Pierce serves as
        a NEUTRAL PRESENTER who brings in specialists: Alex Heath for adversarial Meta business
        reporting, Victoria Song for balanced product reviews. His podcast role buffers The Verge's
        institutional adversarial posture from its consumer tech coverage.

        3. MULTI-INSTITUTIONAL NATURAL EXPERIMENT: Pierce's 5-publication career spanning WIRED
        (Condé Nast/Advance), WSJ (News Corp), and The Verge (PMC) — three publications with
        different ownership structures and different financial relationships with Meta's competitors —
        creates a controlled comparison. His Meta framing stays product-balanced across all contexts.
        The variable that DOES change is the publication's editorial assignment structure, not the
        reporter's tone.

        4. THE ASSIGNMENT PARADOX: Pierce writes the Quest 3 review (product-balanced) but does NOT
        write investigative pieces about Meta's privacy, surveillance, or corporate practices. Those
        go to Alex Heath or are addressed via editorial commentary (Nilay Patel). Pierce is editorially
        shielded from adversarial Meta coverage by assignment design — the same mechanism as WIRED's
        lane assignment asymmetry, but operating in reverse (product reviewer = balanced, business
        reporter = adversarial).

        5. CROSS-ENTITY SENSOR BLINDNESS: Pierce reviews camera-equipped devices from Meta (Quest 3,
        Ray-Ban Meta), Apple (Vision Pro), Google (Pixel), and Snap without raising surveillance
        concerns for ANY company. This proves that surveillance/privacy alarm language in Meta
        coverage is NOT triggered by the presence of cameras — it is selectively applied by specific
        editorial assignments (WIRED investigators, Verge policy editors, NYT privacy reporters).
        Pierce, covering the same devices through a product lens, finds nothing to alarm about.

        CONTRAST WITH WIRED'S LANE ASSIGNMENT:
        At WIRED, Lauren Goode covers Apple Vision Pro and Snap Spectacles with product-delight
        framing but NEVER reviews Meta glasses — those go to investigators. At The Verge, Pierce
        covers Meta Quest AND Apple Vision Pro through the same balanced product lens. This
        proves that WIRED's lane assignment is a deliberate editorial choice, not an organic
        division of expertise. If product reviewers naturally avoided Meta's camera products,
        Pierce would too. He doesn't — because the avoidance is institutional.

