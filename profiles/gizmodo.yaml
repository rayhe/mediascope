    significance: 'THE pivotal article. Wong explicitly states CAMERA HARDWARE PARITY between Google and Meta.

      Then frames Google''s camera avoidance as a smart marketing decision rather than a privacy

      concern. The privacy mention is a single gentle sentence suggesting Google COULD choose

      better data practices than Meta — framed as opportunity, not alarm. Compare to Meta coverage

