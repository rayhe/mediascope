editorial_posture:
  meta_coverage: adversarial_to_balanced
  tone: conversational_critical
  wearables_beat_reporter: Raymond Wong (Senior Editor, Consumer Tech)
  notes: |
    Gizmodo's smart glasses coverage is driven primarily by Raymond Wong,
    who is a hands-on reviewer. His coverage style is more nuanced than
    WIRED's structurally adversarial approach: he tests products, acknowledges
    appeal, and documents privacy issues from personal experience rather
    than institutional advocacy framing.
    
    Key difference from WIRED: Gizmodo under Keleops is a product-review-first
    publication with affiliate commerce as a primary revenue driver. This means
    they have a financial incentive to engage positively with products (to
    drive affiliate clicks) that partially counterbalances adversarial coverage.
    WIRED under Condé Nast/Advance has shifted toward investigative/adversarial
    coverage as a prestige differentiator under Katie Drummond.

