  privacy_coverage_pattern: |
    Wong applies privacy criticism to ALL companies equally. Key evidence:
    - "Apple's Smart Glasses Are Stepping Into a Privacy Minefield" (2026-04) — Apple gets privacy scrutiny
    - "Can Smart Glasses Ever Be Privacy-Friendly? These Companies Think So" (2026-06) — includes Google ("they haven't been much better")
    - "Dear Meta Smart Glasses Wearers: You're Being Watched, Too" (2026-03) — Meta-specific but based on Svenska Dagbladet investigation
    WIRED applies privacy framing ONLY to Meta, never to Apple Vision Pro (12 cameras) or Google XR glasses.

  clean_control_finding: |
    The "Clean Control Paradox": Gizmodo, with ZERO financial ties to any
    tech company, produces MORE balanced coverage than WIRED, which has
    deals with OpenAI, Amazon, Microsoft, and Perplexity. Wong's coverage
    proves that adversarial asymmetry is not inherent to tech journalism —
    it correlates specifically with publisher-competitor financial relationships.

