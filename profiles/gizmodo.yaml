google_io_2026_camera_paradox:
  date_analyzed: '2026-08-09'
  reporter: Raymond Wong
  finding: Camera Acknowledgment Paradox
  finding_summary: 'Raymond Wong wrote 6+ articles about Google/Samsung camera glasses at I/O 2026.

    In one article, he explicitly states camera parity: Google''s glasses "most certainly

    have cameras on them that can take pictures and videos—same as the Ray-Ban Meta AI

    glasses." Despite this acknowledged equivalence, his 6 Google I/O headlines contain

    ZERO privacy/surveillance language. Within 2 months, the same author produces 3+

    Meta headlines with privacy/surveillance framing. This creates a measurable

    intra-author temporal paradox that can be decomposed into legitimate and editorial

    components.

    '
  google_io_articles:
  - title: Here's Samsung and Google's Rival to Ray-Ban Meta Smart Glasses
    date: '2026-05-19'
    author: Raymond Wong
    url: https://gizmodo.com/heres-samsung-and-googles-rival-to-ray-ban-meta-smart-glasses-2000760595
    privacy_language_count: 0
    camera_framing: feature description — 'cameras on these smart glasses, computer vision will be on the table'
    headline_register: neutral_competitive
    notes: 'Samsung/Google cameras described as enabling "photo/video imports," "computer vision,"

      "translate text on menus." Zero privacy alarm. Zero surveillance vocabulary. Zero mention

      of bystander consent. Compare to Meta coverage where identical camera capabilities trigger

      "surveillance machine" and "privacy nightmare" language.

      '
  - title: Google Seems Pretty Scared of the Words 'Smart Glasses'
