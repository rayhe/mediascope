    author: Raymond Wong
    url: https://gizmodo.com/concerns-over-metas-smart-glasses-have-reached-the-u-s-senate-2000735746
    privacy_language_count: 6+
    headline_register: institutional_threat
    key_language:
    - existential threat to privacy
    - mass surveillance
    - civil liberties
  quantitative_summary:
    google_io_articles_analyzed: 6
    google_io_privacy_headlines: 0
    google_io_privacy_mentions_in_body: 1
    meta_articles_same_author_same_period: 3
    meta_privacy_headlines: 3
    meta_privacy_mentions_in_body: 15+
    camera_parity_explicitly_stated: true
    camera_parity_quote: they most certainly have cameras on them that can take pictures and videos—same as the Ray-Ban Meta
      AI glasses
  decomposition:
    legitimate_factors:
      incident_asymmetry: 'Meta has shipping products with documented privacy incidents (Svenska Dagbladet

        contractor footage, extortion cases, South Korea exam cheating). Google''s glasses

        haven''t shipped — no incidents to report. This creates a real information asymmetry

        that partially justifies different coverage depth.

        '
      data_practice_asymmetry: 'Meta explicitly trains AI on user-captured imagery ("Hey Meta" command data).

        Google has not yet stated its data policy for glasses imagery. Wong notes this:

        Google "could decide not to use videos and pictures to train AI as Meta has."

        This is a real difference — at the time of writing.

        '
      market_maturity: 'Meta has 7M+ pairs sold. Google''s are prototypes. Privacy harm requires scale

        — a prototype can''t generate the same volume of bystander exposure.

        '
    editorial_factors:
      headline_framing_gap: 'Even accounting for incident and data-practice differences, ZERO privacy headlines

        across 6 Google camera-glasses articles is noteworthy. Wong could have written

        "Google''s New Camera Glasses Raise Familiar Privacy Questions" — factually accurate,

        editorially neutral. Instead, headlines are about marketing strategy and product

        impressions. The editorial choice to reserve privacy-framing for Meta headlines

        while Google gets product-review headlines is not forced by the underlying facts.

        '
      google_glass_amnesia: 'Google Glass (2013) was THE original "Glasshole" privacy panic. Google''s return to

        camera glasses could trigger "Google Glass 2.0" framing — instead, Wong frames it

        as Google being "scared" (sympathetic) of the word "smart glasses." The privacy

        history is recontextualized as Google''s marketing challenge, not as an ongoing

        privacy threat.

        '
      source_ecosystem: 'Privacy advocacy organizations (EFF''s Thorin Klosowski quoted) target Meta

        specifically in their press outreach. These sources feed Meta-specific privacy

        articles. Google''s camera glasses haven''t triggered equivalent advocacy campaigns.

        '
      temporal_prediction: 'If Google ships camera glasses later in 2026, will Wong apply the same privacy

        language? If yes, the asymmetry was merely temporal. If no, even the clean control

        has structural editorial bias toward treating Meta as the primary camera-privacy threat.

        Wong''s track record (privacy notes for Apple, "stepped into a privacy minefield")

        suggests he WILL eventually apply scrutiny — making Gizmodo''s asymmetry temporal,

        unlike WIRED''s which appears structural.

        '
  cross_reference:
    wired_google_io_2026: 'WIRED sent 5 reporters to Google I/O 2026 and produced uniformly positive-neutral

      coverage of Google''s camera glasses (documented in wired.yaml google_io_2026_smart_glasses_coverage).

      WIRED has financial ties to Google (Google News Showcase, ad revenue). Gizmodo has NONE.

      Yet BOTH publications produced zero-privacy-alarm Google I/O coverage. This suggests

      the Google I/O framing pattern is industry-wide, not financial-incentive-specific.

      '
    barr_wong_divergence: 'Kyle Barr (Gizmodo staff writer) produces apocalyptic Meta framing (-0.65) with zero

      Google alarm. Wong produces balanced Meta framing (~-0.15) with zero Google alarm.

      The Google zero is consistent across both Gizmodo reporters, despite their divergent

      Meta tones. This reinforces that the Google-zero pattern is structural/temporal,

      not idiosyncratic to one journalist.

      '

