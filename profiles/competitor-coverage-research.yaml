          are applied ONLY to Meta. Competitor coverage uses wire-service factual reporting exclusively. The same reporter
          who creates fake 14-year-old accounts on Meta has never created fake accounts on YouTube, TikTok, or Snap to test
          comparable safeguards.

          '
        pattern_name: INVESTIGATIVE TECHNIQUE EXCLUSIVITY
        severity: 5
      - description: 'Both Meta ($4.2M) and YouTube ($1.8M) were found liable for 7 counts of child safety violations, but
          investigative series focuses exclusively on Meta. YouTube''s identical liability produces zero independent Horwitz
          investigation.

          '
