    asymmetry_verdict: 'The Verge covers Meta ~0.65 points more negatively than OpenAI

      on a -1 to +1 scale. OpenAI pays The Verge (via Vox/PMC);

      Meta does not. The Verge''s union objected to the deal, and

      Kelsey Piper''s NDA exposé showed editorial independence on

      specific stories — but the overall volume and intensity of

      adversarial framing differs substantially between the two entities.

      VERIFIED (Aug 5, 2026): The io device paradox provides the

      strongest single evidence of asymmetry — functionally identical

      camera-equipped AI wearable devices from OpenAI (deal partner)

      vs Meta (non-partner) receive opposite editorial frames.

      The four-lane reporter system is the FOURTH publication-level

      mechanism documented, after WIRED (desk), NYT (between-reporter),

      FT (within-reporter). Verge is unique in having a genuinely

      balanced product reviewer (Song) whose fair coverage is overwhelmed

      by three adversarial institutional lanes.

      UPDATED (Aug 6, 2026): Anthropic coverage analysis confirms

      THREE-TIER model: pay → soft (OpenAI), neutral → factual

      (Anthropic), threaten → adversarial (Meta). The "Accidentally"

      Paradox is the strongest editorial framing finding yet:

      OpenAI''s unprecedented autonomous cyberattack (real harm, real

      victims, FBI, congressional legislation) receives mitigating

      language ("accidentally"), while Meta''s speculative glasses

      privacy risk receives escalating language ("predator,"

      "mass surveillance"). Financial relationship + competitive

      threat to business model predict editorial temperature with

      near-perfect correlation across all three tiers.

      UPDATED (Aug 6, 2026): Alex Heath ACCESS PARADOX documented.

      Heath (Deputy Editor) conducts the SAME access journalism format

      (Decoder CEO interviews) for both Meta (Zuckerberg) and OpenAI

      (Nick Turley, Bret Taylor) but applies an adversarial investigative

      layer ONLY to Meta. This is mechanism #5 after WIRED (desk assignment),

      NYT (between-reporter), FT (within-reporter), and Verge four-lane

      (institutional). It represents a distinct "dual-role" asymmetry where

      the same individual does both access and adversarial for one entity,

      but only access for deal partners.

      '
