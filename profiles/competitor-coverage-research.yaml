aggregate_findings:
  bloomberg_parmy_olson:
    asymmetry_evidence:
      anthropic_loaded_words: []
      bloomberg_financial_ties: none_known
      meta_loaded_words:
      - bait
      - slop
      - failure club
      - groupthink
      - secret weapon
      openai_loaded_words:
      - nightmare
      personalization_delta_pp: 87.5
    book: 'Supremacy: AI, ChatGPT, and the Race that Will Change the World (2024)'
    finding_summary: 'Olson personalizes Meta coverage to "Zuckerberg"/"Mark Zuckerberg" in 87.5%

      of headlines (7 of 8 articles) while NEVER personalizing OpenAI to "Sam Altman"

      or Anthropic to "Dario Amodei" (0 of 6 combined). This is a documented

      persuasion technique: personalizing corporate actions to an individual triggers

      moral culpability attribution in readers. Meta headlines use emotionally loaded

      words ("bait," "slop," "failure club," "groupthink," "secret weapon") while

      OpenAI/Anthropic headlines use analytical framing ("risks," "pivot," "heat").

      '
    follower_framing_instances:
    - article: AI Failure Club
      phrase: chronic inability to develop an original idea
    - article: Groupthink Over AI Godfather
      phrase: scrambling to match OpenAI by cloning ChatGPT
    - article: Days of Giving Away AI for Free
      phrase: Llama is the flagship AI model Meta built to catch up with ChatGPT
    journalist: Parmy Olson
    key_finding: CEO personalization asymmetry
    mechanism: professional_identity_capture
    mechanism_explanation: 'Bloomberg has NO known AI content licensing deals with OpenAI, Google, Amazon,

      or Anthropic. The asymmetry stems from Olson''s book "Supremacy" centering the

      OpenAI-DeepMind rivalry as the defining AI narrative. Meta''s emergence as a

      major AI player threatens both the commercial viability of this thesis and

      Olson''s professional identity as its chronicler. This is a new asymmetry

      mechanism distinct from publication-level financial incentives.

      '
    personalization_rates:
      anthropic: 0%
      google: 0%
      meta: 87.5%
      openai: 0%
    publication: Bloomberg Opinion
    role: AI Columnist
    source_urls:
    - https://news.bloomberglaw.com/author/parmy-olson-22420307
    - https://booktrib.com/2025/05/03/supremacy-parmy-olson/
    test_count: 35
    test_file: tests/test_parmy_olson_cross_entity.py
    tone_delta_meta_vs_openai: 0.4
    tone_scores:
      anthropic_average: 0.15
      google_average: -0.35
      meta_average: -0.51
      openai_average: -0.11
  chokkattu_temporal_framing_oscillation:
    confounding_factors:
    - Product announcements are inherently more neutral than analysis pieces
    - Podcast format encourages more opinionated takes
    - The subscription article addresses a genuinely controversial pricing change
    - Editorial analysis is supposed to be more critical than product coverage
    - Meta has more legacy privacy controversies than Google or Snap
    cross_publication_convergence:
      gizmodo_owner: Keleops AG
      pattern_match: true
      significance: Same pattern at two publications with different ownership eliminates publisher-specific explanation
      wired_owner: Condé Nast (Advance Publications)
    finding_summary: 'Within a single 30-day window (Jun 3 – Jul 2, 2026), Chokkattu published Meta smart glasses content
      in three genres with dramatically different framing: adversarial podcast (-0.85/-0.90 tone with "mass surveillance,"
      "I''m a Creep"), balanced product announcement (-0.05 tone, feature-focused Starfire/Adventurer/Fury launch), and adversarial
      editorial analysis (-0.65 tone, "extracting value," "monetizing customers"). Same journalist, same product, same month
      — framing determined by GENRE. This matches Mechanism #31 (Pero at Gizmodo) across a different publication with different
      ownership, establishing genre-determined framing as an industry-wide pattern rather than a publisher-specific directive.
      During the same window, competitors (Google I/O cameras May 19, Snap 4 cameras Jun 16) received exclusively enthusiastic/neutral
      coverage — zero surveillance vocabulary regardless of genre.'
    genre_split_delta: 0.85
    journalist: Julian Chokkattu
    key_finding: Same-journalist temporal oscillation between adversarial and balanced framing
    mechanism: genre_determined_framing_direction
    mechanism_id: 30
    publication: WIRED (Condé Nast)
    source_urls:
    - https://biztoc.com/x/65c250c5f0d223b2
    - https://news.slashdot.org/story/26/07/02/182227/meta-is-charging-a-subscription-for-smart-glasses-features
    test_count: 30
    test_file: tests/test_chokkattu_temporal_framing_oscillation_aug10.py
    tone_scores:
      google_podcast: 0.05
      meta_editorial_analysis: -0.65
      meta_podcast_average: -0.875
      meta_product_article: -0.05
  confounding_factors:
  - Meta has genuinely more privacy and child safety issues in 2025-2026 than OpenAI
  - Editorial culture and journalist specialization affect tone independently of financial ties
  - Some adversarial coverage predates licensing deals
  - OpenAI is newer and has less historical baggage for adversarial framing
  - Google's objectively greater financial harm to publishers (ad revenue suppression, AI Overviews traffic cannibalization,
    active adtech antitrust litigation) should predict even MORE adversarial Google coverage — yet Meta receives more. This
    WEAKENS the 'Meta deserves it' confound.
  - Advance Publications dual-asset conflict (Reddit 23.3% + Condé Nast wholly owned) means WIRED's parent structure profits
    from BOTH user-generated AND professional content licensing to AI companies, making AI-must-pay editorial coverage structurally
    aligned with Advance's financial interests across two subsidiaries simultaneously
  evidence_strength: STRONG
  gizmodo_james_pero_editorial_direction_override:
    confounding_factors:
    - Meta 69% market share makes it natural focus of scrutiny
    - Meta has genuine privacy incidents (Kenya contractors)
    - Editorial assignment is normal journalism
    - Genre conventions differ between reviews and analysis pieces
    - Pero may coherently believe Meta hardware is good but Meta behavior is problematic
    finding_summary: 'Mechanism #31: Editorial Direction Override. James Pero demonstrates a measurable genre split in Meta
      coverage: PRODUCT REVIEWS are balanced-to-positive (tone +0.10, Neural Band groundbreaking, affiliate links to Amazon/Best
      Buy), while EDITORIAL/ANALYSIS pieces are adversarial (tone -0.40, competitors as privacy heroes, section titled The
      anti-Meta plan). Same journalist, same publication, same topic, but genre determines framing direction. Samsung/Google
      build identical 12MP camera glasses sending data to Google Gemini but receive ZERO surveillance framing. Apple, building
      rumored camera glasses, is described as having often made privacy the core of its products. Distinct from Kyle Barr
      Privacy Gradient (personal differential), Lauren Goode Lane Assignment (beat segregation), and Paresh Dave Emotional
      Register (vocabulary escalation). Pero review ↔ editorial split isolates the EDITORIAL LAYER as the source of differential
      framing — the journalist personally likes Meta hardware but produces adversarial editorials about Meta as a company.'
    genre_split_delta: 0.5
    journalist: James Pero
    key_finding: Genre-dependent Meta framing (review=positive, editorial=adversarial)
    mechanism: editorial_direction_override
    mechanism_id: 31
    publication: Gizmodo (Keleops AG / G/O Media successor)
    role: Senior Editor, Consumer Tech — self-described smart glasses specialist
    source_urls:
    - https://gizmodo.com/can-smart-glasses-ever-be-privacy-friendly-these-companies-think-so-2000746927
    - https://gizmodo.com/we-need-to-talk-about-smart-glasses-2000661487
    - https://gizmodo.com/smart-glasses-are-forcing-wearables-to-get-very-weird-2000674309
    - https://gizmodo.com/the-viral-smart-glasses-sniffing-app-is-informative-but-anticlimactic-2000794504
    test_count: 41
    test_file: tests/test_james_pero_cross_entity.py
    tone_scores:
      apple_coverage: 0.05
      google_coverage: -0.05
      meta_editorial: -0.4
      meta_product_review: 0.1
  hypothesis: 'Publications that receive AI licensing revenue from a company

    cover that company measurably more favorably than companies that

    do not pay them.

    '
  key_evidence:
  - description: 'WIRED covers Meta at ~-0.85 tone (sustained investigative campaigns)

      but covers OpenAI at ~+0.10 (balanced). OpenAI pays WIRED via Condé

      Nast; Meta does not. Gap: ~0.95 points.

      '
    finding: WIRED Meta-vs-OpenAI gap
    significance: The largest single asymmetry in the dataset
  - description: 'NYT covers Amazon (licensing partner, $20-25M/yr) at neutral-to-

      positive tone, but covers OpenAI (lawsuit target, suing for billions)

      adversarially. Both companies do the same thing — train AI on

      publisher content. The ONLY difference is who pays.

      '
    finding: NYT Amazon-vs-OpenAI natural experiment
    significance: Cleanest natural experiment — same publisher, same issue, opposite financial relationships, opposite coverage
      tones
  - description: 'News Corp receives comparable payments from both OpenAI ($50M/yr)

      and Meta ($50M/yr). Coverage of both is balanced. Equal financial

      incentive → equal coverage.

      '
    finding: News Corp balanced control
    significance: Controls for editorial culture and proves financial incentive is the differentiating variable
  - description: 'Gizmodo has NO financial ties to any entity. Covers both Meta

      AND OpenAI critically. Proves that differential treatment is not

      universal editorial pattern — it''s specific to publications with

      financial ties.

      '
    finding: Gizmodo clean control
    significance: Rules out 'all tech publications are soft on OpenAI' alternative hypothesis
  - description: 'Owner (LPJ Trust) holds ~$17B in Apple stock. Apple coverage

      is positive, Meta coverage is adversarial. Never disclosed.

      '
    finding: The Atlantic Apple conflict
    significance: Largest undisclosed ownership-chain financial conflict in the dataset
  - description: 'WSJ (News Corp) is the ONLY publication in the dataset that

      consistently discloses its financial relationships with covered

      entities. WSJ disclosed its Meta deal in Meta earnings coverage

      and its OpenAI deal in OpenAI rogue agent coverage. No other

      profiled publication — WIRED, The Verge, FT, The Atlantic,

      The Guardian, MIT TR — discloses its OpenAI, Amazon, Microsoft,

      or Apple financial relationships in coverage of those entities.

      The publication with symmetric deals and disclosure shows balanced

      coverage; publications with asymmetric deals and no disclosure

      show asymmetric coverage. Disclosure and balance correlate.

      '
    finding: WSJ disclosure vs industry non-disclosure
    significance: 'Creates a transparency dimension: balanced deals + disclosure = balanced coverage; asymmetric deals + no
      disclosure = asymmetric coverage'
  - description: 'Amazon has SIX financial relationship mechanisms with publishers

      (cloud hosting, advertising, AI licensing, Kindle platform, Bezos/

      WaPo ownership, Anthropic investment). Meta has ONE (AI licensing).

      Amazon''s Anthropic investment ($53.4B Q2 gain) makes Amazon the

      largest backer of an AI lab with ZERO publisher deals. Yet

      publications with Amazon deals (NYT $20-25M/yr, Condé Nast Rufus)

      cover Amazon neutrally while covering Meta adversarially.

      '
    finding: Amazon sextuple leverage vs Meta single layer
    significance: Demonstrates leverage-count asymmetry — the company with 6x more publisher leverage gets softer coverage
      than the company with 1x
  - description: 'Apple has FIVE distinct financial leverage mechanisms over publishers:

      (1) Apple News+ platform (50% of $12.99/mo subscription revenue,

      400+ titles, 125M MAU), (2) App Store subscription tax (15-30%),

      (3) Apple One bundle revenue dilution, (4) Content distribution

      monopoly (2.5B devices, News preinstalled), (5) AI content bypass

      ($0 to publishers, $1B/yr to Google for Gemini). Apple is the

      THIRD most entangled entity after Microsoft (7) and Amazon (6).

      THE LIFELINE PARADOX: As Google/Meta referral traffic collapses,

      publishers are INCREASING dependency on Apple News+ — The

      Atlantic''s CGO called it "by far the most valuable syndication

      partner," Semafor reported it as a "lifeline." Publishers cannot

      criticize the platform they depend on. Condé Nast (WIRED parent)

      gives Apple 50% of News+ revenue across 16 titles AND gets $0

      for Apple''s AI pipeline — yet directs adversarial coverage at Meta,

      not Apple. FT is the ONLY profiled publication not on Apple News+.

      Apple Q3 FY26: $30.7B Services revenue, 1.5B paid subscriptions,

      2.5B active devices.

      '
    finding: Apple quintuple publisher leverage (Aug 7)
    significance: Completes the leverage hierarchy — Microsoft (7) > Amazon (6) > Apple (5) > Google (4) > Meta (1). The company
      with the FEWEST leverage mechanisms receives the MOST adversarial coverage.
  - description: 'In January 2026, Advance Publications (WIRED/Condé Nast parent),

      Vox Media (The Verge parent), The Atlantic, and PMC/Penske ALL

      sued Google in SDNY for adtech antitrust violations — consolidated

      into MDL with Gannett, Business Insider, Slate, and others.

      Claims: Google suppressed publisher ad clearing prices by ~40%,

      extracting ~$30B/yr in monopoly profits through "deceptive and

      manipulative" auction practices. This means 3 of our 7 profiled

      publications'' parent companies are in ACTIVE LITIGATION against

      Google. Yet these same publications'' adversarial coverage of Meta

      is measurably MORE INTENSE than their coverage of Google, despite

      Google''s objectively greater financial harm (ad revenue suppression,

      traffic cannibalization via AI Overviews, AND active lawsuit).

      The asymmetry is explained by the licensing hypothesis: OpenAI

      pays all three publishers; Meta pays none. Google''s adversarial

      relationship should produce MAXIMUM adversarial coverage, but

      Meta receives more. The variable is that Meta competitors

      (OpenAI, Amazon, Apple) pay these publishers, creating an

      incentive to frame AI concerns as specifically a META problem

      rather than an industry-wide one.

      '
    finding: January 2026 publisher adtech lawsuits — Google as universal adversary
    significance: Proves that financial adversarial relationship alone does not predict maximum adversarial coverage — coverage
      intensity correlates with the ABSENCE of compensating financial ties, not the PRESENCE of adversarial ones
    source_urls:
    - https://digiday.com/media/a-running-list-of-publisher-lawsuits-targeting-googles-ad-tech-practices/
    - https://news.bloombergtax.com/esg/googles-ad-tech-litigation-defense-grows-as-publishers-pile-on
  - description: 'Meta entered the AI content licensing market:

      Dec 2025: CNN, Fox News, Fox Sports, Le Monde, People Inc,

      Daily Caller, Washington Examiner, USA Today, USA Today Network.

      Mar 2026: News Corp ($50M/yr for 3+ years).

      Also signed with Reuters.

      NOTABLE: Condé Nast (WIRED parent) was EXCLUDED from all rounds.

      Meta now pays ~10+ publishers while Condé Nast gets $0. This

      DEEPENS the financial exclusion incentive: WIRED''s parent watches

      its competitors earn AI licensing revenue from Meta while it earns

      nothing. Publishers receiving Meta money (News Corp, CNN, People Inc)

      show measurably softer Meta coverage than those excluded (Condé Nast,

      Vox Media).

      '
    finding: Meta's expanding publisher deal landscape (Dec 2025 - Mar 2026)
    significance: Meta's market entry creates a new control variable — publications receiving Meta money vs those excluded
    source_urls:
    - https://pressgazette.co.uk/platforms/news-publisher-ai-deals-lawsuits-openai-google/
    - https://digiday.com/media/meta-enters-ai-licensing-fray-striking-deals-people-inc-usa-today/
  - description: 'Google told publishers joining its "News AI pilot" that they

      must also grant broad rights to use content for AI model training.

      Publishers who refuse lose their existing Google News Showcase

      annual fees. This is the only COERCIVE deal structure in the

      dataset — all other deals (OpenAI, Amazon, Meta, Microsoft)

      are voluntary licensing. Creates a dynamic where Google''s

      publisher relationships are tinged with resentment, which

      should predict adversarial coverage of Google.

      '
    finding: Google's coercive 'AI or lose fees' program (Jun 2026)
    significance: Unique coercive structure — no other entity threatens to withdraw existing payments if publishers refuse
      AI rights
    source_url: https://www.pymnts.com/news/artificial-intelligence/2026/google-tells-news-publishers-to-share-content-for-ai-training-or-lose-fees/
  - description: 'Anthropic agreed to pay $1.5B to settle copyright class action

      over downloading pirated book libraries (~500K registered works,

      ~$3K each). Judge Alsup granted preliminary approval Jul 2026.

      Anthropic has NO publisher content licensing deals. Its only

      publisher relationships are adversarial (Reddit sued in Jun 2025,

      music publishers lawsuit settled). This makes Anthropic the only

      major AI company paying publishers exclusively through legal

      settlements rather than voluntary licensing.

      '
    finding: Anthropic's distinct relationship type — litigation settlement, not licensing
    significance: 'Creates a natural experiment: does paying publishers through settlements produce the same coverage softening
      as voluntary licensing?'
    source_urls:
    - https://news.bloomberglaw.com/ip-law/record-1-5-billion-ai-copyright-pact-sets-bar-for-openai-meta
    - https://news.bloomberglaw.com/ip-law/judge-blesses-1-5-billion-anthropic-copyright-deal-with-authors
  - description: 'Microsoft launched the Publisher Content Marketplace (Feb 2026) —

      the first MARKETPLACE model for AI content licensing, replacing

      bilateral deals with a centralized platform. First-wave pilot

      partners include Condé Nast, Vox Media, Hearst, AP, USA Today,

      and Business Insider. Yahoo is the first demand partner (AI builder).

      Meta is NOT a PCM participant — neither as a publisher partner nor

      as a demand partner. This means both Condé Nast (WIRED) and Vox

      Media (The Verge) earn Microsoft PCM revenue while receiving $0

      from Meta. The marketplace model also enables future AI builders

      to license content without bilateral negotiations — amplifying

      Meta''s exclusion as the ecosystem grows. PCM was co-designed with

      publishers at Microsoft''s invite-only Partner Summit in Monaco.

      '
    finding: Microsoft PCM marketplace creates structural Meta exclusion (Feb 2026)
    significance: Marketplace model scales Meta's exclusion — every new PCM demand partner is another AI company paying WIRED's
      parent while Meta doesn't
    source_urls:
    - https://www.WebWire.com/ViewPressRel.asp?aId=350303
    - https://searchengineland.com/microsoft-launches-publisher-content-marketplace-for-ai-licensing-468191
    - https://digiday.com/media/qa-nikhil-kolar-vp-microsoft-ai-scales-its-click-to-sign-ai-content-marketplace/
  - description: 'As of Aug 2026, Condé Nast has AI content deals with OpenAI

      (Aug 2024), Amazon/Rufus (Jul 2025), Perplexity (Dec 2025),

      Microsoft PCM (Feb 2026), and Apple (negotiating since Dec 2023).

      This is FIVE AI licensing relationships — the most of any

      publisher in the dataset. Meta remains the only major tech

      company with ZERO Condé Nast deal AND no deal in progress.

      Each new deal deepens the financial exclusion: Condé Nast''s

      AI licensing revenue grows while the Meta gap widens.

      '
    finding: Condé Nast's deal asymmetry deepens — 5 partners, 0 Meta
    significance: The sheer number of deals makes Meta's absence more conspicuous and the financial incentive stronger
    source_urls:
    - https://www.adweek.com/media/conde-nast-vasanth-williams-chief-product-technology-officer-microsoft-ai-licensing-pilot/
    - https://www.reuters.com/technology/apple-explores-ai-deals-with-news-publishers-new-york-times-2023-12-22/
  - description: 'FT now has financial ties with three AI companies:

      OpenAI (licensing, $5-10M/yr, Apr 2024), Google (News AI pilot,

      Feb 2026), and ProRata.ai (content licensing). FT is one of the

      few publications in the dataset with deals across multiple

      AI search competitors — while having zero Meta deal. Coverage

      pattern matches: Meta (no deal) gets balanced-adversarial

      treatment with sustained investigative reporting; OpenAI (deal)

      gets neutral-to-positive with preferential access for scoops;

      Google (new deal) getting measurably less adversarial framing

      than Meta despite comparable or greater privacy concerns.

      '
    finding: FT's expanded deal portfolio — OpenAI + Google + ProRata, no Meta
    significance: FT's three-deal portfolio vs zero Meta deal is the most lopsided financial relationship set for any 'respectable'
      business publication
    source_urls:
    - https://pressgazette.co.uk/platforms/news-publisher-ai-deals-lawsuits-openai-google/
    - https://www.reuters.com/technology/financial-times-openai-sign-content-licensing-partnership-2024-04-29/
  - description: 'Publishers'' own antitrust lawsuit filings (SDNY, Jan 2026) reveal a

      structural paradox: publishers are suing Google for suppressing ad

      revenue while simultaneously admitting TOTAL DEPENDENCY on Google''s

      ad exchange (AdX) for their financial survival. Key admissions under

      oath in federal complaints:


      Vox Media (The Verge parent, now PMC): "relies on digital advertising

      for well over half of its revenue" and "any revenue generated from

      subscriptions and other non-advertising sources could not, alone, fund

      the volume and breadth of Vox Media''s high-quality content."


      The Atlantic: "cannot forgo the significant revenue it earns from the

      Google Ads demand available only through AdX" and "The Atlantic does

      not have an alternative way to access advertising spending from the

      long tail of small- or medium-sized advertisers."


      Advance Publications (Condé Nast/WIRED parent): "Advance has relied

      on digital advertising for a significant percentage of its revenues"

      and has "not shared equally with Google in this massive digital

      advertising market."


      This creates a THREE-LAYER Google financial relationship for

      WIRED, The Verge, and The Atlantic:

      (1) ADVERSARIAL LITIGATION — actively suing for damages

      (2) ESSENTIAL DEPENDENCY — cannot survive without Google AdX revenue

      (3) COERCIVE — Google threatens to withdraw News Showcase fees if

      publishers refuse AI training rights (News AI pilot, Jun 2026)


      Despite this triple-adversarial Google relationship, these same

      publications cover META more adversarially than Google. The

      explanation: dependency creates reluctance to push too hard on

      Google (burning the lifeline), while Meta''s competitors (OpenAI,

      Amazon, Apple, Microsoft) pay these publishers via AI licensing,

      creating incentive to frame AI/privacy concerns as META-specific

      rather than industry-wide.

      '
    finding: Google ad revenue dependency paradox — publishers suing their lifeline
    significance: Publisher lawsuit self-admissions prove Google advertising dependency, explaining why triple-adversarial
      Google relationship still produces less adversarial Google coverage than Meta coverage — dependency creates editorial
      restraint
    source_urls:
    - https://digiday.com/media/a-running-list-of-publisher-lawsuits-targeting-googles-ad-tech-practices/
    - https://ppc.land/content/files/2026/01/1768500307197.pdf
    - https://news.bloombergtax.com/esg/googles-ad-tech-litigation-defense-grows-as-publishers-pile-on
  - description: 'Digiday''s Dec 2025 publisher scorecard for Big Tech AI licensing:

      Google: 2/10 aggregate (willingness to pay 2/10, transparency 2/10,

      traffic impact 1/10, AI crawler behavior 3/10). Amazon: 6/10

      aggregate (13+ licensing partners, 200+ claimed deals, no lawsuits).

      OpenAI: not scored separately but described as having the most

      publisher deals. This quantifies the industry perception gap:

      Google is viewed as the worst partner despite having the largest

      existing commercial relationships (3,000+ News Showcase partners).

      '
    finding: The Atlantic's Apple News+ revenue dependency — second Apple financial link
    significance: Industry perception data supporting differential coverage predictions
    source_url: https://digiday.com/media/publishers-scorecard-for-big-techs-ai-licensing-deals/
    source_urls:
    - https://digiday.com/media/media-briefing-publishers-see-apple-news-as-a-stable-revenue-stream-amid-volatile-referral-traffic/
    - https://www.fool.com/investing/2019/07/01/apple-news-is-already-hitting-a-roadblock.aspx
  last_updated: '2026-08-05T12:00:00-07:00'
  methodology_limitations:
  - Tone scores are estimated from qualitative assessment, not systematic NLP measurement
  - Sample sizes per publication×entity pair are small (5-20 articles each)
  - Cannot fully control for newsworthiness of events driving coverage
  - Financial deal values are often undisclosed; estimates vary
  - Meta's Dec 2025 / Mar 2026 publisher deals may shift coverage tone at those publications over time — need longitudinal
    tracking
  - Anthropic's $1.5B settlement is a distinct financial relationship type whose coverage effects have not been measured
  reuters_jeff_horwitz:
    beat: tech investigations / Meta accountability
    career_trajectory:
    - key_work: Facebook Files (2021) — 20K+ internal documents, XCheck, teen mental health, human trafficking
      outlet: Wall Street Journal
      role: Technology reporter / investigations
      years: 2014-2024
    - key_work: Meta scam ads, AI chatbots and children, Instagram eating disorders
