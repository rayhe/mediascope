    underwriter_banks:
      - name: "Goldman Sachs"
        anthropic_roles:
          - ipo_underwriter
          - enterprise_customer
          - publisher_advertiser
        enterprise_claude_deployment:
          embedded_anthropic_engineers: true
          executive_on_record: "Marco Argenti (CIO)"
          announcement_date: "2026-02-06"
          use_cases:
