      By quantifying actual SEC-filed revenue from AI licensing, it demonstrates that (a) AI deals are crossing the financial
      materiality threshold at $40-50M/quarter, (b) the most transparent publishers about AI revenue have the softest Meta
      coverage, and (c) the publisher with the most adversarial Meta coverage (WIRED/Condé Nast) is structurally shielded
      from financial scrutiny by its private ownership through Advance Publications.

      '
    methodology: 'Revenue figures sourced from SEC 10-Q/10-K filings and earnings call transcripts for public publishers.
      Private publisher data from press releases, Adweek reporting, and CEO memos only. Dollar values are as reported; estimates
      annotated. All sources verified against primary filings where available.

