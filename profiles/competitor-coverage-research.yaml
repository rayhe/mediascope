      packed consumer wearable ever produced. Apple smart glasses plans
      (cameras + AI) receive neutral/aspirational framing.
      
      GOVERNANCE CONFLICT — KATE BERGERON (effective Jul 1, 2026):
      Kate A. Bergeron ('93, MBA '13), VP of Hardware Engineering at Apple,
      was elected as an MIT Corporation TERM MEMBER effective July 1, 2026.
      The MIT Corporation is MIT's highest governing body — its board of
      trustees. Bergeron joined Apple in 2002, VP since 2014, responsible
