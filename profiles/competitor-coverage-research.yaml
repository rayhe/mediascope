        zero search traffic" directly in his Pichai Decoder interview (May 2026).

        Zuckerberg''s "overestimate the value" comment about publisher content

        (reported by Heath/Robertson) positions Meta as adversarial to publishers.

        The company that dismisses publisher content value gets the adversarial

        deputy; companies that pay publishers get the constructive EIC.


        This is mechanism #6 after: (1) WIRED desk assignment, (2) NYT between-

        reporter, (3) FT within-reporter, (4) Verge four-lane, (5) Verge Access

        Paradox (Heath). It is distinct from #5 because it operates at the EIC

        level — determining which CEO gets the EDITOR-IN-CHIEF''s personal

        attention vs which gets the deputy''s investigative lens.

        '
