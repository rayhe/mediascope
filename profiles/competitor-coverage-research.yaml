  wsj_georgia_wells_editorial_independence_control:
    date_added: 2026-08-10
    finding_summary: 'Mechanism #32 — Disclosure-Correlated Editorial Independence Control Case. Georgia Wells covers BOTH
      OpenAI governance/regulation AND Meta business AI, making her a dual-beat cross-entity control case. Despite News Corp''s
      $250M+ content licensing deal with OpenAI, Wells co-authored adversarial OpenAI coverage: (1) "OpenAI Investigated by
      Coalition of State Attorneys General" (Jun 13, with Keach Hagey) — regulatory enforcement framing; (2) "Rogue AI Hacks
      Herald New Era of Cyber Chaos" (Aug 2, with McMillan + Ramkumar) — dramatic headline with best-in-class financial disclosure.
      Her Meta coverage ("Zuckerberg Wants Meta''s New AI Agents to Run Your Whole Business," Jun 3) uses neutral business-reporting
      register. The editorial register difference is explained by story TYPE (regulatory enforcement vs business expansion),
      NOT the financial relationship. This is a POSITIVE CONTROL: the WSJ''s consistent disclosure practice (noting News Corp
      licensing deals) correlates with more balanced cross-entity coverage than publications without disclosures (WIRED 0.95
      tone gap, Guardian 0.80+ gap).

      '
    implication: 'Financial relationships do NOT uniformly predict softer coverage. The WSJ demonstrates that consistent financial
      disclosure functions as an editorial accountability mechanism that REDUCES coverage asymmetry. Publications that disclose
      (WSJ) show weaker financial-coverage correlation than publications that don''t (WIRED, Guardian). This suggests the
      MediaScope hypothesis should be refined: financial relationships predict SOFTER coverage PRIMARILY when the relationship
      is UNDISCLOSED to readers.

      '
