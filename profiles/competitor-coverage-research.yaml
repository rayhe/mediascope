    # Reporter-level cross-entity analysis (added 2026-08-05)
    cross_entity_beat_assignment:
      finding: |
        NYT's Meta bias operates through REPORTER ASSIGNMENT, not individual
        journalist framing. Cade Metz (AI industry reporter, "Genius Makers"
        author) covers OpenAI and Anthropic with technology-progress framing.
        Meta's AI coverage is handled by adversarial beat reporters Mike Isaac
        (12+ years, "Super Pumped"), Eli Tan (new 2026), and Sheera Frenkel
        ("An Ugly Truth"). The same event type receives different framing
        depending on which reporter is assigned:
        - OpenAI restructuring (Metz) → business narrative
        - Meta AI restructuring (Isaac/Tan, Aug 2025) → "Zuckerberg Shakes Up
          Meta's A.I. Efforts, Again" — turmoil, internal tensions, departures
        Metz's 2025-2026 portfolio has ZERO standalone Meta AI articles.
        His only Meta-adjacent piece was a five-byline data harvesting
        investigation (Apr 2024) covering Meta, OpenAI, and Google collectively.
      metz_openai_examples:
        - title: "OpenAI Close to Landing $500 Billion Data Center"
          tone: +0.15
          framing: "ambition, scale, business milestone"
        - title: "OpenAI Releases New, More Powerful A.I. Model"
          tone: +0.10
          framing: "technology advancement, competition"
        - title: "OpenAI Files to Go Public"
          tone: +0.05
          framing: "business milestone, industry maturation"
      isaac_meta_examples:
        - title: "Mark Zuckerberg Shakes Up Meta's A.I. Efforts, Again"
          date: "2025-08-19"
          tone: -0.35
          framing: "internal turmoil, personnel churn, executive departures, 'compound internal turmoil'"
          source_url: "https://web.archive.org/web/20250823090419/https://www.nytimes.com/2025/08/19/technology/mark-zuckerberg-meta-ai.html"
          notes: >
            Framing elements: 'shakes up...again', 'compound internal turmoil',
            'tensions have surfaced', old guard 'chafed', Zhao 'questioned them
            about their past work while interviewing them for new roles'. Same
            type of corporate restructuring that Metz covers for OpenAI as a
            business pivot, Isaac frames as organizational dysfunction.
      analytical_significance: |
        This beat-assignment mechanism is distinct from WIRED's model. WIRED
        assigns different editorial desks (product review vs investigative)
        to different companies. NYT assigns different REPORTERS with different
        source networks and narrative instincts. Isaac and Frenkel have 12+
        years of adversarial Meta sourcing; Metz has technology-progress sourcing
        in the OpenAI/Anthropic orbit. The reporters' entire career trajectories
        produce different narrative frames, making the bias structural and
        nearly invisible — it looks like each reporter is just "doing their beat."

    # Kashmir Hill cross-entity coverage analysis (added 2026-08-06)
    kashmir_hill_cross_entity:
      overview: |
        Kashmir Hill is the NYT's most credentialed privacy/surveillance
        reporter (Clearview AI investigation, "Your Face Belongs to Us" book).
        Her beat — facial recognition, biometrics, tech surveillance — makes
        her the natural investigator for ALL companies building camera-equipped
        wearables, facial recognition, and surveillance technology. Analysis
        of her coverage portfolio reveals extreme concentration on Meta, with
        ZERO comparable investigations of Google, Amazon, Apple, or OpenAI
        despite each having equivalent or worse privacy practices in the same
        domain she covers.
      meta_investigation:
        article: "Meta Plans Facial Recognition Feature for Ray-Ban Smart Glasses"
        date: "2026-02-13"
        co_byline: "Kalley Huang, Mike Isaac"
        tone: -0.8
        framing: |
          Investigative exposé using leaked internal Meta document. Lead with
          cynical political timing quote about launching during "dynamic political
          environment." Frames Meta as knowingly exploiting distraction to deploy
          surveillance tech. Triggered legislative response (Senators Wyden,
          Merkley, Markey letter to Zuckerberg). Became foundation for WIRED's
          June 2026 NameTag code investigation.
        source_url: "https://www.macrumors.com/2026/02/13/meta-facial-recognition-smart-glasses/"
      google_absence:
        coverage: "zero Hill bylines on Google Android XR privacy"
        parallel: |
          Google launched Android XR smart glasses (I/O 2026, May 19) with
          cameras, microphones, and always-on Gemini AI — functionally identical
          privacy architecture to Meta Ray-Ban glasses. In Hill's own book she
          documented that BOTH Google and Facebook chose not to deploy facial
          recognition in 2017. Meta's reversal triggered Hill's investigation.
          Google's entry into the same space received no comparable treatment.
        source_url: "http://www.techtimes.com/articles/316697/20260515/google-brings-android-xr-glasses-i-o-2026-smart-glasses-face-privacy-reckoning.htm"
      amazon_absence:
        coverage: "zero Hill bylines on Ring facial recognition"
        parallel: |
          Amazon Ring's Familiar Faces feature performs DEPLOYED consumer-facing
          facial recognition — identifying people at doorbell cameras without
          their consent. Ring's record is objectively worse than Meta's:
          FTC $5.8M settlement (2023, employee spying in bedrooms), law
          enforcement partnerships without user consent, class action lawsuit
          (Sigwalt v. Amazon, June 2026). Senator Markey: "privacy nightmare."
          Unlike Meta's Name Tag (unreleased code), Ring's facial recognition
          IS LIVE AND IN USE on millions of cameras.
        financial_context: "Amazon pays NYT $20-25M/yr in AI content licensing (May 2025)"
        beat_separation: "Karen Weise covers Amazon from Seattle — Hill's privacy expertise never crosses into Amazon's surveillance products"
        source_urls:
          - "https://www.reuters.com/legal/government/amazons-ring-sued-over-facial-recognition-feature-latest-privacy-concern-2026-06-02/"
          - "https://www.ftc.gov/business-guidance/blog/2023/06/hey-alexa-what-are-you-doing-my-data"
          - "https://www.markey.senate.gov/news/press-releases/just-in-time-for-holiday-deliveries-sen-markeys-probe-exposes-amazons-alarming-privacy-violations-with-facial-recognition-technology-in-ring-doorbell"
      apple_absence:
        coverage: "zero Hill bylines on Apple wearable surveillance"
        parallel: |
          Apple Vision Pro has external cameras, 3D spatial mapping, biometric
          sensors. Apple AirTags documented as stalking tools. Apple's smart
          glasses (delayed to 2027) will have cameras. Apple's privacy reputation
          acts as a shield — coverage frames Apple privacy as virtue, not target.
        source_url: "https://www.androidauthority.com/apple-smart-glasses-privacy-features-3691349/"
      openai_absence:
        coverage: "zero Hill bylines on OpenAI data scraping as privacy story"
        parallel: |
          OpenAI scraped billions of web pages including personal data without
          consent — directly analogous to Clearview AI's scraping that Hill
          exposed. Both cases: mass data collection without consent, building
          AI on scraped personal data, retroactive justification. NYT's OpenAI
          coverage channeled through legal reporters (copyright lawsuit) rather
          than privacy reporters, inadvertently shielding OpenAI from Hill's
          investigative treatment.
      asymmetry_mechanism: |
        Kashmir Hill's coverage gap is a BEAT ASSIGNMENT EFFECT, not personal
        bias. NYT's organizational structure channels her investigative privacy
        expertise exclusively toward Meta (no financial tie), while companies
        with worse privacy records and financial ties to NYT (Amazon: $20-25M/yr)
        are covered by different reporters who don't apply investigative privacy
        framing. This creates an ASYMMETRIC PRIVACY RATCHET: the NYT's most
        skilled privacy investigator targets only the company that pays them
        nothing, while the company paying them the most ($20-25M) has its
        comparable surveillance products covered by a non-privacy-specialist
        reporter from a different bureau.

        This finding reinforces the Cade Metz beat-assignment finding: NYT's
        coverage asymmetry is structural and nearly invisible, operating through
        reporter assignment rather than editorial directives.

    february_2026_simultaneous_coverage_paradox:
      summary: |
        Within 5 days (Feb 9-13, 2026), the NYT published Kashmir Hill's
        investigative exposé on Meta's UNRELEASED NameTag facial recognition
        while covering Amazon Ring's DEPLOYED Familiar Faces surveillance
        backlash (Super Bowl ad, 127M viewers, national outrage) as a
        consumer/business story. Ring's facial recognition was LIVE on
        millions of cameras with a worse privacy record (FTC $5.8M settlement,
        employee spying, class action). Meta's NameTag was unreleased code
        that never shipped. The NYT's $20-25M/yr Amazon AI licensing deal
        was active throughout this period.
      meta_article_date: "2026-02-13"
      meta_article_reporters: "Kashmir Hill, Kalley Huang, Mike Isaac"
      meta_article_tone: -0.80
      ring_superbowl_date: "2026-02-09"
      ring_coverage_tone: -0.15
      tone_delta: 0.65
      significance: |
        Strongest single-week test of the financial-relationship hypothesis
        in the entire dataset: same publication, same week, same topic
        (facial recognition in consumer electronics), different companies
        (Amazon paying $20-25M/yr, Meta paying $0). Investigative treatment
        for the non-paying company; business coverage for the paying company.
      source_urls:
        - "https://www.macrumors.com/2026/02/13/meta-facial-recognition-smart-glasses/"
        - "https://www.mediapost.com/publications/article/412823/amazons-ring-cancels-partnership-with-police-tech.html"
        - "https://9to5mac.com/2026/02/19/leaked-email-proves-ring-intended-to-use-surveillance-feature-for-people/"

