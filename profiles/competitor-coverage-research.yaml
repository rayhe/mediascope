            - "Client due diligence and onboarding"
            - "Autonomous AI coding (Devin tool)"
            - "Compliance and regulatory interpretation"
          source_url: "https://www.reuters.com/business/finance/goldman-sachs-teams-up-with-anthropic-automate-banking-tasks-with-ai-agents-cnbc-2026-02-06/"
      - name: "Morgan Stanley"
