        \ from Parmy Olson (Bloomberg):\nOlson's asymmetry stems from professional identity capture (book thesis).\nWong's\
        \ asymmetry stems from institutional financial architecture — the\npublication-level incentive structure, not individual\
        \ journalist investment.\nThis makes the Atlantic pattern more significant: it suggests editorial\nculture absorbs\
