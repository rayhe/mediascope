        editorial voice.
      notes: 'Weatherbed is a news writer — same beat that covers routine tech news. Compare to Meta coverage: Alex Heath
        (business investigator), Sean Hollister (consumer harm), Victoria Song (product critic with activist-quote leads).
        Anthropic''s security breach — unauthorized access to a model described as capable of exploiting ''every major operating
        system and every major web browser'' — receives the neutral news-writer treatment. Meta''s glasses (1 camera, no autonomous
        hacking capability) get the investigative treatment.

        '
