    cross_entity_coverage_analysis:
      asymmetry_note: 'High asymmetry score reflects extreme gap between investigative depth applied to Meta vs all competitors.
        Partially mitigated by legitimate factors (source access, leaked documents, specialization). The key question is not
        whether Horwitz''s Meta reporting is wrong (it isn''t), but whether the ABSENCE of comparable investigation of competitors
        with comparable issues constitutes a structural blind spot reinforced by financial incentives.

        '
