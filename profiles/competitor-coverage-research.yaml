      summary: 'Nilay Patel (Verge EIC since 2014, Decoder host) personally interviews

        competitor CEOs with strategic "big ideas" framing — Sundar Pichai

        annually at Google I/O (5 years running), Mustafa Suleyman (Microsoft

        AI chief), Ronan Farrow on OpenAI/Altman — but DELEGATES all Meta CEO

        interviews to deputy editor Alex Heath, who applies adversarial-

        investigative framing (layoffs, internal strategy doubt, leaker

        crackdowns). This creates asymmetric editorial temperature at the

        leadership level: Meta gets the investigative deputy, competitors get

        the constructive EIC.


        Cross-entity tones (Patel-level):

        - Google: -0.15 (annual strategic interviews, "secretly ruthless" NPR)

        - OpenAI: -0.30 (Farrow episode, profitability skepticism)

        - Apple: -0.10 (Vision Pro review, product lens)

        - Microsoft: +0.05 (Suleyman interview, constructive)

        - Meta: -0.45 (child safety editorial, institutional framing via Heath)

        - Meta-Google gap: 0.30; Meta-Microsoft gap: 0.50


        PUBLISHER SOLIDARITY CONTEXT: Patel raised "Condé Nast CEO says assume

        zero search traffic" directly in his Pichai Decoder interview (May 2026).

        Zuckerberg''s "overestimate the value" comment about publisher content

        (reported by Heath/Robertson) positions Meta as adversarial to publishers.

        The company that dismisses publisher content value gets the adversarial

        deputy; companies that pay publishers get the constructive EIC.


        This is mechanism #6 after: (1) WIRED desk assignment, (2) NYT between-

        reporter, (3) FT within-reporter, (4) Verge four-lane, (5) Verge Access

        Paradox (Heath). It is distinct from #5 because it operates at the EIC

        level — determining which CEO gets the EDITOR-IN-CHIEF''s personal

        attention vs which gets the deputy''s investigative lens.

        '
