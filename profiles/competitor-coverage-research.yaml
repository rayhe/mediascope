          annual_tech_budget_b: 20
          deployment_launch: "2024-07"
          claude_financial_services_launch: "2025-07"
          ceo_vision: "agentic enterprise — every employee has a personalized AI assistant"
          executive_on_record: "Derek Waldron (Chief Analytics Officer)"
          source_url: "https://www.linkedin.com/pulse/claude-jpmorgan-chase-enterprise-ai-deployment-case-yesh-kane-desai-y1pbc"
    gras_termination:
      date: "2025-12-05"
      original_settlement_year: 2003
      successor_regime: "FINRA Rule 2241 (principles-based, adopted 2015)"
      months_before_anthropic_ipo: 10
      sec_statement_source: "https://www.sec.gov/newsroom/speeches-statements/uyeda-statement-global-research-analyst-settlement-120525"
      ipo_relevance: >
        The GRAS mandated structural separation of research and investment banking
        through prescriptive measures enforced by judicial oversight. Its termination
        in December 2025 — 10 months before Anthropic's target October 2026 IPO —
        replaced court-mandated structural safeguards with principles-based self-policing
        under FINRA Rule 2241. While Rule 2241 addresses many of the same conflicts,
        the shift from judicial enforcement to principles-based oversight coincides with
        the largest AI IPO pipeline in history. The three banks (Goldman Sachs, Morgan
        Stanley, JPMorgan Chase) that are lead underwriters for Anthropic's IPO were
        among the original 12 firms subject to the GRAS settlement. The SEC's original
        2001 testimony documented that "it was well understood by all analysts that they
