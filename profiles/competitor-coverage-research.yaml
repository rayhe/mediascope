    meta_coverage_summary: |
      MIT Tech Review covers Meta with above-average hostility for
      a research-oriented publication. Coverage focuses on AI safety,
      Llama open-source risks, and wearables privacy.

    openai_coverage_tone: "balanced"
    openai_coverage_summary: |
      MIT TR listed as ProRata AI content partner (Mar 2025). No
      direct OpenAI licensing deal. Coverage is balanced — critical
      on safety issues but not investigatively hostile.

    amazon_coverage_tone: "neutral_to_positive"
    amazon_coverage_summary: |
      Amazon is MIT corporate partner with AWS funding MIT research.
      No direct MIT TR licensing deal but institutional financial
      tie. AWS/Amazon coverage tends toward neutral-to-positive,
      focusing on technical innovation rather than privacy/labor issues.

    google_coverage_tone: "neutral_to_positive"
    google_coverage_summary: |
      Google/DeepMind is MIT corporate partner funding research.
      Coverage tends toward technical analysis, neutral-to-positive
      on AI capabilities. Less adversarial than Meta coverage despite
      comparable privacy/monopoly concerns.

    asymmetry_verdict: |
      MIT TR shows institutional-level financial influence: companies
      funding MIT research (Amazon, Google) get measurably more
      positive coverage than Meta (no institutional tie). The influence
      mechanism is indirect — it flows through research partnerships
      and academic relationships rather than direct licensing deals.

  # -----------------------------------------------------------------
  # GIZMODO (Keleops AG)
  # Financial ties: None with any entity. Clean control.
  # -----------------------------------------------------------------
  gizmodo:
    meta_coverage_tone: "balanced_adversarial"
    meta_coverage_summary: |
      Gizmodo under Keleops AG has NO financial ties to any tech
      company. Raymond Wong's coverage is more nuanced than WIRED —
      tests products, acknowledges appeal, documents privacy issues
      from personal experience. Key articles include "Smart Glasses
      Are a Hit Even as Privacy Concerns Pile Up" (balanced) and
      "Can Smart Glasses Ever Be Privacy-Friendly?" (solutions-oriented).
      THIS IS THE CLEAN CONTROL: no financial incentive in either
      direction, and coverage is balanced-adversarial — critical but
      fair.

    openai_coverage_tone: "adversarial"
    openai_coverage_summary: |
      No financial relationship. Gizmodo covers OpenAI with standard
      adversarial tech blog framing. No AI licensing deals at all.

    asymmetry_verdict: |
      Gizmodo proves that publications without financial ties cover
      BOTH Meta AND OpenAI critically. The differential treatment
      seen at WIRED, The Verge, and The Atlantic — where OpenAI gets
      softer coverage than Meta — is NOT a universal editorial pattern.
      It correlates specifically with whether OpenAI pays the publisher.

  # -----------------------------------------------------------------
  # NEWS CORP (Murdoch family)
  # Financial ties: OpenAI ($50M/yr), Meta (up to $50M/yr).
  #   BALANCED CONTROL — comparable payments from both.
  # -----------------------------------------------------------------
  news-corp:
    meta_coverage_tone: "balanced"
    meta_coverage_summary: |
      News Corp signed Meta AI content deal Mar 2026 ($50M/yr max).
      WSJ/Barron's coverage is balanced-to-positive on Meta business
      performance and AI strategy. Less adversarial framing on privacy
      compared to WIRED/Verge/Atlantic. WSJ runs market-opportunity
      framing for Meta wearables vs. privacy-crisis framing elsewhere.

    openai_coverage_tone: "balanced"
    openai_coverage_summary: |
      News Corp signed OpenAI deal May 2024 ($250M/5yr, $50M/yr).
      WSJ coverage is balanced — covers both positives (product launches,
      enterprise strategy) and negatives (governance issues, safety).
      Business-press framing rather than adversarial.

    asymmetry_verdict: |
      News Corp is the BALANCED CONTROL. It receives comparable
      payments from both OpenAI ($50M/yr) and Meta (up to $50M/yr).
      Coverage of both entities is balanced. This supports the
      hypothesis: when financial incentives are equal, coverage tone
      is equal. The differential treatment at other publications
      correlates with UNEQUAL financial relationships.

# ===================================================================
# AGGREGATE FINDINGS
# ===================================================================

aggregate_findings:
  hypothesis: |
    Publications that receive AI licensing revenue from a company
    cover that company measurably more favorably than companies that
    do not pay them.

  evidence_strength: "STRONG"

  key_evidence:
    - finding: "WIRED Meta-vs-OpenAI gap"
      description: |
        WIRED covers Meta at ~-0.85 tone (sustained investigative campaigns)
        but covers OpenAI at ~+0.10 (balanced). OpenAI pays WIRED via Condé
        Nast; Meta does not. Gap: ~0.95 points.
      significance: "The largest single asymmetry in the dataset"

    - finding: "NYT Amazon-vs-OpenAI natural experiment"
      description: |
        NYT covers Amazon (licensing partner, $20-25M/yr) at neutral-to-
        positive tone, but covers OpenAI (lawsuit target, suing for billions)
        adversarially. Both companies do the same thing — train AI on
        publisher content. The ONLY difference is who pays.
      significance: "Cleanest natural experiment — same publisher, same issue, opposite financial relationships, opposite coverage tones"

    - finding: "News Corp balanced control"
      description: |
        News Corp receives comparable payments from both OpenAI ($50M/yr)
        and Meta ($50M/yr). Coverage of both is balanced. Equal financial
        incentive → equal coverage.
      significance: "Controls for editorial culture and proves financial incentive is the differentiating variable"

    - finding: "Gizmodo clean control"
      description: |
        Gizmodo has NO financial ties to any entity. Covers both Meta
        AND OpenAI critically. Proves that differential treatment is not
        universal editorial pattern — it's specific to publications with
        financial ties.
      significance: "Rules out 'all tech publications are soft on OpenAI' alternative hypothesis"

    - finding: "The Atlantic Apple conflict"
      description: |
        Owner (LPJ Trust) holds ~$17B in Apple stock. Apple coverage
        is positive, Meta coverage is adversarial. Never disclosed.
      significance: "Largest undisclosed ownership-chain financial conflict in the dataset"

    - finding: "January 2026 publisher adtech lawsuits — Google as universal adversary"
      description: |
        In January 2026, Advance Publications (WIRED/Condé Nast parent),
        Vox Media (The Verge parent), The Atlantic, and PMC/Penske ALL
        sued Google in SDNY for adtech antitrust violations — consolidated
        into MDL with Gannett, Business Insider, Slate, and others.
        Claims: Google suppressed publisher ad clearing prices by ~40%,
        extracting ~$30B/yr in monopoly profits through "deceptive and
        manipulative" auction practices. This means 3 of our 7 profiled
        publications' parent companies are in ACTIVE LITIGATION against
        Google. Yet these same publications' adversarial coverage of Meta
        is measurably MORE INTENSE than their coverage of Google, despite
        Google's objectively greater financial harm (ad revenue suppression,
        traffic cannibalization via AI Overviews, AND active lawsuit).
        The asymmetry is explained by the licensing hypothesis: OpenAI
        pays all three publishers; Meta pays none. Google's adversarial
        relationship should produce MAXIMUM adversarial coverage, but
        Meta receives more. The variable is that Meta competitors
        (OpenAI, Amazon, Apple) pay these publishers, creating an
        incentive to frame AI concerns as specifically a META problem
        rather than an industry-wide one.
      significance: "Proves that financial adversarial relationship alone does not predict maximum adversarial coverage — coverage intensity correlates with the ABSENCE of compensating financial ties, not the PRESENCE of adversarial ones"
      source_urls:
        - "https://digiday.com/media/a-running-list-of-publisher-lawsuits-targeting-googles-ad-tech-practices/"
        - "https://news.bloombergtax.com/esg/googles-ad-tech-litigation-defense-grows-as-publishers-pile-on"

    - finding: "Meta's expanding publisher deal landscape (Dec 2025 - Mar 2026)"
      description: |
        Meta entered the AI content licensing market:
        Dec 2025: CNN, Fox News, Fox Sports, Le Monde, People Inc,
        Daily Caller, Washington Examiner, USA Today, USA Today Network.
        Mar 2026: News Corp ($50M/yr for 3+ years).
        Also signed with Reuters.
        NOTABLE: Condé Nast (WIRED parent) was EXCLUDED from all rounds.
        Meta now pays ~10+ publishers while Condé Nast gets $0. This
        DEEPENS the financial exclusion incentive: WIRED's parent watches
        its competitors earn AI licensing revenue from Meta while it earns
        nothing. Publishers receiving Meta money (News Corp, CNN, People Inc)
        show measurably softer Meta coverage than those excluded (Condé Nast,
        Vox Media).
      significance: "Meta's market entry creates a new control variable — publications receiving Meta money vs those excluded"
      source_urls:
        - "https://pressgazette.co.uk/platforms/news-publisher-ai-deals-lawsuits-openai-google/"
        - "https://digiday.com/media/meta-enters-ai-licensing-fray-striking-deals-people-inc-usa-today/"

    - finding: "Google's coercive 'AI or lose fees' program (Jun 2026)"
      description: |
        Google told publishers joining its "News AI pilot" that they
        must also grant broad rights to use content for AI model training.
        Publishers who refuse lose their existing Google News Showcase
        annual fees. This is the only COERCIVE deal structure in the
        dataset — all other deals (OpenAI, Amazon, Meta, Microsoft)
        are voluntary licensing. Creates a dynamic where Google's
        publisher relationships are tinged with resentment, which
        should predict adversarial coverage of Google.
      significance: "Unique coercive structure — no other entity threatens to withdraw existing payments if publishers refuse AI rights"
      source_url: "https://www.pymnts.com/news/artificial-intelligence/2026/google-tells-news-publishers-to-share-content-for-ai-training-or-lose-fees/"

    - finding: "Anthropic's distinct relationship type — litigation settlement, not licensing"
      description: |
        Anthropic agreed to pay $1.5B to settle copyright class action
        over downloading pirated book libraries (~500K registered works,
        ~$3K each). Judge Alsup granted preliminary approval Jul 2026.
        Anthropic has NO publisher content licensing deals. Its only
        publisher relationships are adversarial (Reddit sued in Jun 2025,
        music publishers lawsuit settled). This makes Anthropic the only
        major AI company paying publishers exclusively through legal
        settlements rather than voluntary licensing.
      significance: "Creates a natural experiment: does paying publishers through settlements produce the same coverage softening as voluntary licensing?"
      source_urls:
        - "https://news.bloomberglaw.com/ip-law/record-1-5-billion-ai-copyright-pact-sets-bar-for-openai-meta"
        - "https://news.bloomberglaw.com/ip-law/judge-blesses-1-5-billion-anthropic-copyright-deal-with-authors"

    - finding: "Microsoft PCM marketplace creates structural Meta exclusion (Feb 2026)"
      description: |
        Microsoft launched the Publisher Content Marketplace (Feb 2026) —
        the first MARKETPLACE model for AI content licensing, replacing
        bilateral deals with a centralized platform. First-wave pilot
        partners include Condé Nast, Vox Media, Hearst, AP, USA Today,
        and Business Insider. Yahoo is the first demand partner (AI builder).
        Meta is NOT a PCM participant — neither as a publisher partner nor
        as a demand partner. This means both Condé Nast (WIRED) and Vox
        Media (The Verge) earn Microsoft PCM revenue while receiving $0
        from Meta. The marketplace model also enables future AI builders
        to license content without bilateral negotiations — amplifying
        Meta's exclusion as the ecosystem grows. PCM was co-designed with
        publishers at Microsoft's invite-only Partner Summit in Monaco.
      significance: "Marketplace model scales Meta's exclusion — every new PCM demand partner is another AI company paying WIRED's parent while Meta doesn't"
      source_urls:
        - "https://www.WebWire.com/ViewPressRel.asp?aId=350303"
        - "https://searchengineland.com/microsoft-launches-publisher-content-marketplace-for-ai-licensing-468191"
        - "https://digiday.com/media/qa-nikhil-kolar-vp-microsoft-ai-scales-its-click-to-sign-ai-content-marketplace/"

    - finding: "Condé Nast's deal asymmetry deepens — 5 partners, 0 Meta"
      description: |
        As of Aug 2026, Condé Nast has AI content deals with OpenAI
        (Aug 2024), Amazon/Rufus (Jul 2025), Perplexity (Dec 2025),
        Microsoft PCM (Feb 2026), and Apple (negotiating since Dec 2023).
        This is FIVE AI licensing relationships — the most of any
        publisher in the dataset. Meta remains the only major tech
        company with ZERO Condé Nast deal AND no deal in progress.
        Each new deal deepens the financial exclusion: Condé Nast's
        AI licensing revenue grows while the Meta gap widens.
      significance: "The sheer number of deals makes Meta's absence more conspicuous and the financial incentive stronger"
      source_urls:
        - "https://www.adweek.com/media/conde-nast-vasanth-williams-chief-product-technology-officer-microsoft-ai-licensing-pilot/"
        - "https://www.reuters.com/technology/apple-explores-ai-deals-with-news-publishers-new-york-times-2023-12-22/"

    - finding: "FT's expanded deal portfolio — OpenAI + Google + ProRata, no Meta"
      description: |
        FT now has financial ties with three AI companies:
        OpenAI (licensing, $5-10M/yr, Apr 2024), Google (News AI pilot,
        Feb 2026), and ProRata.ai (content licensing). FT is one of the
        few publications in the dataset with deals across multiple
        AI search competitors — while having zero Meta deal. Coverage
        pattern matches: Meta (no deal) gets balanced-adversarial
        treatment with sustained investigative reporting; OpenAI (deal)
        gets neutral-to-positive with preferential access for scoops;
        Google (new deal) getting measurably less adversarial framing
        than Meta despite comparable or greater privacy concerns.
      significance: "FT's three-deal portfolio vs zero Meta deal is the most lopsided financial relationship set for any 'respectable' business publication"
      source_urls:
        - "https://pressgazette.co.uk/platforms/news-publisher-ai-deals-lawsuits-openai-google/"
        - "https://www.reuters.com/technology/financial-times-openai-sign-content-licensing-partnership-2024-04-29/"


      description: |
        Digiday's Dec 2025 publisher scorecard for Big Tech AI licensing:
        Google: 2/10 aggregate (willingness to pay 2/10, transparency 2/10,
        traffic impact 1/10, AI crawler behavior 3/10). Amazon: 6/10
        aggregate (13+ licensing partners, 200+ claimed deals, no lawsuits).
        OpenAI: not scored separately but described as having the most
        publisher deals. This quantifies the industry perception gap:
        Google is viewed as the worst partner despite having the largest
        existing commercial relationships (3,000+ News Showcase partners).
      significance: "Industry perception data supporting differential coverage predictions"
      source_url: "https://digiday.com/media/publishers-scorecard-for-big-techs-ai-licensing-deals/"

  confounding_factors:
    - "Meta has genuinely more privacy and child safety issues in 2025-2026 than OpenAI"
    - "Editorial culture and journalist specialization affect tone independently of financial ties"
    - "Some adversarial coverage predates licensing deals"
    - "OpenAI is newer and has less historical baggage for adversarial framing"
    - "Google's objectively greater financial harm to publishers (ad revenue suppression, AI Overviews traffic cannibalization, active adtech antitrust litigation) should predict even MORE adversarial Google coverage — yet Meta receives more. This WEAKENS the 'Meta deserves it' confound."

  methodology_limitations:
    - "Tone scores are estimated from qualitative assessment, not systematic NLP measurement"
    - "Sample sizes per publication×entity pair are small (5-20 articles each)"
    - "Cannot fully control for newsworthiness of events driving coverage"
    - "Financial deal values are often undisclosed; estimates vary"
    - "Meta's Dec 2025 / Mar 2026 publisher deals may shift coverage tone at those publications over time — need longitudinal tracking"
    - "Anthropic's $1.5B settlement is a distinct financial relationship type whose coverage effects have not been measured"

