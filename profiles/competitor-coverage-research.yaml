      description: "THE ADVERTISING DEPENDENCY PARADOX — publications most harmed by Google\ndirect their most sustained adversarial\
        \ coverage at Meta, not Google.\n\nDATA POINTS:\n- Condé Nast (WIRED parent): Google traffic collapsed from majority\
        \ to\n  ~25%, called AI Overviews \"death blow,\" sued Google for adtech\n  antitrust. Yet WIRED's coverage of Meta\
        \ is MORE adversarial (-0.85)\n  than its Google coverage. Google has no AI deal with Condé Nast.\n  Meta has no AI\
        \ deal with Condé Nast. But Google is ACTIVELY HARMING\n  Condé Nast while Meta has zero leverage.\n- NYT: Q2 2026\
        \ (Aug 5) — stock plunged 13% (worst since 2012), CEO\n  Levien explicitly blamed \"big tech companies whose moves\
        \ continue\n  to result in less traffic to publishers.\" 280K digital subs added\n  (missed 295K estimate). Even the\
        \ NYT isn't immune to Google's\n  traffic reduction. NYT has Amazon deal ($20-25M/yr) and Snowflake\n  deal but NO\
        \ Meta deal, NO Google AI deal.\n\nTHE STRUCTURAL EXPLANATION:\nGoogle has QUADRUPLE coercive leverage over publishers\
        \ (ad dependency,\nsearch traffic, Showcase fees, pilot deal exclusion). Being adversarial\ntoward Google is RISKY\
        \ — could trigger further traffic or ad revenue\nreduction. Meta has ZERO coercive leverage — no ad network for publishers,\n\
        no search traffic, no fee leverage. Being adversarial toward Meta is\nCOST-FREE. Financial incentives thus push publishers\
        \ toward softer\nGoogle coverage and harsher Meta coverage, regardless of actual harm.\n\nTHE IRONY:\nThe company\
        \ causing the most financial damage to publishers (Google) gets\nsofter treatment than the company with zero leverage\
        \ over them (Meta).\nThis isn't editorial courage — it's risk-adjusted self-interest.\n"
