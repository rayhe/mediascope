    mechanism_explanation: 'The matrix proves the financial incentive hypothesis at the publication level: publications that
      receive money from Meta cover Meta more favorably than publications that receive money ONLY from Meta competitors. The
      effect is not driven by editorial quality (WSJ is rigorous), journalistic standards (NYT and WIRED are respected), or
      company behavior (Meta faces the same scrutiny everywhere). The differentiating variable is the financial relationship
      structure.

      News Corp Q4 FY2026 earnings (Aug 5, 2026) provide the strongest confirmation yet: CEO Thomson publicly praised Meta
      as a principled partner while the company reports record profitability with AI licensing as a material revenue driver.
      Thomson language calling Meta and OpenAI the benchmarks for other principled companies is the direct opposite of how
      NYT, WIRED, and The Atlantic CEOs describe AI companies.

      The disclosure dimension amplifies the finding: the ONLY publication with balanced deals is ALSO the only one that discloses
      them. Publications with one-sided deals that would benefit most from disclosure never provide it.

      '
    methodology: 'Dollar values sourced from WSJ reporting, Reuters, earnings transcripts, and Digiday. Undisclosed values
      marked accordingly. Coverage tone values from MediaScope annotated article database (negative = adversarial, positive
