    finding_summary: 'Comprehensive cross-publisher mapping of verified AI content licensing revenue sources against observed
      Meta coverage tone. Among 10 MediaScope- profiled publications, News Corp is the ONLY one with a direct Meta AI licensing
      deal. It is also the ONLY one with balanced Meta coverage AND the ONLY one that systematically discloses its financial
      relationships. The remaining 9 publications have ZERO Meta revenue; 7 of 9 have deals with Meta competitors; all 9 produce
      adversarial Meta coverage. The correlation between no-Meta-revenue and adversarial-Meta-coverage is 100% across the
      profiled dataset.

      '
