  publisher_ai_revenue_materiality_index:
    cross_publisher_analysis:
      google_traffic_substitution: 'AI licensing revenue is emerging as a REPLACEMENT for Google search referral traffic,
        not an addition to it. People Inc. lost 65% of Google referrals over 2 years. USA Today digital ad revenue fell 3%
        despite AI licensing growth. The substitution dynamic means publishers are increasingly DEPENDENT on AI deal revenue
        as Google traffic declines — strengthening the coverage incentive over time. CEO Vogel''s explicit exclusion of Google
        from productive discussions suggests publishers view Google as the traffic destroyer and AI companies as the revenue
        replacer.

        '
      opacity_gradient: "MOST TRANSPARENT → LEAST TRANSPARENT (AI deal revenue): 1. People Inc. (PPLI): breaks out licensing\
        \ category, explicitly\n   attributes growth to Meta deal. COVERAGE: softest of deal holders.\n2. USA Today Co. (TDAY):\
        \ reports \"notable\" AI licensing in \"other\"\n   digital category. COVERAGE: neutral to soft.\n3. News Corp (NWSA):\
        \ AI in \"Other\" revenue, only deal with publicly\n   verified annual value (OpenAI $50M/yr). COVERAGE: balanced.\n\
        4. NYT (NYT): AI licensing commingled with Wirecutter affiliate\n   revenue — cannot isolate. COVERAGE: adversarial.\n\
        5. Condé Nast/WIRED (private): ZERO disclosure obligation, 4\n   competitor deals, 0 Meta deals. COVERAGE: most adversarial\
        \ (-0.85).\n\nPATTERN: Financial transparency correlates inversely with adversarial Meta coverage. The most transparent\
        \ publishers (People Inc., USA Today) have Meta deals AND produce softer coverage. The least transparent (Condé Nast)\
        \ has NO Meta deal and produces the most adversarial coverage. This is not proof of causation — private companies\
        \ don't choose opacity to hide editorial conflicts — but the STRUCTURAL EFFECT is that the most consequential financial\
        \ incentives are the ones that can never be quantified from public records.\n"
      revenue_materiality_threshold: 'Based on Q1-Q2 2026 earnings data, AI licensing revenue is crossing the materiality
        threshold for mid-tier publishers: - People Inc. licensing + other: $40.7M/quarter (10.5% of digital revenue) - USA
        Today other digital: $33.75M/quarter (12.9% of digital revenue) - Wiley AI revenue: $49M/yr (growing 22.5% YoY) -
        News Corp: AI revenue is "near 100% margin" per CFO

        For publishers earning $40-50M/quarter from AI licensing at near-100% margin, losing a single AI deal would create
        a material earnings impact. This makes the coverage incentive REAL, not theoretical: publishers whose AI revenue depends
        on OpenAI, Microsoft, or Amazon have a quantifiable financial reason to avoid adversarial coverage of those companies
        while having no such constraint regarding Meta (which has deals with different publishers).

        '
    date_added: 2026-08-09
    finding_summary: 'SEC-filed quantification of publisher AI licensing revenue from Q1-Q2 2026 earnings reveals a critical
      opacity gradient: publishers with the most transparent AI deal revenue reporting (People Inc., USA Today Co.) produce
      the softest Meta coverage, while the publisher most hostile to Meta (WIRED, via privately-held Condé Nast/Advance Publications)
      has ZERO financial disclosure obligation and therefore zero quantifiable AI deal revenue — despite holding 4 competitor
      AI deals. This "Condé Nast Opacity Paradox" means the financial incentive driving WIRED''s adversarial Meta coverage
      is structurally invisible to public scrutiny, protected by Advance Publications'' private company status.

      '
