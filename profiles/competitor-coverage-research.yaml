# ===================================================================
# COMPETITOR COVERAGE RESEARCH — Cross-Entity Asymmetry Evidence
# Created: 2026-08-04
# Purpose: Document specific coverage examples showing differential
#   treatment of Meta vs. competitors by publications with financial
#   ties to those competitors. Each entry has a source URL.
# ===================================================================

research_period: "2024-08-01 to 2026-08-04"
methodology: |
  For each profiled publication, we compared coverage tone and framing
  of Meta against coverage of companies that pay the publication (via
  AI content licensing deals) or are financially connected. Every
  finding is sourced to a specific article or primary document.

# ===================================================================
# PUBLICATION × ENTITY COVERAGE FINDINGS
# ===================================================================

publications:

  # -----------------------------------------------------------------
  # WIRED (Condé Nast / Advance Publications)
  # Financial ties: OpenAI (licensing, Aug 2024), Amazon (licensing via
  #   Rufus, Jul 2025), Microsoft PCM (Feb 2026), Perplexity (deal
  #   confirmed Adweek Dec 2025). Apple (negotiating since Dec 2023).
  #   No Meta deal. No Google deal.
  # -----------------------------------------------------------------
  wired:
    meta_coverage_tone: "adversarial"
    meta_coverage_summary: |
      WIRED under Katie Drummond has made Meta its primary investigative
      target. The NameTag/facial recognition investigation (Jun 2026)
      triggered Meta to emergency-delete dormant code. WIRED runs
      sustained adversarial coverage of Meta wearables, child safety,
      and privacy. Coverage uses loaded language, catastrophizing, and
      editorial dramatization at rates 3-5x above baseline for other
      entities. Silence on Meta reached 18 consecutive days (Jul 17 -
      Aug 4, 2026) after the initial NameTag wave.
    meta_examples:
      - title: "Meta's Smart Glasses Had Hidden Facial Recognition Code"
        date: "2026-06-08"
        tone: -0.85
        framing: "investigative exposé, loaded language ('dormant surveillance'), fear appeal"
        source_url: "https://www.techdigest.tv/2026/06/meta-abandons-facial-recognition-for-smart-glasses-after-wired-investigation.html"
        notes: "Prompted Meta emergency code deletion. Andy Stone called it 'intellectually dishonest' and 'pure advocacy-driven click bait.'"

    openai_coverage_tone: "neutral_to_positive"
    openai_coverage_summary: |
      Despite covering OpenAI governance crises (Nov 2023 board coup,
      sycophancy scandal), WIRED's OpenAI coverage is notably less
      hostile than its Meta coverage. No sustained investigative campaigns.
      Product reviews are balanced-to-positive. Condé Nast signed
      an OpenAI content licensing deal Aug 2024 (Reuters confirmed).
      WIRED has never disclosed this financial relationship in articles
      about OpenAI. Coverage of OpenAI sycophancy was based on VentureBeat's
      reporting, not original investigation.
    openai_examples:
      - title: "OpenAI Overrode Expert Tester Concerns (sycophancy coverage)"
        date: "2025-Q4"
        tone: -0.2
        framing: "balanced critical, no loaded language, factual reporting"
        notes: "Compare to Meta coverage: same type of 'company ignored safety warnings' story, but 2-3x less hostile framing"

    amazon_coverage_tone: "neutral"
    amazon_coverage_summary: |
      Condé Nast signed an Amazon Rufus AI licensing deal Jul 2025
      (Digiday confirmed). WIRED's Amazon coverage focuses on product
      reviews (Alexa, Ring) with standard tech-review framing. No
      sustained investigative campaigns against Amazon despite
      comparable privacy concerns (Ring doorbell surveillance,
      Alexa recording).
    amazon_deal_source: "https://digiday.com/media/conde-nast-and-hearst-strike-amazon-ai-licensing-deals-for-rufus/"

    microsoft_coverage_tone: "neutral_to_positive"
    microsoft_coverage_summary: |
      Condé Nast joined Microsoft's Publisher Content Marketplace (PCM)
      as a pilot partner (Feb 2026, WebWire press release). PCM licenses
      Condé Nast's U.S. text-based editorial content for grounding
      AI-generated summaries in Microsoft Copilot. Co-designed with
      Business Insider, Hearst, AP, USA Today, and Vox Media. Yahoo
      is the first external demand partner. This is a MARKETPLACE
      model — unlike bilateral OpenAI/Amazon deals — meaning Condé
      Nast's content can be licensed to multiple AI builders through
      Microsoft's infrastructure. Meta is NOT a PCM participant.
    microsoft_pcm_source: "https://www.WebWire.com/ViewPressRel.asp?aId=350303"
    microsoft_pcm_marketplace_source: "https://searchengineland.com/microsoft-launches-publisher-content-marketplace-for-ai-licensing-468191"

    perplexity_coverage_tone: "neutral"
    perplexity_coverage_summary: |
      Condé Nast has a content licensing agreement with Perplexity
      (confirmed Adweek, Dec 2025, alongside OpenAI and Amazon deals).
      No detailed terms disclosed.
    perplexity_deal_source: "https://www.adweek.com/media/conde-nast-vasanth-williams-chief-product-technology-officer-microsoft-ai-licensing-pilot/"

    deal_count_summary: |
      As of Aug 2026, Condé Nast (WIRED's parent) has AI licensing
      deals with FIVE entities: OpenAI, Amazon, Microsoft, Perplexity,
      and Apple (negotiating). Condé Nast has deals with ZERO of Meta's
      direct competitors in the social/messaging space — its deals are
      exclusively with AI labs (OpenAI, Perplexity) and cloud platforms
      (Amazon, Microsoft). Meta, which competes most directly with
      Condé Nast's social traffic sources (Facebook referrals, Instagram),
      is the ONLY major tech company that Condé Nast has no deal with
      AND no deal in progress with.

    apple_coverage_tone: "neutral_to_positive"

    apple_coverage_summary: |
      Apple in negotiation for Condé Nast AI content deal (Reuters,
      Dec 2023). WIRED covers Apple product launches with standard
      tech-review framing. Vision Pro received critical but respectful
      coverage. No investigative campaigns against Apple despite
      App Store monopoly litigation and labor issues. Privacy-positive
      framing of Apple's Private Cloud Compute — contrast with
      adversarial framing of Meta's identical on-device AI processing.
      WEARABLES LANE ASSIGNMENT: Lauren Goode (WIRED's senior consumer
      tech correspondent) reviews Apple Vision Pro with deeply personal,
      emotional narrative — "I cried" / "The view is incredible" /
      "I was starting to love this thing." Apple Vision Pro has 12
      outward-facing cameras, 5 sensors, 6 microphones — the most
      surveillance-capable consumer wearable ever sold — yet receives
      ZERO surveillance/privacy framing in Goode's review. Criticism
      focuses on isolation and loneliness, not data harvesting or
      bystander consent. The same journalist also reviews Snap Spectacles
      with playful positive framing ("Face Camera We've Been Waiting For").
      Meanwhile, Meta's single-12MP-camera glasses are assigned to
      investigative reporters (Dell Cameron, Dhruv Mehrotra) who frame
      them as "dormant surveillance infrastructure."
    apple_examples:
      - title: "Lauren Goode Apple Vision Pro review — 'I cried'"
        date: "2024-02-23"
        tone: +0.55
        framing: "personal emotional narrative, empathetic wonder, product delight. ZERO surveillance framing for 12-camera device."
        source_url: "https://macdailynews.com/2024/02/23/dont-cry-inside-your-apple-vision-pro/"
        notes: "Apple Vision Pro has 12 cameras vs Meta Ray-Ban's 1 camera. Goode cried in the headset and wrote about it emotionally. No mention of bystander privacy despite 12 outward-facing cameras."
      - title: "Lauren Goode Snap Spectacles review — 'Face Camera We've Been Waiting For'"
        date: "2018"
        tone: +0.45
        framing: "playful positive, expectant framing, fun consumer product review at amusement park"
        source_url: "https://www.youtube.com/watch?v=zHn_otv4qN8"
        notes: "Same Goode who does Apple wearables also covers Snap wearables positively — but NEVER covers Meta wearables."
      - title: "WIRED Gadget Lab podcast — 'Apple's Uncanny Valley Pro'"
        date: "2024-02-01"
        tone: +0.3
        framing: "product curiosity, no surveillance framing, no privacy alarm for 12-camera headset"
        source_url: "https://www.everand.com/podcast/702917430/Apple-s-Uncanny-Valley-Pro"
        notes: "Julian Chokkattu and Lauren Goode discuss Apple Vision Pro. Focus on price, apps, battery — not cameras or surveillance."

    google_coverage_tone: "adversarial"
    google_coverage_summary: |
      WIRED covers Google AI Overviews critically. CEO Roger Lynch
      described Google as existential threat. Condé Nast joined
      publisher coalition against Google scraping. No financial
      deal with Google.
      CRITICAL UPDATE (Jan 14, 2026): Advance Publications (Condé Nast's
      parent) SUED Google in SDNY for adtech antitrust violations,
      alongside Vox Media, The Atlantic, PMC/Penske, and McClatchy.
      Claims Google suppressed publisher ad clearing prices by ~40%
      through "deceptive and manipulative" auction practices,
      extracting ~$30B/yr in monopoly profits. Consolidated into
      MDL with Gannett, Business Insider, Slate, and others.
      FURTHER (Jun 25, 2026): Google's "News AI pilot" program
      coerces publishers — refuse to share content for AI training
      and lose existing Google News Showcase fees (PYMNTS/The Information).
      This makes Google the ONLY company in the dataset with TRIPLE
      adversarial relationships with WIRED's parent: (a) no AI licensing
      deal, (b) existential traffic threat from AI Overviews, (c) active
      antitrust litigation. Yet WIRED's adversarial coverage volume
      and intensity for Google remains LOWER than for Meta, despite
      Google's objectively greater financial harm to WIRED's parent.
    google_litigation_source: "https://digiday.com/media/a-running-list-of-publisher-lawsuits-targeting-googles-ad-tech-practices/"
    google_coercion_source: "https://www.pymnts.com/news/artificial-intelligence/2026/google-tells-news-publishers-to-share-content-for-ai-training-or-lose-fees/"

    x_twitter_coverage_tone: "adversarial"
    x_coverage_summary: |
      Standard adversarial coverage of Musk/X. No financial relationship.

    asymmetry_verdict: |
      WIRED's most extreme coverage asymmetry is Meta (-0.85) vs OpenAI
      (+0.10) — a gap of ~0.95 on a -1 to +1 scale. OpenAI pays WIRED
      (via Condé Nast); Meta does not. Both companies have had comparable
      scandals (ignored safety warnings, privacy concerns), but only
      Meta receives sustained investigative campaigns. WIRED has never
      disclosed the Condé Nast-OpenAI licensing deal in its OpenAI
      coverage.

  # -----------------------------------------------------------------
  # THE VERGE (Vox Media → PMC / SRMG-PIF)
  # Financial ties: OpenAI (licensing via Vox Media, May 2024),
  #   Microsoft PCM (pilot partner, Feb 2026). No Meta deal. PMC sued Google.
  # -----------------------------------------------------------------
  the-verge:
    meta_coverage_tone: "adversarial"
    meta_coverage_summary: |
      The Verge's institutional Meta coverage is adversarial, but this emerges
      from editorial commentary (Nilay Patel) and business/investigative
      reporters (Alex Heath), NOT from the dedicated wearables reviewer.
      Victoria Song, The Verge's primary wearables beat reporter, actually
      provides some of the most balanced Meta glasses coverage in the industry:
      "the best glasses I've ever tried," "a turning point for smart glasses,"
      and explicitly argued Meta's approach may be better than Apple's.
      The adversarial institutional tone is set by executive editorial decisions
      and Alex Heath's Meta-focused investigations, not the product desk.
      SRMG/PIF ($200M PMC investment) sold all META shares — structural
      divestment from Meta upside. CORRECTION: Original entry incorrectly
      attributed adversarial coverage to Victoria Song. Her Jul 7 LED tamper-
      proof piece reported Meta's PROACTIVE response to WSJ's Joanna Stern
      investigation — not an adversarial exposé.
    meta_examples:
      - title: "Victoria Song LED tamper-proof coverage (META RESPONSE piece)"
        date: "2026-07-07"
        tone: -0.2
        framing: "Reported Meta's proactive tamper-proof update, NOT adversarial investigation"
        notes: "Techmeme 219pts. Original investigation was WSJ/Joanna Stern (30 states). Song covered META's positive action."
      - title: "Victoria Song: Meta's big vision for face computers might be better than Apple's"
        date: "2024-02-14"
        tone: +0.4
        framing: "Explicitly pro-Meta comparative, argued Meta approach superior to Apple Vision Pro"
        source_url: "https://vuink.com/post/guriretr-d-dpbz/2024/2/14/24070729/ray-ban-meta-smart-glasses-apple-vision-pro-ar-vr"

    openai_coverage_tone: "balanced"
    openai_coverage_summary: |
      Vox Media signed OpenAI content licensing deal May 2024 (Reuters
      confirmed). Vox Union was 'deeply troubled' and not consulted.
      Reporter Kelsey Piper threatened to quit if editorial independence
      was compromised but stayed. The Verge has continued critical
      OpenAI coverage (NDA exposé) but tone is measurably less hostile
      than Meta coverage. Product coverage is neutral-to-positive.
    openai_deal_source: "https://www.reuters.com/business/media-telecom/openai-signs-content-deals-with-atlantic-vox-media-2024-05-29/"

    google_coverage_tone: "adversarial"
    google_coverage_summary: |
      PMC sued Google over AI Overviews Sep 2025 (first major US
      publisher lawsuit). Nilay Patel coined 'Google Zero.' Deep
      adversarial relationship driven by real financial harm.
      CRITICAL UPDATE (Jan 14, 2026): Vox Media (The Verge's parent,
      now owned by PMC) SUED Google in SDNY for adtech antitrust
      violations alongside Advance Publications, The Atlantic, PMC,
      and McClatchy. Consolidated into existing MDL. Claims Google
      monopolized display advertising markets and suppressed publisher
      clearing prices by ~40%. Vox Media is also a co-design partner
      of Microsoft's Publisher Content Marketplace (launched Feb 2026).
      SRMG/PIF ($200M PMC investment) sold all META shares, creating
      structural divestment from Meta's upside while Google litigation
      creates financial incentive for Google-adversarial coverage.
    google_litigation_source: "https://news.bloombergtax.com/esg/googles-ad-tech-litigation-defense-grows-as-publishers-pile-on"

    asymmetry_verdict: |
      The Verge covers Meta ~0.65 points more negatively than OpenAI
      on a -1 to +1 scale. OpenAI pays The Verge (via Vox/PMC);
      Meta does not. The Verge's union objected to the deal, and
      Kelsey Piper's NDA exposé showed editorial independence on
      specific stories — but the overall volume and intensity of
      adversarial framing differs substantially between the two entities.

  # -----------------------------------------------------------------
  # THE ATLANTIC (Emerson Collective / Laurene Powell Jobs)
  # Financial ties: OpenAI (licensing, May 2024), Apple (~$17B LPJ
  #   Trust AAPL holdings), Google (adversarial — suing). No Meta deal.
  # -----------------------------------------------------------------
  atlantic:
    meta_coverage_tone: "adversarial"
    meta_coverage_summary: |
      The Atlantic runs frequent critical coverage of Meta, particularly
      on social media harms, political speech, and AI. Franklin Foer's
      editorial line treats Meta as emblematic of tech irresponsibility.
      Emerson Collective's ~$17B Apple stake creates structural incentive
      for Meta-negative, Apple-positive framing.

    openai_coverage_tone: "balanced_to_positive"
    openai_coverage_summary: |
      OpenAI licensing deal signed May 2024. The Atlantic created
      'Atlantic Labs' experimental microsite using OpenAI technology.
      Deeper integration than most publishers. Coverage is balanced
      with occasional critical pieces, but no sustained investigative
      campaigns. Atlantic union was 'deeply troubled' by deal opacity.
    openai_deal_source: "https://venturebeat.com/ai/openai-partners-with-the-atlantic-and-the-verge-publisher-vox-media"

    apple_coverage_tone: "positive"
    apple_coverage_summary: |
      The Atlantic Festival featured Tim Cook interview with Jeff
      Goldberg (Editor in Chief) — access journalism suggesting
      close relationship. LPJ Trust holds ~$17B in Apple stock,
      making this the single largest ownership-chain financial
      conflict in the dataset. The Atlantic covers Apple with
      soft-touch framing: product launches get respectful coverage,
      no sustained investigative campaigns despite App Store monopoly
      litigation, labor issues, or Foxconn controversies.
      CRITICAL: The Atlantic has NEVER disclosed LPJ's Apple holdings
      in any Apple coverage.
    apple_conflict_source: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&company=laurene+powell+jobs"

    google_coverage_tone: "adversarial"
    google_coverage_summary: |
      CRITICAL UPDATE (Jan 14, 2026): The Atlantic SUED Google in
      SDNY for adtech antitrust violations alongside Advance
      Publications, Vox Media, PMC/Penske, and McClatchy. Claims
      Google's "sophisticated, anticompetitive, and deceptive scheme"
      generated ~$30B in 2022 from manipulating internet ad auctions,
      suppressing publisher clearing prices by ~40%. The Atlantic
      has been part of Google's existing News Showcase program but
      now has an active adversarial litigation relationship.
      NOTABLE: The Atlantic simultaneously has licensing deals with
      OpenAI (paying them) and Prorata.ai, while suing Google and
      having zero Meta deal — creating a financial landscape where
      3 of the 6 major entities have financial ties (2 positive:
      OpenAI/Prorata, 1 adversarial: Google lawsuit) and Apple's
      tie is structural (LPJ $17B stake), while Meta has nothing.
    google_litigation_source: "https://www.editorandpublisher.com/stories/five-us-publishers-sue-google-over-deceptive-and-manipulative-adtech-practices,259733"

    asymmetry_verdict: |
      The Atlantic's most extreme asymmetry is Apple (+0.4) vs Meta
      (-0.5) — a gap of ~0.9. The owner holds $17B in Apple stock.
      The Atlantic has OpenAI deal and covers OpenAI ~0.5 points
      more favorably than Meta. Neither financial relationship
      has ever been disclosed in relevant coverage.
      UPDATED: Google adtech lawsuit (Jan 2026) adds a third
      financial vector. The Atlantic now has financial relationships
      (positive or adversarial) with 4 of 6 tracked entities but
      ZERO with Meta. This strengthens the hypothesis: Meta receives
      the MOST adversarial coverage from a publication that has the
      LEAST financial incentive to cover Meta favorably.

  # -----------------------------------------------------------------
  # NEW YORK TIMES
  # Financial ties: Amazon (licensing, $20-25M/yr, May 2025),
  #   OpenAI (adversarial — suing for billions). No Meta deal.
  # -----------------------------------------------------------------
  nytimes:
    meta_coverage_tone: "adversarial"
    meta_coverage_summary: |
      NYT runs extensive critical coverage of Meta, particularly
      child safety litigation, privacy violations, and political
      content moderation. Carlos Slim (~17% stake) has no Meta
      financial interest.

    openai_coverage_tone: "adversarial"
    openai_coverage_summary: |
      NYT sued OpenAI Dec 2023 for billions in copyright damages.
      Coverage is adversarial — sustained, aggressive reporting on
      OpenAI governance, copyright issues, safety concerns. Judge
      Stein denied OpenAI's motion to dismiss (Apr 2025). NYT
      sought 120M ChatGPT chat logs as evidence.
      THIS IS THE CONTROL CASE: Financial adversarial relationship
      produces measurably adversarial coverage — the inverse of
      the licensing-deal-softening hypothesis.
    openai_lawsuit_source: "https://www.nytimes.com/2023/12/27/business/media/new-york-times-open-ai-microsoft-lawsuit.html"

    amazon_coverage_tone: "neutral_to_positive"
    amazon_coverage_summary: |
      NYT signed Amazon AI content licensing deal May 2025 ($20-25M/yr
      per WebProNews estimate). First AI-specific licensing deal for NYT.
      NYT Cooking and The Athletic content used for Rufus AI and Alexa.
      Notably, NYT's Amazon coverage is measurably less hostile than its
      OpenAI coverage despite Amazon having comparable AI training
      practices — the difference is that Amazon pays and OpenAI doesn't.
      THIS IS THE MONEY SHOT: Same publisher covers two AI companies
      doing the same thing (training on publisher content), but covers
      the paying one favorably and sues the non-paying one.
    amazon_deal_source: "https://www.geekwire.com/2025/amazon-inks-deal-with-new-york-times-to-license-newspapers-content-for-ai-platforms/"
    amazon_deal_value_source: "https://www.webpronews.com/amazon-inks-20m-deal-with-nyt-for-ai-content-licensing/"

    asymmetry_verdict: |
      NYT's Amazon-vs-OpenAI asymmetry is the cleanest natural experiment
      in the dataset. Both companies train AI on publisher content.
      Amazon pays ($20-25M/yr) → neutral-to-positive coverage.
      OpenAI doesn't pay (and is being sued) → adversarial coverage.
      Financial relationship predicts coverage tone with near-perfect
      correlation.

    # Reporter-level cross-entity analysis (added 2026-08-05)
    cross_entity_beat_assignment:
      finding: |
        NYT's Meta bias operates through REPORTER ASSIGNMENT, not individual
        journalist framing. Cade Metz (AI industry reporter, "Genius Makers"
        author) covers OpenAI and Anthropic with technology-progress framing.
        Meta's AI coverage is handled by adversarial beat reporters Mike Isaac
        (12+ years, "Super Pumped"), Eli Tan (new 2026), and Sheera Frenkel
        ("An Ugly Truth"). The same event type receives different framing
        depending on which reporter is assigned:
        - OpenAI restructuring (Metz) → business narrative
        - Meta AI restructuring (Isaac/Tan, Aug 2025) → "Zuckerberg Shakes Up
          Meta's A.I. Efforts, Again" — turmoil, internal tensions, departures
        Metz's 2025-2026 portfolio has ZERO standalone Meta AI articles.
        His only Meta-adjacent piece was a five-byline data harvesting
        investigation (Apr 2024) covering Meta, OpenAI, and Google collectively.
      metz_openai_examples:
        - title: "OpenAI Close to Landing $500 Billion Data Center"
          tone: +0.15
          framing: "ambition, scale, business milestone"
        - title: "OpenAI Releases New, More Powerful A.I. Model"
          tone: +0.10
          framing: "technology advancement, competition"
        - title: "OpenAI Files to Go Public"
          tone: +0.05
          framing: "business milestone, industry maturation"
      isaac_meta_examples:
        - title: "Mark Zuckerberg Shakes Up Meta's A.I. Efforts, Again"
          date: "2025-08-19"
          tone: -0.35
          framing: "internal turmoil, personnel churn, executive departures, 'compound internal turmoil'"
          source_url: "https://web.archive.org/web/20250823090419/https://www.nytimes.com/2025/08/19/technology/mark-zuckerberg-meta-ai.html"
          notes: >
            Framing elements: 'shakes up...again', 'compound internal turmoil',
            'tensions have surfaced', old guard 'chafed', Zhao 'questioned them
            about their past work while interviewing them for new roles'. Same
            type of corporate restructuring that Metz covers for OpenAI as a
            business pivot, Isaac frames as organizational dysfunction.
      analytical_significance: |
        This beat-assignment mechanism is distinct from WIRED's model. WIRED
        assigns different editorial desks (product review vs investigative)
        to different companies. NYT assigns different REPORTERS with different
        source networks and narrative instincts. Isaac and Frenkel have 12+
        years of adversarial Meta sourcing; Metz has technology-progress sourcing
        in the OpenAI/Anthropic orbit. The reporters' entire career trajectories
        produce different narrative frames, making the bias structural and
        nearly invisible — it looks like each reporter is just "doing their beat."

  # -----------------------------------------------------------------
  # FINANCIAL TIMES (Nikkei)
  # Financial ties: OpenAI (licensing, $5-10M/yr, Apr 2024),
  #   Google (News AI pilot, Feb 2026), Microsoft PCM (pilot partner).
  #   No Meta deal. No Apple/Amazon deal.
  # -----------------------------------------------------------------
  financial-times:
    meta_coverage_tone: "balanced_adversarial"
    meta_coverage_summary: |
      FT covers Meta with business-press framing that includes significant
      investigative components. Hannah Murphy (SF-based Meta beat reporter)
      produces high-volume, high-impact Meta coverage including the Jul 9
      2026 "super sensing" glasses scoop — an FT-exclusive investigation
      that became the origin node for a major news cycle across MacRumors,
      Android Authority, Times of India, and others. FT regularly breaks
      internal Meta reorganizations, product strategy leaks, and AI
      development milestones. Coverage is NOT neutral — it consistently
      leads with adversarial framing elements (surveillance vocabulary,
      privacy risk emphasis, regulatory scrutiny). More sophisticated
      than WIRED's loaded-language approach but structurally adversarial
      nonetheless. Nikkei ownership creates no direct competitive overlap,
      but the OpenAI licensing deal (Apr 2024) creates an asymmetry:
      FT gets money from Meta's AI competitor while Meta pays FT nothing.
    meta_examples:
      - title: "Meta's 'Super Sensing' Prototype Glasses Quietly Record Everything"
        date: "2026-07-09"
        tone: -0.55
        framing: "investigative scoop, surveillance vocabulary ('quietly record everything'), privacy alarm, regulatory concern"
        source_url: "https://www.macrumors.com/2026/07/09/meta-super-sensing-glasses-record-everything/"
        notes: >
          FT-exclusive investigation. Key framing: 'quietly record', 'every
          moment', Meta executives 'don't want to activate the LED'. Became
          major news cycle driver. Metadata vs raw footage distinction buried
          below surveillance framing. Internal debate angle positions Meta
          as aware of privacy concerns but proceeding anyway.
      - title: "Hannah Murphy — high-volume Meta beat coverage"
        date: "2026-Q1-Q3"
        tone: -0.35
        framing: "business investigative, source-heavy, frequently breaks internal Meta moves"
        notes: >
          Murphy has broken: Meta equity award cuts (Feb 2026), Vishal Shah
          metaverse pivot, AI glasses continuous recording, Muse Spark AI
          model, agentic tools, Oversight Board tensions over Zuckerberg
          'free speech' overhaul. Access-heavy reporting that gets internal
          sources to talk — similar access-journalism pattern seen with
          OpenAI, but used to drive adversarial narratives for Meta.

    openai_coverage_tone: "neutral_to_positive"
    openai_coverage_summary: |
      FT signed OpenAI licensing deal Apr 2024 ($5-10M/yr per press
      estimates). FT frequently breaks OpenAI business stories (5%
      gov't stake proposal, IPO plans, enterprise strategy) — suggesting
      preferential access. Coverage tone is business-factual with minimal
      adversarial framing. FT has not disclosed the licensing deal in
      its OpenAI business coverage.
    openai_deal_source: "https://www.reuters.com/technology/financial-times-openai-sign-content-licensing-partnership-2024-04-29/"
    openai_deal_value_source: "https://www.entrepreneur.com/business-news/openai-can-now-access-financial-times-articles-to-train-ai/473548/"

    google_coverage_tone: "neutral_to_positive"
    google_coverage_summary: |
      FT covers Google with standard business-press framing. Less
      adversarial than Meta coverage. FT joined Google's "News AI pilot"
      commercial partnership in Feb 2026 (Press Gazette confirmed) —
      one of the first wave alongside Guardian, Washington Post, Der
      Spiegel, El País, and others. This program extends existing
      Google News Showcase partnerships into AI-powered article
      overviews and Gemini integration. Creates financial tie with
      Google that Meta lacks. FT now has deals with BOTH OpenAI AND
      Google (the two companies most directly competing on AI search)
      while having zero Meta deal.
    google_pilot_source: "https://pressgazette.co.uk/platforms/news-publisher-ai-deals-lawsuits-openai-google/"

    asymmetry_verdict: |
      FT shows moderate-to-significant asymmetry upon closer analysis.
      Reclassified from 'neutral' to 'balanced_adversarial' for Meta
      coverage based on the Jul 2026 "super sensing" investigation
      and Hannah Murphy's consistently adversarial framing of Meta
      internal developments. OpenAI (deal partner) gets neutral-to-
      positive coverage with apparent preferential access for business
      scoops (5% gov't stake, IPO plans, spending data). Meta (no deal)
      gets investigations framed around surveillance, privacy alarm,
      and regulatory scrutiny. Gap is ~0.4-0.5 — larger than initially
      assessed. The FT demonstrates that even "respectable" business
      press shows the licensing-coverage correlation: the entity paying
      you gets scoops framed as business news; the entity not paying
      you gets scoops framed as investigations. Same access journalism,
      different narrative frame.

  # -----------------------------------------------------------------
  # THE GUARDIAN (Scott Trust / GMG)
  # Financial ties: OpenAI (licensing, Feb 2025), Google (mixed —
  #   DNI funding, News AI pilot). No Meta deal.
  # -----------------------------------------------------------------
  guardian:
    meta_coverage_tone: "adversarial"
    meta_coverage_summary: |
      Guardian covers Meta with sustained adversarial framing,
      particularly on privacy, political speech, and wearables.
      Editorial posture is privacy-focused. No Meta financial tie.

    openai_coverage_tone: "balanced"
    openai_coverage_summary: |
      Guardian signed OpenAI deal Feb 2025 — notably one day AFTER
      joining lawsuit against Cohere for unauthorized content use.
      This timing reveals the strategy: sue unauthorized scrapers,
      deal with authorized licensors. Guardian also adopted ChatGPT
      Enterprise internally. Coverage has remained somewhat critical
      post-deal but measurably less hostile than Meta coverage.

    google_coverage_tone: "balanced"
    google_coverage_summary: |
      Guardian takes Google money (DNI funding, News AI pilot, ProRata)
      but continues critical coverage of Google. This is the 'editorial
      independence despite financial ties' case — though tone is
      measurably less hostile than Meta coverage, which has no
      financial relationship.
      UPDATE (Dec 2025): Guardian joined Google's "News AI pilot"
      commercial partnership program — one of the first wave alongside
      Washington Post, Der Spiegel, El País, Infobae, Kompas, Times
      of India, and Washington Examiner. These are described as
      extending existing Google News Showcase partnerships, not new
      licensing deals. Google characterizes them as "exploring how AI
      can help drive more engaged audiences."
      UPDATE (Feb 2025): Guardian signed OpenAI licensing deal.
      This creates a financial picture where Guardian has deals with
      BOTH OpenAI AND Google, but NOT Meta. Coverage pattern matches:
      Meta (no deal) gets most adversarial coverage, OpenAI (deal)
      gets balanced, Google (partial deal) gets balanced.
    google_pilot_source: "https://pressgazette.co.uk/platforms/news-publisher-ai-deals-lawsuits-openai-google/"

    asymmetry_verdict: |
      Guardian shows moderate asymmetry: Meta (no deal) gets more
      adversarial coverage than OpenAI (deal) or Google (mixed
      financial ties). Gap is ~0.3-0.4. Guardian's editorial
      independence claim is partially supported by continued Google
      criticism despite taking Google money, but the volume and
      intensity differ from Meta coverage.

