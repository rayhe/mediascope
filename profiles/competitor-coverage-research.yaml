# ===================================================================
# COMPETITOR COVERAGE RESEARCH — Cross-Entity Asymmetry Evidence
# Created: 2026-08-04
# Purpose: Document specific coverage examples showing differential
#   treatment of Meta vs. competitors by publications with financial
#   ties to those competitors. Each entry has a source URL.
# ===================================================================

research_period: "2024-08-01 to 2026-08-04"
methodology: |
  For each profiled publication, we compared coverage tone and framing
  of Meta against coverage of companies that pay the publication (via
  AI content licensing deals) or are financially connected. Every
  finding is sourced to a specific article or primary document.

# ===================================================================
# PUBLICATION × ENTITY COVERAGE FINDINGS
# ===================================================================

publications:

  # -----------------------------------------------------------------
  # WIRED (Condé Nast / Advance Publications)
  # Financial ties: OpenAI (licensing, Aug 2024), Amazon (licensing via
  #   Rufus, Jul 2025), Microsoft PCM (Feb 2026), Perplexity (deal
  #   confirmed Adweek Dec 2025). Apple (negotiating since Dec 2023).
  #   No Meta deal. No Google deal.
  # -----------------------------------------------------------------
  wired:
    meta_coverage_tone: "adversarial"
    meta_coverage_summary: |
      WIRED under Katie Drummond has made Meta its primary investigative
      target. The NameTag/facial recognition investigation (Jun 2026)
      triggered Meta to emergency-delete dormant code. WIRED runs
      sustained adversarial coverage of Meta wearables, child safety,
      and privacy. Coverage uses loaded language, catastrophizing, and
      editorial dramatization at rates 3-5x above baseline for other
      entities. Silence on Meta reached 18 consecutive days (Jul 17 -
      Aug 4, 2026) after the initial NameTag wave.
    meta_examples:
      - title: "Meta's Smart Glasses Had Hidden Facial Recognition Code"
        date: "2026-06-08"
        tone: -0.85
        framing: "investigative exposé, loaded language ('dormant surveillance'), fear appeal"
        source_url: "https://www.techdigest.tv/2026/06/meta-abandons-facial-recognition-for-smart-glasses-after-wired-investigation.html"
        notes: "Prompted Meta emergency code deletion. Andy Stone called it 'intellectually dishonest' and 'pure advocacy-driven click bait.'"

    openai_coverage_tone: "neutral_to_positive"
    openai_coverage_summary: |
      Despite covering OpenAI governance crises (Nov 2023 board coup,
      sycophancy scandal), WIRED's OpenAI coverage is notably less
      hostile than its Meta coverage. No sustained investigative campaigns.
      Product reviews are balanced-to-positive. Condé Nast signed
      an OpenAI content licensing deal Aug 2024 (Reuters confirmed).
      WIRED has never disclosed this financial relationship in articles
      about OpenAI. Coverage of OpenAI sycophancy was based on VentureBeat's
      reporting, not original investigation.
    openai_examples:
      - title: "OpenAI Overrode Expert Tester Concerns (sycophancy coverage)"
        date: "2025-Q4"
        tone: -0.2
        framing: "balanced critical, no loaded language, factual reporting"
        notes: "Compare to Meta coverage: same type of 'company ignored safety warnings' story, but 2-3x less hostile framing"

    amazon_coverage_tone: "neutral"
    amazon_coverage_summary: |
      Condé Nast signed an Amazon Rufus AI licensing deal Jul 2025
      (Digiday confirmed). WIRED's Amazon coverage focuses on product
      reviews (Alexa, Ring) with standard tech-review framing. No
      sustained investigative campaigns against Amazon despite
      comparable privacy concerns (Ring doorbell surveillance,
      Alexa recording).
    amazon_deal_source: "https://digiday.com/media/conde-nast-and-hearst-strike-amazon-ai-licensing-deals-for-rufus/"

    microsoft_coverage_tone: "neutral_to_positive"
    microsoft_coverage_summary: |
      Condé Nast joined Microsoft's Publisher Content Marketplace (PCM)
      as a pilot partner (Feb 2026, WebWire press release). PCM licenses
      Condé Nast's U.S. text-based editorial content for grounding
      AI-generated summaries in Microsoft Copilot. Co-designed with
      Business Insider, Hearst, AP, USA Today, and Vox Media. Yahoo
      is the first external demand partner. This is a MARKETPLACE
      model — unlike bilateral OpenAI/Amazon deals — meaning Condé
      Nast's content can be licensed to multiple AI builders through
      Microsoft's infrastructure. Meta is NOT a PCM participant.
    microsoft_pcm_source: "https://www.WebWire.com/ViewPressRel.asp?aId=350303"
    microsoft_pcm_marketplace_source: "https://searchengineland.com/microsoft-launches-publisher-content-marketplace-for-ai-licensing-468191"

    perplexity_coverage_tone: "neutral"
    perplexity_coverage_summary: |
      Condé Nast has a content licensing agreement with Perplexity
      via the Comet Plus subscription program (launched Oct 1, 2025).
      16 Condé Nast titles participate including The New Yorker, Wired,
      Vogue, GQ, Vanity Fair, and Architectural Digest. Compensation
      is based on human engagement, AI-driven interactions, and content
      usage in training (PPC Land, Adweek confirmed).

      HYPOCRISY ARC: This deal followed a remarkable sequence:
      (1) Jun 2024: WIRED accused Perplexity of plagiarism in original
          investigation, called it a "bullshit engine"
      (2) Jul 2024: Condé Nast sent cease-and-desist to Perplexity
          (per The Information)
      (3) Oct 2025: Condé Nast SIGNED deal with Perplexity via Comet Plus

      This pattern demonstrates that editorial complaints about AI companies
      using content without permission are resolved by financial deals.
      WIRED's plagiarism accusation against Perplexity (a non-Meta company)
      was resolved with a revenue-sharing deal. Meta's identical alleged
      behavior (using publisher content for AI) has NEVER been resolved
      with a deal — only with sustained adversarial coverage. The double
      standard is: accuse of plagiarism → sign deal (Perplexity), accuse
      of surveillance → sustained investigation (Meta).
    perplexity_deal_source: "https://www.adweek.com/media/conde-nast-vasanth-williams-chief-product-technology-officer-microsoft-ai-licensing-pilot/"
    perplexity_comet_plus_source: "https://ppc.land/conde-nast-ceo-calls-google-ai-a-death-blow-as-search-traffic-collapses/"
    perplexity_plagiarism_source: "http://venturebeat.com/ai/perplexity-unveils-revenue-sharing-plan-for-publishers"

    advance_reddit_perplexity_triangle:
      discovery_date: 2026-08-06
      description: |
        THE ADVANCE-REDDIT-PERPLEXITY TRIANGLE — most acute undisclosed
        conflict-of-interest in AI content licensing:
        (1) Reddit (Advance's largest asset, ~$5.9B, ~62% voting control)
            is SUING Perplexity for DMCA violations. Jul 31 2026: Judge
            Engelmayer (SDNY) rejected most of Perplexity's dismissal bid.
            Reddit also suing Anthropic separately in CA state court.
        (2) Condé Nast (Advance's wholly-owned subsidiary, WIRED's parent)
            has an ACTIVE licensing deal with Perplexity via Comet Plus
            (Oct 2025). 16 Condé Nast titles participate.
        (3) Same ultimate owner (Advance Publications / Newhouse family)
            simultaneously PROFITS from Perplexity (Condé Nast deal) and
            SUES it (Reddit, seeking $150M+ damages).
        ADDITIONAL WRINKLE: Sam Altman owns 8.7% of Reddit AND is CEO of
        OpenAI, which has deals with BOTH Reddit ($60-70M/yr) and Condé
        Nast. Altman has personal financial interest in Reddit's success,
        which aligns with Advance's interest.
      reddit_deal_renewal_forecast: |
        Wells Fargo analyst Alec Brondolo (Jun 2026): Reddit's renewed
        Google + OpenAI deals could reach COMBINED $550M/yr — 4x+ the
        current ~$120-140M/yr level. At 23.3% economic stake, Advance
        would capture ~$128M/yr in proportional equity value accretion.
        This makes WIRED's editorial narrative about "AI must pay for
        content" financially worth hundreds of millions to Advance via
        Reddit — completely undisclosed.
      source_urls:
      - https://www.reuters.com/legal/litigation/perplexity-ai-loses-bid-toss-reddit-lawsuit-over-data-scraping-2026-07-31/
      - https://www.barrons.com/articles/buy-reddit-stock-price-pick-eef67fe8
      - https://digiday.com/marketing/reddit-questions-if-ai-data-deals-could-hurt-its-ad-business/

    deal_count_summary: |
      As of Aug 2026, Condé Nast (WIRED's parent) has AI licensing
      deals with FIVE entities: OpenAI, Amazon, Microsoft, Perplexity,
      and Apple (negotiating). Condé Nast has deals with ZERO of Meta's
      direct competitors in the social/messaging space — its deals are
      exclusively with AI labs (OpenAI, Perplexity) and cloud platforms
      (Amazon, Microsoft). Meta, which competes most directly with
      Condé Nast's social traffic sources (Facebook referrals, Instagram),
      is the ONLY major tech company that Condé Nast has no deal with
      AND no deal in progress with.

    conde_nast_revenue_pivot:
      overview: |
        Condé Nast CEO Roger Lynch has explicitly abandoned advertising
        as a growth engine (WSJ, Oct 2025; FT, Feb 2026; annual memo,
        Mar 2026). The company's stated revenue strategy now centers on
        events, subscriptions, commerce, and AI licensing deals — with
        OpenAI, Perplexity, Microsoft, and Amazon specifically named.
        This transforms AI licensing from supplementary income to an
        EXISTENTIAL revenue pillar. When the CEO tells teams to "plan
        as if search is zero" and names AI deals as growth replacements,
        every financial incentive pushes editorial coverage toward
        protecting those AI relationships.
      lynch_statements:
        - quote: "We don't expect advertising to be a growth engine for the business."
          source: "WSJ interview, October 2025"
          source_url: "https://www.adexchanger.com/daily-news-roundup/tuesday-29102025/"
        - quote: "Search will play a diminished role in our traffic and this is an assumption we are building our strategy around."
          source: "Annual CEO memo, March 1 2026"
          source_url: "https://www.mediapost.com/publications/article/413157/conde-nast-digs-in-ceo-roger-lynch-describes-grow.html"
        - quote: "Assume there's no search. You have to have your businesses planned as if search is zero."
          source: "TBPN interview, May 13 2026"
          source_url: "https://ppc.land/conde-nast-ceo-human-journalism-will-win-in-the-age-of-ai-slop/"
        - quote: "Google search is no longer a meaningful driver [of traffic]... another sort of death blow."
          source: "Financial Times interview, February 27 2026"
          source_url: "https://ppc.land/conde-nast-ceo-calls-google-ai-a-death-blow-as-search-traffic-collapses/"
      revenue_data_2025:
        total_revenue_approx: "$2B (RocketReach)"
        events_growth: "+40% YoY (Adweek, May 2026)"
        events_projected_2026: "+22% YoY"
        subscriptions_growth: "+10% YoY"
        digital_subscriptions_growth: "+29% YoY"
        commerce_growth: "+13% YoY"
        branded_content_growth: "+9% YoY"
        top_7_brands_share: "85% of total revenue"
        ai_deals_named: "OpenAI, Perplexity, Microsoft, Amazon"
        ai_pilots_running: 70
        source_urls:
          - "https://www.adweek.com/media/conde-nast-events-revenue-2026/"
          - "https://www.mediapost.com/publications/article/413157/conde-nast-digs-in-ceo-roger-lynch-describes-grow.html"
          - "https://Rocketreach.co/answers/what-is-the-annual-revenue-of-conde-nast_b5f542b3f42d3402"
      microsoft_openai_axis_exposure: |
        Two of Condé Nast's five AI deals (OpenAI licensing + Microsoft PCM)
        flow into the Microsoft-OpenAI financial axis:
        - Microsoft owns 27% of OpenAI (~$135B)
        - Microsoft receives 20% of OpenAI's revenue through 2030
        - OpenAI committed $250B in Azure purchases to Microsoft
        This means Condé Nast's OpenAI licensing revenue partially flows
        to Microsoft (via 20% revenue share), and its PCM licensing revenue
        comes directly from Microsoft. The two "separate" deals are
        economically one relationship with a unified financial system.
        If WIRED publishes adversarial coverage of EITHER Microsoft OR
        OpenAI, it risks BOTH revenue streams. If WIRED publishes adversarial
        coverage of Meta (zero deals), it risks NOTHING.
      editorial_independence_paradox: |
        Lynch simultaneously claims:
        (1) "firm stance against those who scrape and repurpose our journalism
            without permission" (annual memo, Mar 2026)
        (2) AI licensing deals with OpenAI, Microsoft, Perplexity, Amazon
            are core to the revenue strategy
        The paradox: the companies most aggressively using publisher content
        for AI training (OpenAI, Google) are ALSO the ones Condé Nast has
        commercial relationships with. The "firm stance" is selectively
        applied — adversarial toward companies WITHOUT deals (Meta, which
        uses no publisher content for Llama training), accommodating toward
        companies WITH deals (OpenAI, which the NYT accuses of massive
        copyright infringement, and Perplexity, which WIRED itself
        previously accused of plagiarism before signing a deal).
      source_urls:
        - "https://www.adexchanger.com/daily-news-roundup/tuesday-29102025/"
        - "https://www.mediapost.com/publications/article/413157/conde-nast-digs-in-ceo-roger-lynch-describes-grow.html"
        - "https://www.adweek.com/media/conde-nast-events-revenue-2026/"
        - "https://ppc.land/conde-nast-ceo-human-journalism-will-win-in-the-age-of-ai-slop/"
        - "https://ppc.land/conde-nast-ceo-calls-google-ai-a-death-blow-as-search-traffic-collapses/"

    apple_coverage_tone: "neutral_to_positive"

    apple_coverage_summary: |
      Apple in negotiation for Condé Nast AI content deal (Reuters,
      Dec 2023). WIRED covers Apple product launches with standard
      tech-review framing. Vision Pro received critical but respectful
      coverage. No investigative campaigns against Apple despite
      App Store monopoly litigation and labor issues. Privacy-positive
      framing of Apple's Private Cloud Compute — contrast with
      adversarial framing of Meta's identical on-device AI processing.
      WEARABLES LANE ASSIGNMENT: Lauren Goode (WIRED's senior consumer
      tech correspondent) reviews Apple Vision Pro with deeply personal,
      emotional narrative — "I cried" / "The view is incredible" /
      "I was starting to love this thing." Apple Vision Pro has 12
      outward-facing cameras, 5 sensors, 6 microphones — the most
      surveillance-capable consumer wearable ever sold — yet receives
      ZERO surveillance/privacy framing in Goode's review. Criticism
      focuses on isolation and loneliness, not data harvesting or
      bystander consent. The same journalist also reviews Snap Spectacles
      with playful positive framing ("Face Camera We've Been Waiting For").
      Meanwhile, Meta's single-12MP-camera glasses are assigned to
      investigative reporters (Dell Cameron, Dhruv Mehrotra) who frame
      them as "dormant surveillance infrastructure."
