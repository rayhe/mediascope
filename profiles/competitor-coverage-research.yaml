    sensor_count_paradox: |
      THE MIT TR SENSOR-COUNT PARADOX:
      
      Apple Vision Pro: 12 cameras, 5 sensors, 6 microphones, LiDAR,
      TrueDepth camera, iris biometric scanner (OpticID), flicker sensor,
      ambient light sensor, 4 inertial measurement units = ~30+ sensors.
      MIT TR coverage: "privacy-protective," "industry-leading security,"
      "personalized AI in a private cloud" (positive framing).
      
      Meta Ray-Ban glasses: 1 camera, 3 microphones = 4 sensors.
      MIT TR coverage: "stake a claim on our faces," "additional
      surveillance," "cloaked in Ray-Ban Stories" (adversarial framing).
      
      Apple Vision Pro has ~7.5x MORE sensors than Meta Ray-Ban glasses.
      Apple Vision Pro performs iris biometric scanning (unique identifier).
      Apple Vision Pro 3D-maps the user's entire physical environment.
      Meta Ray-Ban glasses take photos and short videos when prompted.
      
      The entity with MORE sensors, MORE invasive biometric capability,
      and MORE environmental mapping gets LESS surveillance language.
      This pattern matches WIRED (Lauren Goode: Apple Vision Pro 12
      cameras = emotional narrative; Meta 1 camera = surveillance) and
      FT (Google/Samsung glasses with cameras = "AI-powered eyewear";
      Meta glasses = "wiretapping laws"). MIT TR extends the camera-count
      paradox into a THIRD publication.
      
      UNIQUE MIT TR DIMENSION: Unlike WIRED (where the asymmetry
      correlates with licensing deals) or FT (where it correlates with
      news partnership revenue), MIT TR's Apple asymmetry correlates
      with GOVERNANCE-LEVEL institutional ties — an Apple VP literally
      sitting on MIT's board of trustees. This is the deepest governance
      conflict in the dataset: not just revenue flowing between entities,
      but a corporate executive with formal fiduciary responsibility
      for the institution that owns the publication.

    asymmetry_verdict: |
      MIT TR shows institutional-level financial influence: companies
      funding MIT research (Amazon, Google) get measurably more
      positive coverage than Meta (no institutional tie). The influence
      mechanism is indirect — it flows through research partnerships
      and academic relationships rather than direct licensing deals.
      
      UPDATED (Aug 6, 2026 — Apple governance conflict analysis):
      Apple receives the MOST favorable coverage of any entity from
      MIT TR, despite MIT TR's parent institution also having research
      ties with Google and Amazon (both of which receive neutral-to-
      positive coverage). Apple's advantage over even Google/Amazon
      suggests a hierarchy of influence:
      
      TIER 1 (strongest): GOVERNANCE — Apple VP on MIT Corporation
      board + CSAIL Alliance = positive coverage, explicit privacy
      praise, zero surveillance language for 30+ sensor wearable.
      
      TIER 2: RESEARCH FUNDING — Google/Amazon fund MIT research
      via Schwarzman College = neutral-to-positive coverage, less
      adversarial than Meta, but still named unfavorably alongside
      Meta in Apple Intelligence article.
      
      TIER 3 (weakest): NO RELATIONSHIP — Meta has zero MIT research
      partnership, zero board representation, zero CSAIL membership
      = adversarial coverage, surveillance language, warfare framing.
      
      The Apple-MIT governance link is the deepest institutional
      conflict in the dataset. News Corp (WSJ) discloses its financial
      ties. WIRED/Verge/FT have licensing deals but no governance
      connections. The Atlantic has ownership-chain stock holdings
      (LPJ Trust $17B). MIT TR has a corporate executive with FORMAL
      FIDUCIARY DUTY to the institution that owns the publication.
      Kate Bergeron owes MIT a duty of care and loyalty as a Corporation
      member; MIT controls MIT TR's board. The conflict is structural,
      permanent, and undisclosed.

