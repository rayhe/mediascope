      and routes data through third-party cloud infrastructure (Google) — a fundamental reversal
      of Apple's 2024 promise that PCC would run exclusively on Apple silicon in Apple data
      centers. WIRED's WWDC coverage instead used "makeover" framing (Brian Barrett, Uncanny
      Valley podcast Jun 11: "Siri's AI Makeover"). The same Jun 11 episode that framed Apple
      as receiving a "makeover" ALSO covered WIRED's own NameTag investigation. Financial
      prediction: Condé Nast/WIRED is IN NEGOTIATIONS for Apple Intelligence content licensing
