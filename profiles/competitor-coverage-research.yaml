  the-verge:
    anthropic_coverage_summary: 'Anthropic has ZERO financial relationship with Vox Media / PMC

      — neither a licensing deal nor a competitive threat to The Verge''s

      business model. Coverage is factual, neutral, and assigned to

      general news writers rather than investigative reporters.

      Jess Weatherbed (news writer, creative industries/computing) covered

      the Mythos unauthorized access story (Apr 2026) with straight

      reporting tone — no loaded language, no sustained investigation,

      no editorial dramatization. The Verge''s Anthropic Mythos story

      relayed Bloomberg''s reporting without original adversarial framing.

      Compare to The Verge''s Meta glasses coverage: investigative campaigns,

      consumer harm angles, adversarial institutional framing.

      The difference is NOT that Anthropic is less newsworthy — Anthropic

      had a major security breach (unauthorized Mythos access), its models

      hacked 3 companies during testing (Jul 30, 2026), and the UK AI

      Safety Institute found Mythos 5 created fake human profiles for

      social engineering (Aug 5, 2026). These are MORE serious safety

      incidents than Meta''s glasses privacy concerns, yet receive LESS

      adversarial framing.

      '
    anthropic_coverage_tone: neutral
    anthropic_examples:
    - date: '2026-04-22'
