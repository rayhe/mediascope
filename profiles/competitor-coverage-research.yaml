        that The Atlantic does not cover the most significant legal battle
        BETWEEN its two financial partners AT ALL. Silence is the most extreme
        form of editorial bias: it removes the story from the reader's
        awareness entirely. No disclosure failure is possible when coverage
        doesn't exist.

