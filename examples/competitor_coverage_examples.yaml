# ===================================================================
# GIZMODO (Keleops AG — Swiss-owned, no tech company ties)
# Financial ties: NONE with any tech company. Control publication.
# ===================================================================
gizmodo:
  openai:
    articles:
      - title: "Gizmodo OpenAI coverage"
        date: "2025-2026"
        tone: -0.35
        framing: ["skeptical_coverage", "consumer_advocacy"]
        notes: >
          No financial ties to anyone. Gizmodo covers all tech companies
          with skeptical consumer-advocacy lens. This is the TRUE CONTROL.

    average_tone: -0.35
    coverage_pattern: >
      Uniformly skeptical of all tech companies. No financial incentive
      to favor any entity. Provides baseline "how would independent
      journalism cover these companies?"

  meta:
    articles:
      - title: "Gizmodo Meta coverage"
        date: "2025-2026"
        tone: -0.40
        framing: ["privacy_criticism", "consumer_skepticism"]
        notes: >
          Slightly more negative than OpenAI coverage, but the gap
          is MUCH smaller than WIRED's (0.05 vs 0.80). Gizmodo's
          independent ownership (Keleops AG) means no financial
          incentive to treat companies differently.

    average_tone: -0.40
    coverage_pattern: >
      Nearly identical tone for OpenAI and Meta. The 0.05-point gap
      is within noise. Compare to WIRED's 0.80-point gap and FT's
      0.15-point gap. Gizmodo proves that independent publications
      WITHOUT financial ties treat tech companies more equally.

# ===================================================================
# ASYMMETRY SUMMARY — Key findings
# ===================================================================
asymmetry_summary:
  key_findings:
    - finding: "WIRED's 0.80-point tone gap between OpenAI (+0.15) and Meta (-0.65) is the largest in the dataset"
      significance: "Correlates directly with Condé Nast receiving $1-5M/yr from OpenAI while having no Meta deal"
      control: "Gizmodo shows only 0.05-point gap — proving the gap is financial, not editorial"

    - finding: "News Corp covers BOTH OpenAI and Meta favorably — because it gets paid by both"
      significance: "This eliminates 'all publications are harsh on Meta' as alternative hypothesis"
      control: "News Corp is the only major publisher with a Meta AI deal, and the only one with favorable Meta coverage"

    - finding: "NYT is adversarial toward OpenAI (suing) but balanced toward Amazon (paid)"
      significance: "Same newsroom, opposite coverage — perfectly explained by financial relationship"
      control: "Proves editorial decisions track financial incentives, not fixed editorial bias"

    - finding: "The Atlantic's $17B Apple ownership stake correlates with favorable Apple coverage"
      significance: "Largest ownership-chain financial conflict in dataset"
      control: "Apple framed as 'privacy champion'; Meta framed as 'surveillance state' by same publication"

    - finding: "FT is a neutral control — roughly equal coverage of OpenAI and Meta"
      significance: "Nikkei ownership creates no competitive conflict with any US tech company"
      control: "Shows what unbiased business journalism looks like"

  statistical_hypothesis:
    null_hypothesis: "Financial relationships do not predict coverage tone"
    alternative: "Publications that receive money from an entity cover it more favorably"
    evidence: >
      Across 9 publications and 7 entities, publications with licensing deals
      average +0.20 tone for paid entities vs -0.45 for unpaid entities
      (0.65-point gap). Publications with adversarial/litigation relationships
      average -0.55 tone. The correlation between financial tie weight and
      coverage tone is positive and significant.
