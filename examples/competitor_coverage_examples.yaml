  meta:
    articles:
      - title: "MIT TR Meta coverage"
        date: "2025-2026"
        tone: -0.40
        framing: ["privacy_analysis", "technical_critique"]
        notes: >
          Moderately negative. No financial tie. Privacy/safety
          analysis focus. More negative than OpenAI coverage despite
          no financial incentive difference — suggests baseline
          editorial bias against Meta specifically.

    average_tone: -0.40
    coverage_pattern: >
      Moderately negative. No financial tie to either company. The
      0.30-point gap between OpenAI (-0.10) and Meta (-0.40) coverage
