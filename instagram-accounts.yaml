metadata:
  compiled: "2026-08-25"
  method: "Web search verification — only handles confirmed via podcast show notes, official bios, influencer databases, or direct attribution included"
  key_finding: >
    Post-Twitter exodus sent most tech journalists to Bluesky, not Threads or Instagram.
    Of ~65 tracked journalists, only 16 have confirmed IG or Threads handles.
    Publications universally maintain official IG accounts; journalists largely do not.
  follower_caveat: >
    All follower counts are approximate, sourced from third-party trackers with varying
    snapshot dates. Instagram's May 2026 bot purge reduced counts 2-5% platform-wide.
  threads_caveat: >
    Only NYT's Threads presence was independently confirmed with follower data.
    All other publication Threads handles are inferred from IG handle patterns but
    not independently verified via threads.net. Individual journalist Threads handles
    were confirmed from podcast/article attribution.
